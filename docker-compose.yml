# ============================================================================
# klid-label 풀스택 배포 (cudo_246 / Docker compose v2)
#   - 모든 리소스 klid- 프리픽스로 격리 (기존 컨테이너 무영향)
#   - postgres 볼륨/스토리지는 /data 하위 (루트 / 디스크 보호)
#   - ai-server 는 nvidia 기본 런타임으로 GPU 자동 사용
#   - backend 는 local 프로파일 + 번들 postgres 로 자립 기동 (ENV 미설정)
# ============================================================================

services:
  klid-postgres:
    image: postgres:16
    container_name: klid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CONTROL_DB_USERNAME:-klid_user}
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:-changeme}
      POSTGRES_DB: ${CONTROL_DB_NAME:-klid_system}
      PORTAL_DB_NAME: ${PORTAL_DB_NAME:-portal}
    # 추가 DB(portal) 생성 — control DB 외 portal DataSource 연결용
    volumes:
      - /data/klid/pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - klid-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONTROL_DB_USERNAME:-klid_user} -d ${CONTROL_DB_NAME:-klid_system}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  # 스토리지 디렉토리 프로비저닝(one-shot) — host bind-mount 가 root 소유로 생성돼 비루트(uid 999)
  # backend 가 영상 저장 경로(raw/)에 못 쓰는 AccessDenied 방지. backend 기동 전 1회 mkdir+chown.
  klid-storage-init:
    image: busybox:1.36
    container_name: klid-storage-init
    command: sh -c "mkdir -p /storage/raw /storage/deidentified && chown -R 999:999 /storage && chmod -R 775 /storage"
    volumes:
      - /data/klid/storage:/storage
    restart: "no"

  klid-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: klid-backend:latest
    container_name: klid-backend
    restart: unless-stopped
    depends_on:
      klid-postgres:
        condition: service_healthy
      klid-storage-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      # local 프로파일 jdbc-url 은 127.0.0.1 하드코딩 → 번들 postgres 로 override (relaxed binding)
      SPRING_DATASOURCE_CONTROL_JDBC_URL: jdbc:postgresql://klid-postgres:5432/${CONTROL_DB_NAME:-klid_system}
      SPRING_DATASOURCE_PORTAL_JDBC_URL: jdbc:postgresql://klid-postgres:5432/${PORTAL_DB_NAME:-portal}
      CONTROL_DB_USERNAME: ${CONTROL_DB_USERNAME:-klid_user}
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:-changeme}
      PORTAL_DB_USERNAME: ${CONTROL_DB_USERNAME:-klid_user}
      PORTAL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:-changeme}
      AI_SERVER_URL: http://klid-ai-server:9300
      STORAGE_RAW_PATH: /app/storage/raw
      STORAGE_DEIDENTIFIED_PATH: /app/storage/deidentified
      # ★ co-locate 산출(Phase 5A) 경로 가드용 고정 allowlist — dirname(RAW_FILE_PATH_NM) 이 이 목록
      #   하위여야 산출물(비식별 영상·프레임·JSON)을 쓴다. 위반 시 폴백 없이 실패한다(CWE-22 fail-closed).
      #   ⚠ 미설정 시 코드가 [raw-path, deidentified-path] 로 폴백하지만, 그 암묵 동작에 기대지 않고
      #     여기서 명시한다(형상마다 폴백 결과가 갈려 조용히 파이프라인이 멈추는 것을 방지).
      #   이 스택의 영상 경로는 전부 공유 볼륨 /app/storage 하위다:
      #     · dev-seed(MNG_CLIP_MASTER.FILE_PATH) = ./storage/raw/seed/*.mp4 → WORKDIR /app 기준 /app/storage/raw/...
      #     · 포털 업로드 = /app/storage/raw/portal/...
      #   ⚠ mock-server 의 MOCK_OUTPUT_BASE(docker-compose.local.yml)와 <한 세트>로 맞춰야 한다 —
      #     비식별 export_path 가 dirname(원본)/{rawSn}/deid/ 라 목이 그 경로에 쓸 수 있어야 한다.
      STORAGE_RAW_MOUNT_ROOTS: ${STORAGE_RAW_MOUNT_ROOTS:-/app/storage/raw,/app/storage/deidentified}
      # webhook HMAC 시크릿 — 빈 값이면 앱이 기동 실패(fail-closed, E-ISSUE-04)한다.
      #   ★ 기본값 폴백(${VAR:-...}) 금지 — 커밋된 기본값은 "공개된 키로 조용히 기동" 이 되어 누구나
      #     유효 서명을 위조할 수 있다(DEV_FIX H-1, CWE-1392/798). 이 compose 는 dev 배포 형상이기도 하다.
      #   ${VAR:?err} 는 compose 가 "미설정 또는 빈 값" 이면 즉시 실패시킨다 — 의도된 동작이다.
      #   값 생성: openssl rand -hex 32  → .env(gitignore 대상)에 기록.
      WEBHOOK_HMAC_SECRET_AUGMENT: ${WEBHOOK_HMAC_SECRET_AUGMENT:?WEBHOOK_HMAC_SECRET_AUGMENT 를 .env 에 설정하세요 (openssl rand -hex 32)}
      # 신뢰 프록시 CIDR / VLM 콜백 허용 출처.
      #   ★ 이 폴백 'none' 은 **로컬 스택 전용**이다 — 이 서비스는 SPRING_PROFILES_ACTIVE=local 로
      #     기동하고 앞단에 프록시가 실제로 없으므로 'none' 이 사실과 일치한다.
      #     운영(prd) 형상은 이 파일을 쓰지 않고 deploy/onprem/config/backend/env.template 을 쓰며,
      #     거기서는 값이 비어 있어 **운영자가 명시하기 전까지 기동하지 않는다**(DEV_FIX M-3/N-3).
      #     운영 기본값으로 'none' 을 건네면 프록시 뒤에서 모든 콜백 IP 가 LB IP 하나로 수렴해
      #     공격자 5회 실패가 정상 벤더 콜백 전건을 차단한다.
      WEBHOOK_TRUSTED_PROXY_CIDRS: ${WEBHOOK_TRUSTED_PROXY_CIDRS:-none}
      WEBHOOK_VLM_ALLOWED_IP_CIDRS: ${WEBHOOK_VLM_ALLOWED_IP_CIDRS:-none}
    volumes:
      - /data/klid/storage:/app/storage
    ports:
      - "18081:8080"
    networks:
      - klid-net
    healthcheck:
      # liveness 프로브 사용 — 전체 /health 는 외부 의존(deidentify/control-notify) 미배포 시
      # DOWN 으로 떨어지므로 앱 자체 생존 신호인 liveness 로 판정한다.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/actuator/health/liveness | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1536m

  klid-ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    image: klid-ai-server:latest
    container_name: klid-ai-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AI_MOCK_MODE: ${AI_MOCK_MODE:-true}
      AI_DEVICE: ${AI_DEVICE:-cuda}
      # 탐지/트래킹 백엔드는 YOLOX (ONNX Runtime) + ByteTrack 단일 백엔드.
      # 실추론 모델 캐시 영속화 (재생성 간 HF(sam2) 재다운로드 방지)
      HF_HOME: ${HF_HOME:-/app/.hf-cache}
    # nvidia 가 기본 런타임이므로 GPU 자동 가시. 명시적 예약도 추가(compose v2.18 지원).
    # GPU 없는 로컬(Mac 등)에서는 docker-compose.local.yml override(runtime: runc + AI_DEVICE=cpu)로 기동.
    # 자세한 로컬 자족 실행은 docs/v2-wiki/00-local-setup.md 참조.
    runtime: nvidia
    # 실추론 가중치(yolox_s.onnx)·모델 캐시 마운트. 파일 부재 시 weights_missing mock 폴백(무해).
    volumes:
      - ./weights:/app/weights:ro
      - ./hf-cache:/app/.hf-cache
    networks:
      - klid-net
    ports:
      - "19300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9300/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 6144m  # CPU 실추론(torch+sam2+onnxruntime 모델 로드) 여유 — mock 시엔 미사용

  # Vite dev 서버로 기동 — import.meta.env.DEV=true 산출물(/dev/login 등 dev 기능 활성).
  # 프로덕션 빌드는 dev 라우트를 dead-code 제거하므로 dev 서버 사용이 필수.
  klid-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    image: klid-frontend:dev
    container_name: klid-frontend
    restart: unless-stopped
    depends_on:
      - klid-backend
    environment:
      # 컨테이너 네트워크상 BE 오리진으로 프록시 (/api,/v1,/actuator)
      BACKEND_ORIGIN: http://klid-backend:8080
      # HMR 클라이언트가 외부 매핑 포트로 접속
      HMR_CLIENT_PORT: "13000"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_TOKEN_INGRESS: ${VITE_TOKEN_INGRESS:-all}
    networks:
      - klid-net
    ports:
      - "13000:5174"
    healthcheck:
      # 컨테이너 내부 localhost 는 ::1(IPv6) 우선 해석 → Vite(0.0.0.0 IPv4 bind)에 connection refused.
      # 127.0.0.1 로 IPv4 강제해 false-unhealthy 방지.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5174/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  klid-net:
    name: klid-net
    driver: bridge
