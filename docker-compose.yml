# ============================================================================
# klid-label 풀스택 배포 (cudo_246 / Docker compose v2)
#   - 모든 리소스 klid- 프리픽스로 격리 (기존 컨테이너 무영향)
#   - postgres 볼륨/스토리지는 /data 하위 (루트 / 디스크 보호)
#   - ai-server 는 nvidia 기본 런타임으로 GPU 자동 사용
#   - backend 는 **dev 프로파일** + 번들 postgres 로 기동 (ENV 미설정)
#       · 과거 base compose 는 SPRING_PROFILES_ACTIVE=local 이라 application-dev.yml 이 한 번도
#         적용된 적이 없었다. dev 배포가 local 설정(자족 mock·로컬 시크릿 기본값)으로 돌던 왜곡을
#         바로잡는다. 로컬 자족 기동은 docker-compose.local.yml override 가 local 로 되돌린다.
#       · 되돌리기(롤백): 서버 .env 에 SPRING_PROFILES_ACTIVE=local 을 넣으면 즉시 원복된다.
#   - 외부 벤더(비식별 KPST / VLM)는 mock-server 컨테이너로 **실제 HTTP 연동** — 저작도구가 스스로
#     결과를 채우는 내부 self-fill 경로(DEIDENTIFY_MOCK_MODE=true)는 쓰지 않는다.
# ============================================================================

services:
  klid-postgres:
    image: postgres:16
    container_name: klid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CONTROL_DB_USERNAME:-klid_user}
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:-changeme}
      POSTGRES_DB: ${CONTROL_DB_NAME:-klid_system}
      PORTAL_DB_NAME: ${PORTAL_DB_NAME:-portal}
    # 추가 DB(portal) 생성 — control DB 외 portal DataSource 연결용
    volumes:
      - /data/klid/pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - klid-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONTROL_DB_USERNAME:-klid_user} -d ${CONTROL_DB_NAME:-klid_system}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  # 스토리지 디렉토리 프로비저닝(one-shot) — host bind-mount 가 root 소유로 생성돼 비루트(uid 999)
  # backend 가 영상 저장 경로(raw/)에 못 쓰는 AccessDenied 방지. backend 기동 전 1회 mkdir+chown.
  # ★ 생성형AI 목 산출물 트리(/genai-out)도 함께 프로비저닝한다 — mock-server 는 uid 999(app)로
  #   실행돼, 초기화하지 않으면 결과 저장이 Permission denied 로 실패한다(RESULT_SAVE_FAILED).
  klid-storage-init:
    image: busybox:1.36
    container_name: klid-storage-init
    command: sh -c "mkdir -p /storage/raw /storage/deidentified /genai-out && chown -R 999:999 /storage /genai-out && chmod -R 775 /storage /genai-out"
    volumes:
      - /data/klid/storage:/storage
      - /data/klid/genai-out:/genai-out
    restart: "no"

  klid-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: klid-backend:latest
    container_name: klid-backend
    restart: unless-stopped
    depends_on:
      klid-postgres:
        condition: service_healthy
      klid-storage-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # 기본 dev. 롤백은 서버 .env 의 SPRING_PROFILES_ACTIVE=local (compose 재기동만으로 원복).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # ★ jdbc-url 을 여기서 **완전히 고정**한다(relaxed binding 이 yml 보다 우선).
      #   - local 프로파일: yml 이 127.0.0.1 하드코딩이라 컨테이너에서 못 붙음 → 번들 postgres 로 교정.
      #   - dev 프로파일: yml 은 ${CONTROL_DB_HOST} 등으로 조립하는데, 서버 .env 에 관제 DB IP 가
      #     남아 있으면 컨테이너 backend 가 번들 postgres 대신 **관제 실DB 로 붙어 Flyway 가 도는**
      #     사고가 난다. jdbc-url 을 직접 지정하면 yml 의 host/port/name placeholder 는 아예 해석되지
      #     않으므로(우선순위가 높은 소스가 값을 제공) 그 사고 경로가 닫힌다.
      #   외부 DB 를 쓰려면 이 두 줄을 배포 환경에 맞게 바꾼다.
      SPRING_DATASOURCE_CONTROL_JDBC_URL: jdbc:postgresql://klid-postgres:5432/${CONTROL_DB_NAME:-klid_system}
      SPRING_DATASOURCE_PORTAL_JDBC_URL: jdbc:postgresql://klid-postgres:5432/${PORTAL_DB_NAME:-portal}
      CONTROL_DB_USERNAME: ${CONTROL_DB_USERNAME:-klid_user}
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:-changeme}
      PORTAL_DB_USERNAME: ${CONTROL_DB_USERNAME:-klid_user}
      PORTAL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:-changeme}
      AI_SERVER_URL: http://klid-ai-server:9300
      STORAGE_RAW_PATH: /app/storage/raw
      STORAGE_DEIDENTIFIED_PATH: /app/storage/deidentified
      # ---- 외부 벤더 연동(목업 서버 실 HTTP) ----
      #   내부 self-fill 금지: mock-mode 는 외부 무접촉으로 원본을 복사해 성공을 만들어내므로 끈다.
      DEIDENTIFY_MOCK_MODE: ${DEIDENTIFY_MOCK_MODE:-false}
      KPST_DEID_ENABLED: ${KPST_DEID_ENABLED:-true}
      KPST_DEID_BASE_URL: ${KPST_DEID_BASE_URL:-http://klid-mock-server:9400}
      VLM_CLIENT_ENABLED: ${VLM_CLIENT_ENABLED:-true}
      VLM_SERVICE_URL: ${VLM_SERVICE_URL:-http://klid-mock-server:9400}
      # 콜백(mock-server → 저작도구) 수신 주소. 기본값 localhost:8080 은 **호출자 자신**을 가리켜
      #   컨테이너 간 콜백이 전부 유실된다(VLM describe 결과 미수신, 증강 콜백 미수신).
      WEBHOOK_CALLBACK_BASE_URL: ${WEBHOOK_CALLBACK_BASE_URL:-http://klid-backend:8080/api}
      # ---- 시크릿·기능 토글은 .env(env_file) 로만 주입한다 ----
      #   JWT_SECRET(미주입=부팅 실패) / STREAM_SIGN_SECRET(영상 재생 fail-closed) /
      #   CORS_ALLOWED_ORIGINS(FE 403) / ADMIN_CLAIM_PASSWORD_HASH / WEBHOOK_HMAC_SECRET_AUGMENT.
      #   ⚠ 여기서 ${VAR:-} 형태로 재선언하면 .env 에 없을 때 "빈 값이 설정된" 상태가 되어
      #     프로파일 yml 의 기본값(${VAR:default})까지 빈 값으로 덮어쓴다 — 그래서 일부러 나열하지 않는다.
      #   필수 목록은 docs/operations/config-key-changes-20260727.md §4-2 참조.
      # ★ co-locate 산출(Phase 5A) 경로 가드용 고정 allowlist — dirname(RAW_FILE_PATH_NM) 이 이 목록
      #   하위여야 산출물(비식별 영상·프레임·JSON)을 쓴다. 위반 시 폴백 없이 실패한다(CWE-22 fail-closed).
      #   ⚠ 미설정 시 코드가 [raw-path, deidentified-path] 로 폴백하지만, 그 암묵 동작에 기대지 않고
      #     여기서 명시한다(형상마다 폴백 결과가 갈려 조용히 파이프라인이 멈추는 것을 방지).
      #   이 스택의 영상 경로는 전부 공유 볼륨 /app/storage 하위다:
      #     · dev-seed(MNG_CLIP_MASTER.FILE_PATH) = ./storage/raw/seed/*.mp4 → WORKDIR /app 기준 /app/storage/raw/...
      #     · 포털 업로드 = /app/storage/raw/portal/...
      #   ⚠ mock-server 의 MOCK_OUTPUT_BASE(docker-compose.local.yml)와 <한 세트>로 맞춰야 한다 —
      #     비식별 export_path 가 dirname(원본)/{rawSn}/deid/ 라 목이 그 경로에 쓸 수 있어야 한다.
      STORAGE_RAW_MOUNT_ROOTS: ${STORAGE_RAW_MOUNT_ROOTS:-/app/storage/raw,/app/storage/deidentified}
      # ★ 외부 벤더 산출물 <읽기> 전용 허용 루트 — 위 쓰기 allowlist 와 <별개 축>이다(DEV_FIX 2차 HIGH-1).
      #   생성형 AI 목/실벤더는 결과 이미지를 자기 트리에 쓰고 그 절대경로를 콜백으로 준다. 이 스택의 목은
      #   MOCK_GENAI_OUTPUT_BASE=/app/genai-out 이므로 그 루트를 읽기 축으로 허용해야 콜백이 통과한다
      #   (미허용이면 GenAiCallbackService 가 400 + 상태 미변경 → 증강이 PENDING 에 영구 고착).
      #   쓰기 축(STORAGE_RAW_MOUNT_ROOTS)에는 절대 넣지 않는다 — 우리는 이 트리에 쓰지 않고 <읽어서>
      #   파생 프레임으로 복사만 한다(PII 격리 축 유지). 아래 volumes 에서 :ro 로 마운트하는 이유도 같다.
      #   실벤더 전환 시 벤더 공유 NAS 경로로 이 값만 교체한다(코드 변경 없음).
      STORAGE_EXTERNAL_READ_ROOTS: ${STORAGE_EXTERNAL_READ_ROOTS:-/app/genai-out}
      # webhook HMAC 시크릿 — 빈 값이면 앱이 기동 실패(fail-closed, E-ISSUE-04)한다.
      #   ★ 기본값 폴백(${VAR:-...}) 금지 — 커밋된 기본값은 "공개된 키로 조용히 기동" 이 되어 누구나
      #     유효 서명을 위조할 수 있다(DEV_FIX H-1, CWE-1392/798). 이 compose 는 dev 배포 형상이기도 하다.
      #   ${VAR:?err} 는 compose 가 "미설정 또는 빈 값" 이면 즉시 실패시킨다 — 의도된 동작이다.
      #   값 생성: openssl rand -hex 32  → .env(gitignore 대상)에 기록.
      WEBHOOK_HMAC_SECRET_AUGMENT: ${WEBHOOK_HMAC_SECRET_AUGMENT:?WEBHOOK_HMAC_SECRET_AUGMENT 를 .env 에 설정하세요 (openssl rand -hex 32)}
      # 신뢰 프록시 CIDR / VLM 콜백 허용 출처.
      #   ★ 이 폴백 'none' 은 **이 docker 스택(local/dev) 전용**이다 — 이 스택은 앞단에 프록시가
      #     실제로 없으므로 'none' 이 사실과 일치한다(기본 프로파일이 dev 로 바뀌어도 동일).
      #     운영(prd) 형상은 이 파일을 쓰지 않고 deploy/onprem/config/backend/env.template 을 쓰며,
      #     거기서는 값이 비어 있어 **운영자가 명시하기 전까지 기동하지 않는다**(DEV_FIX M-3/N-3).
      #     운영 기본값으로 'none' 을 건네면 프록시 뒤에서 모든 콜백 IP 가 LB IP 하나로 수렴해
      #     공격자 5회 실패가 정상 벤더 콜백 전건을 차단한다.
      WEBHOOK_TRUSTED_PROXY_CIDRS: ${WEBHOOK_TRUSTED_PROXY_CIDRS:-none}
      WEBHOOK_VLM_ALLOWED_IP_CIDRS: ${WEBHOOK_VLM_ALLOWED_IP_CIDRS:-none}
      # 생성형 AI 콜백 허용 출처 — VLM 과 달리 **미설정/none = 전면 차단**(fail-closed).
      #   ★ 여기서 명시하지 않으면 .env 의 빈 값 대입(WEBHOOK_GENAI_ALLOWED_IP_CIDRS=)이 env_file 로
      #     그대로 주입돼(set-but-empty) 프로파일 yml 기본값(${VAR:0.0.0.0/0})까지 빈 값으로 덮인다.
      #     그 상태에서 증강 위탁이 http 면 GenAiIntegrationWiringGuard 가 기동을 차단한다 —
      #     즉 "문서대로 띄운 정상 형상이 부팅 불가" 가 된다.
      #   base(dev) 기본은 VLM 과 같은 'none' — dev 는 증강 위탁이 noop(application-dev.yml)이라
      #     콜백이 애초에 오지 않으므로 fail-closed 를 유지한다(가드도 noop 은 허용).
      #   증강을 실제로 위탁하는 형상(docker-compose.local.yml: AUGMENT_EXTERNAL_MODE=http)은 그 파일에서
      #     0.0.0.0/0 을 <명시>해 짝을 맞춘다(목은 docker 브리지 사설 IP 라 대역 고정 불가).
      WEBHOOK_GENAI_ALLOWED_IP_CIDRS: ${WEBHOOK_GENAI_ALLOWED_IP_CIDRS:-none}
    volumes:
      - /data/klid/storage:/app/storage
      # 생성형AI 목/벤더 산출물 트리 — **읽기 전용(:ro)**. BE 는 콜백이 준 경로에서 결과 이미지를
      #   읽어 파생 프레임(frames/deid)으로 복사만 하며 이 트리에 쓰지 않는다. 마운트가 없으면
      #   콜백 경로 검증은 통과해도 파일이 보이지 않아 반입이 실패한다(mock-server 는 같은 볼륨을 rw 로 씀).
      - /data/klid/genai-out:/app/genai-out:ro
    ports:
      - "18081:8080"
    networks:
      - klid-net
    healthcheck:
      # liveness 프로브 사용 — 전체 /health 는 외부 의존(deidentify/control-notify) 미배포 시
      # DOWN 으로 떨어지므로 앱 자체 생존 신호인 liveness 로 판정한다.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/actuator/health/liveness | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1536m

  klid-ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    image: klid-ai-server:latest
    container_name: klid-ai-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # ★ 기본값 false — mock 모드는 합성 라벨(person, score=0.9)을 정상 응답처럼 반환하므로
      #   compose 기본 기동으로 켜지면 안 된다(구 기본값 true 폐기, 2026-08).
      #   가중치가 없으면 weights_missing 사유의 <빈> detections 로 안전하게 폴백한다.
      AI_MOCK_MODE: ${AI_MOCK_MODE:-false}
      AI_DEVICE: ${AI_DEVICE:-cuda}
      # 배포 환경 표식 — stg/prd 면 mock 모드 기동을 거부한다(ai-server/app/startup_guard.py).
      ENV: ${ENV:-}
      # 탐지/트래킹 백엔드는 YOLOX (ONNX Runtime) + ByteTrack 단일 백엔드.
      # 실추론 모델 캐시 영속화 (재생성 간 HF(sam2) 재다운로드 방지)
      HF_HOME: ${HF_HOME:-/app/.hf-cache}
    # nvidia 가 기본 런타임이므로 GPU 자동 가시. 명시적 예약도 추가(compose v2.18 지원).
    # GPU 없는 로컬(Mac 등)에서는 docker-compose.local.yml override(runtime: runc + AI_DEVICE=cpu)로 기동.
    # 자세한 로컬 자족 실행은 docs/v2-wiki/00-local-setup.md 참조.
    runtime: nvidia
    # 실추론 가중치(yolox_s.onnx)·모델 캐시 마운트. 파일 부재 시 weights_missing mock 폴백(무해).
    volumes:
      - ./weights:/app/weights:ro
      - ./hf-cache:/app/.hf-cache
    networks:
      - klid-net
    ports:
      - "19300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9300/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 6144m  # CPU 실추론(torch+sam2+onnxruntime 모델 로드) 여유 — mock 시엔 미사용

  # 외부 벤더 목(mock) 서버 — 비식별(KPST 11EP) + VLM(3EP, 비동기 콜백) + 생성형AI 증강(/api/genai/*)
  #   실연동 테스트용.
  #   backend 가 실제 HTTP 로 이 서버를 호출한다(내부 self-fill 대체). 벤더 실서버 준비 시
  #   KPST_DEID_BASE_URL / VLM_SERVICE_URL 만 바꾸면 이 컨테이너 없이도 동작한다.
  #
  #   ⚠⚠ 로컬/dev 전용 — **인증이 없고**, VLM 콜백이 요청자가 지정한 URL 로 서버측 outbound
  #      POST 를 발사한다(SSRF 표면, CWE-918 — 목 자체도 MOCK_CALLBACK_ALLOWED_HOSTS 로 방어).
  #      신뢰망(klid-net)에서만 기동하고 운영/외부망에 절대 노출하지 말 것.
  #      stg/prd 는 도커를 쓰지 않으므로 이 정의가 운영으로 전파되지 않는다.
  mock-server:
    build:
      context: ./mock-server
      dockerfile: Dockerfile
    image: klid-mock-server:latest
    container_name: klid-mock-server
    restart: unless-stopped
    depends_on:
      # 두 트리(storage·genai-out)의 소유권 초기화가 끝난 뒤 기동해야 쓰기가 가능하다.
      klid-storage-init:
        condition: service_completed_successfully
    environment:
      # 비식별 더미 출력 파일 생성 허용 base(콤마 구분). 미설정이면 파일 미생성(fail-closed) →
      #   BE 무결성 검증이 실패해 파이프라인이 멈춘다.
      #   ★ BE 의 STORAGE_RAW_MOUNT_ROOTS 와 <한 세트>여야 한다 — Phase 5A(co-locate) 이후 BE 가 넘기는
      #     export_path 는 {dirname(원본)}/{rawSn}/deid/ 라 원본이 있는 /app/storage/raw 하위다.
      #     구 값(/app/storage/deidentified 단독)이면 목이 base 밖으로 판정해 더미를 만들지 않고,
      #     BE 는 산출물 부재로 비식별을 영구 실패시킨다(isUsableDeidFile=false → failPolling).
      MOCK_OUTPUT_BASE: ${STORAGE_RAW_MOUNT_ROOTS:-/app/storage/raw,/app/storage/deidentified}
      # 복사 원본 읽기 허용 루트(= raw/ 와 deidentified/ 의 공통 루트). 이 밖의 input_path 는
      #   복사하지 않고 placeholder 로 대체한다 — 임의 파일 노출·GB급 반복 복사(디스크 고갈) 차단.
      MOCK_INPUT_BASE: /app/storage
      # 생성형AI 증강 목(PR #47). 두 base 모두 미설정이면 fail-closed —
      #   결과 파일을 만들지 않고 FAILED(RESULT_SAVE_FAILED), input_files 는 전부 400 이다.
      #   ★ 두 base 를 <서로 다른 트리>로 분리한다(PR #47 후속 #1). 같은 트리에 두면
      #     "목 산출물 쓰기 권한 = 입력 읽기 권한"이 되어 심볼릭링크 TOCTOU(F-1)의 악화 요인이 된다.
      #   INPUT 은 BE 미디어 볼륨 루트(/app/storage) — genai_input_base 는 콤마를 지원하지 않아
      #     raw·deidentified 둘 다 덮으려면 공통 조상이어야 한다.
      #   OUTPUT 은 별도 트리(/app/genai-out). 결과는 {base}/genai/{job_id}/ 하위에 생성된다.
      MOCK_GENAI_INPUT_BASE: /app/storage
      MOCK_GENAI_OUTPUT_BASE: /app/genai-out
      # VLM 콜백 outbound 허용 호스트(SSRF 방어). BE 는 WEBHOOK_CALLBACK_BASE_URL=
      #   http://klid-backend:8080/api 로 콜백 주소를 넘기므로 klid-backend 가 정상 경로다.
      MOCK_CALLBACK_ALLOWED_HOSTS: ${MOCK_CALLBACK_ALLOWED_HOSTS:-klid-backend,localhost,127.0.0.1}
      # ── 워터마크 인코딩 GPU(NVENC) 사용 — GPU 가 있는 호스트에서만 실제로 활성화된다 ──
      #   목적: 비식별 산출 영상에 마크를 박아 <b>프레임이 원본이 아니라 비식별본에서 추출됐는지</b>를
      #   육안으로 확인한다. 4K 실자산의 CPU(libx264) 인코딩은 0.05x(80초 영상 27분)라 타임아웃·OOM 으로
      #   항상 복사 폴백됐고, NVENC(Tesla T4)로는 1.87x(약 43초)다 — 2026-07-31 cudo_246 실측.
      #
      #   ⚠ `deploy.resources.devices` 대신 <b>환경변수</b>로 요청한다. 그 필드는 nvidia 런타임이 없는
      #     호스트에서 "could not select device driver" 로 <b>기동 자체를 실패</b>시키지만, 아래 두 변수는
      #     비GPU 호스트에서 그냥 무시된다(런타임이 주입하지 않음) → 로컬 개발 스택이 깨지지 않는다.
      #   ⚠ NVENC 은 GPU 노출만으로는 부족하고 <b>video capability</b> 가 필요하다. 기본값
      #     (compute,utility)이면 libcuda 는 로드되는데 libnvidia-encode.so.1 이 없어 실패한다(실측).
      #   GPU 를 쓰지 않는 환경은 코드가 런타임 탐지로 CPU 인코딩에 폴백하므로 별도 설정이 필요 없다.
      NVIDIA_VISIBLE_DEVICES: ${MOCK_NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${MOCK_NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}
    volumes:
      # backend 와 **동일 볼륨·동일 경로** — BE 가 넘긴 절대경로(input_path/export_path)를 그대로 읽고 쓴다.
      #   경로가 어긋나면 위탁은 성공하는데 결과 파일이 없어 비식별이 'F' 로 끝난다.
      - /data/klid/storage:/app/storage
      # 생성형AI 산출물 전용 — 입력 트리와 분리(위 주석 참조).
      - /data/klid/genai-out:/app/genai-out
    ports:
      # ★ 루프백 전용 발행 — 목 서버는 인증이 없고 임의 URL 로 outbound POST 를 발사하며(SSRF),
      #   input_path/export_path 로 파일 생성을 유발할 수 있다. 0.0.0.0 발행(구 "9400:9400")은
      #   같은 네트워크의 누구에게나 이 표면을 상시 개방한다. backend 는 컨테이너 네트워크
      #   이름(klid-mock-server:9400)으로 호출하므로 호스트 발행 없이도 정상 동작하며,
      #   이 발행은 서버에 접속한 개발자가 로컬에서 목 상태를 확인하기 위한 용도만 남긴다.
      - "127.0.0.1:9400:9400"
    networks:
      - klid-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9400/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          # 256m 는 4K 디코딩 버퍼를 감당하지 못해 워터마크 ffmpeg 가 OOM-kill 됐다
          #   (커널: `Memory cgroup out of memory: Kill process (ffmpeg)`, 2026-07-31 246 실측).
          #   1g 에서 NVENC 인코딩이 1.87x 로 정상 동작한다. GPU 없이 CPU 로 폴백하는 환경에서도
          #   저해상도 영상은 이 한도로 충분하다.
          #   ⚠ `deploy.resources.limits` 가 있으면 Compose 는 `mem_limit` 을 무시한다 — 한도는
          #     반드시 <여기서> 조정할 것(둘 다 두면 조용히 이 값이 이긴다).
          memory: ${MOCK_MEM_LIMIT:-1g}

  # Vite dev 서버로 기동 — import.meta.env.DEV=true 산출물(/dev/login 등 dev 기능 활성).
  # 프로덕션 빌드는 dev 라우트를 dead-code 제거하므로 dev 서버 사용이 필수.
  klid-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        # ⚠ 현재 target 은 dev(Vite dev 서버)라 build args 는 소비되지 않는다 — 아래
        #   environment 가 실효값이다. build/runtime 스테이지로 전환해 정적 dist 를 구우려면
        #   Vite 가 빌드 시점에 정적 치환하므로 이쪽이 필요해진다(H-ISSUE-02).
        VITE_CONTROL_LOGIN_URL: ${VITE_CONTROL_LOGIN_URL:-}
        VITE_PORTAL_LOGIN_URL: ${VITE_PORTAL_LOGIN_URL:-}
    image: klid-frontend:dev
    container_name: klid-frontend
    restart: unless-stopped
    depends_on:
      - klid-backend
    environment:
      # 컨테이너 네트워크상 BE 오리진으로 프록시 (/api,/v1,/actuator)
      BACKEND_ORIGIN: http://klid-backend:8080
      # HMR 클라이언트가 외부 매핑 포트로 접속
      HMR_CLIENT_PORT: "13000"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_TOKEN_INGRESS: ${VITE_TOKEN_INGRESS:-all}
      # 상위 시스템 로그인 URL(H-ISSUE-02). Vite dev 서버는 process.env 의 VITE_* 를
      # .env 파일보다 우선 적용하므로 여기 값이 실효값이 된다. 로컬 기본은 빈 값(=redirect
      # 하지 않는 dev fail-open)을 유지하고, 상위 시스템과 붙여 볼 때만 셸에서 주입한다.
      VITE_CONTROL_LOGIN_URL: ${VITE_CONTROL_LOGIN_URL:-}
      VITE_PORTAL_LOGIN_URL: ${VITE_PORTAL_LOGIN_URL:-}
    networks:
      - klid-net
    ports:
      - "13000:5174"
    healthcheck:
      # 컨테이너 내부 localhost 는 ::1(IPv6) 우선 해석 → Vite(0.0.0.0 IPv4 bind)에 connection refused.
      # 127.0.0.1 로 IPv4 강제해 false-unhealthy 방지.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5174/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  klid-net:
    name: klid-net
    driver: bridge
