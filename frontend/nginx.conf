server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # 대용량 업로드 허용 — backend 한도(spring.servlet.multipart.max-request-size)와 정렬.
    #   ★ 앞단이 서버보다 좁으면 그 사이 크기의 요청은 **서버에 닿기도 전에** 프록시가 거부해,
    #     앱이 만든 413(ApiResponse + errorCode)이 아니라 프록시 기본 오류 페이지가 나가고 서버
    #     로그에는 아무 흔적도 남지 않는다. 판정은 언제나 서버가 하게 둔다.
    #   ★ 왜 512m 가 아니라 1200m 인가 — 512MB 를 **정당하게** 넘는 요청이 실재한다.
    #     포털 이미지 다중 업로드(POST /v1/portal/uploads/images)는 확정 계약상 개당 20MB × 요청당
    #     50장이라 한 요청이 최대 1,000MB 다. 재개 업로드(TUS)는 청크가 16MB 라 이 축과 무관하다.
    #     값은 **서버 한도 중 최댓값**(공통 1200MB)에 맞춘다.
    #   ⚠ 이 파일은 **컨테이너 이미지에 구워지는 형상**이고, 온프렘 배포는 같은 값을 가진 별도
    #     템플릿(deploy/onprem/config/frontend/{nginx.conf.template,Caddyfile.template})을 쓴다.
    #     **세 파일이 같은 값을 유지해야 한다** — 갈리면 «어느 배포 형상이냐» 에 따라 같은 업로드가
    #     되기도 하고 안 되기도 하는, 재현되지 않는 실패가 된다.
    #     회귀 고정: frontend `edgeRequestSizeAlignment.test.ts`(이 파일 포함 3형상 정합).
    client_max_body_size 1200m;

    # API 프록시 — backend context-path 가 /api 이므로 경로 그대로 전달.
    #   FE 는 VITE_API_BASE_URL=/api/v1 로 호출 → /api/v1/... → backend /api + /v1/...
    location /api/ {
        proxy_pass         http://klid-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 영상 스트림(Range) / 대용량 응답
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
