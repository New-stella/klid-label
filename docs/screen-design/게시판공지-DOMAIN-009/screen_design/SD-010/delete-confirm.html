<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="delete-confirm.css"><meta charset="utf-8" />
  <title>SCREEN-031 공지 삭제 확인 다이얼로그 — 고충실 디자인</title>
</head>
<body>
<div class="modal-scrim">
    
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-desc">
      <div class="modal-dialog-header">
        <h2 id="delete-dialog-title" class="modal-dialog-title t-title-md">
          <svg class="icon" viewbox="0 0 24 24">
            <path d="M3 6h18"></path>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <path d="M10 11v6"></path><path d="M14 11v6"></path>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          공지 삭제
        </h2>
      </div>

      <p id="delete-dialog-desc" class="modal-dialog-desc t-body-md">
        '라벨링 캔버스 정기 점검 안내 (8월 셋째 주)' 공지를 삭제합니다.
      </p>

      <div class="modal-dialog-warning">
        <svg class="icon" viewbox="0 0 24 24">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <p class="t-body-sm">이 작업은 되돌릴 수 없습니다. 첨부파일도 함께 삭제됩니다.</p>
      </div>

      <div class="modal-dialog-actions">
        <button type="button" class="btn t-button btn-secondary">취소</button>
        <button type="button" class="btn t-button btn-danger">
          <svg class="icon" viewbox="0 0 24 24">
            <path d="M3 6h18"></path>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <path d="M10 11v6"></path><path d="M14 11v6"></path>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          삭제
        </button>
      </div>

      <p class="modal-dialog-help t-caption">확인하면 삭제가 진행되는 동안 버튼이 '삭제 중' 상태(진행 표시 + 비활성)로 바뀌어 재클릭을 막고, 완료 후 공지 목록으로 이동합니다.</p>
    </div>
</div>
</body>
</html>
