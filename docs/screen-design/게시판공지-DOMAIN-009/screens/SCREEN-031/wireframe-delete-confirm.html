<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="wireframe.css"><meta charset="utf-8" /><title>삭제 확인 모달 (REVIEWER)</title></head>
<body>
  <div class="wf-dialog" style="max-width:440px;margin:24px auto">
    <h3 class="wf-dialog-title">공지 삭제</h3>
    <p class="wf-muted">{제목} 공지를 삭제합니다. 이 작업은 되돌릴 수 없습니다.</p>
    <div class="wf-btn-row wf-mt">
      <button class="wf-btn wf-btn-secondary">취소</button>
      <button class="wf-btn wf-btn-destructive">삭제</button>
    </div>
    <p class="wf-help wf-mt">확인하면 삭제(API-099)를 호출하고 그 공지의 첨부도 함께 정리되며, 완료 후 공지 목록으로 이동한다. 삭제가 진행되는 동안에는 진행 중 상태를 표시해 재지시를 막는다.</p>
    <p class="wf-faint">API-099</p>
  </div>
</body>
</html>
