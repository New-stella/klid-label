<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="design-main.css"><meta charset="utf-8" />
<title>SCREEN-037 공지 수정 화면</title>
</head>
<body>
<main class="notice-edit-page">

  
  <header class="ne-header">
    <button type="button" class="btn t-button btn-ghost">
      <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      뒤로가기
    </button>
    <h1 class="t-title-lg">공지 수정</h1>
  </header>


  
  <section class="ne-form-card" aria-label="공지 수정 폼">
    <form>
      <div class="field">
        <label class="field__label t-label" for="ne-title">제목 <span class="req" aria-hidden="true">*</span><span class="sr-only">(필수)</span></label>
        <input id="ne-title" class="input t-body-md" type="text" value="8월 정기 점검에 따른 라벨링 서비스 임시 중단 안내" placeholder="공지 제목을 입력하세요. (최대 200자)" />
        <p class="field__help t-caption">필수 · 최대 200자</p>
      </div>

      <div class="field">
        <label class="field__label t-label" for="ne-content">내용 <span class="req" aria-hidden="true">*</span><span class="sr-only">(필수)</span></label>
        <textarea id="ne-content" class="textarea t-body-md" placeholder="공지 내용을 입력하세요.">2026년 8월 15일(토) 02:00~06:00 사이 시스템 정기 점검을 진행합니다.

점검 시간 동안 라벨링·검수·업로드 등 전체 서비스 이용이 제한되니, 작업 중이시던 내용은 점검 시작 전에 반드시 저장해 주시기 바랍니다.

점검이 완료되면 별도 안내 없이 서비스가 정상화됩니다. 문의사항은 관리자에게 연락해 주세요.</textarea>
        <p class="field__help t-caption">필수</p>
      </div>

      <div class="field">
        <label class="checkbox-row" for="ne-pinned">
          <input id="ne-pinned" type="checkbox" checked class="sr-only" />
          <span class="checkbox checkbox--checked" aria-hidden="true">
            <svg viewbox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
          <span class="field__label checkbox-row__text t-label">중요 공지</span>
        </label>
      </div>

      <div class="ne-form-actions">
        <button type="button" class="btn t-button btn-outline">취소</button>
        <button type="submit" class="btn t-button btn-primary">저장</button>
      </div>
    </form>
  </section>

  
  <section class="ne-attach-card" aria-label="첨부파일 관리">
    <div class="ne-attach-card__head">
      <h2 class="t-title-sm">첨부파일</h2>
      <button type="button" class="btn t-button btn-outline">
        <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        파일 추가
      </button>
    </div>

    <ul class="attach-list">
      <li class="attach-row">
        <span class="attach-row__icon">
          <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </span>
        <span class="attach-row__name t-body-sm" title="2026년_8월_정기점검_안내문_상세일정및영향범위.pdf">2026년_8월_정기점검_안내문_상세일정및영향범위.pdf</span>
        <span class="attach-row__size t-caption">1.2 MB</span>
        <button type="button" class="btn t-button btn-ghost btn-icon" aria-label="2026년_8월_정기점검_안내문_상세일정및영향범위.pdf 삭제">
          <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
        </button>
      </li>
      <li class="attach-row">
        <span class="attach-row__icon">
          <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </span>
        <span class="attach-row__name t-body-sm" title="라벨링_가이드라인_v3.hwp">라벨링_가이드라인_v3.hwp</span>
        <span class="attach-row__size t-caption">340 KB</span>
        <button type="button" class="btn t-button btn-ghost btn-icon" aria-label="라벨링_가이드라인_v3.hwp 삭제">
          <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
        </button>
      </li>
      <li class="attach-row">
        <span class="attach-row__icon">
          <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </span>
        <span class="attach-row__name t-body-sm" title="일정표.xlsx">일정표.xlsx</span>
        <span class="attach-row__size t-caption">58 KB</span>
        <button type="button" class="btn t-button btn-ghost btn-icon" aria-label="일정표.xlsx 삭제">
          <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
        </button>
      </li>
    </ul>

    
    <div class="ne-state-ref" aria-label="첨부 0건 상태 참고">
      <p class="ne-state-ref__label t-label">참고 — 첨부파일이 없을 때 (목록과 배타적으로 노출, 동시 표시 아님)</p>
      <p class="attach-empty t-caption">첨부된 파일이 없습니다.</p>
    </div>
  </section>

  
  <section class="ne-state-ref" aria-label="로딩 및 오류 상태 참고">
    <p class="ne-state-ref__label t-label">참고 — 조회 결과에 따라 아래 중 하나만 폼 영역에 노출됩니다 (동시 표시 아님)</p>
    <div class="ne-state-ref__grid">
      <div class="state-preview">
        <p class="state-preview__caption t-caption">로딩 스켈레톤 · 상세 조회 중</p>
        <div class="skeleton skeleton-field"></div>
        <div class="skeleton skeleton-area"></div>
      </div>
      <div class="state-preview">
        <p class="state-preview__caption t-caption">오류 · 조회 실패</p>
        <div class="error-state-preview">
          <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M10.29 3.86 1.82 18a1 1 0 0 0 .87 1.5h18.62a1 1 0 0 0 .87-1.5L13.71 3.86a1 1 0 0 0-1.72 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          <span class="title">공지를 불러오지 못했습니다.</span>
          <span class="msg t-caption">잠시 후 다시 시도해주세요.</span>
          <button type="button" class="btn t-button btn-outline">
            <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
            다시 시도
          </button>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
