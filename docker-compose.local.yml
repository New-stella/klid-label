# ============================================================================
# klid-label 로컬 외부 0개 자족 테스트 override
#   사용: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
#   목적: 관제/포털/비식별/실VLM 등 **외부 벤더 서버 0개**로 전 시나리오를 띄워 검증.
#   - backend: base 는 dev 프로파일이므로 여기서 local 프로파일로 되돌린다(시드·로컬 기본값·게이팅).
#   - ai-server: mock 이 아닌 CPU 실추론 + YOLOX 탐지(onnxruntime) (GPU 불필요 — Mac 등 호환).
#   - 호스트 절대경로(/data) 대신 named volume → 비-Linux/비-서버 환경에서도 기동.
#   - 비식별(KPST)·VLM·증강·관제통지는 **내부 self-fill 이 아니라 mock-server 컨테이너
#     (klid-mock-server:9400)로 실제 HTTP 위탁**한다(자기 결과 채움 금지 — 실동작 시나리오 검증).
#     목 서비스 정의 본체는 base compose 에 있고, 여기서는 볼륨만 override 한다.
#
#   주의: ENV 환경변수를 dev/stg/prd 로 설정하지 말 것 (LocalProfileGuard + 비식별
#         mock 게이트가 부트 차단). 상세는 docs/v2-wiki/00-local-setup.md.
# ============================================================================

services:
  klid-postgres:
    # /data 호스트 바인드 → named volume 으로 교체 (postgres-init 바인드는 유지 병합)
    volumes:
      - klid-pgdata:/var/lib/postgresql/data
    # 방법 B(Native) 지원: 호스트 5432 발행 → native backend(127.0.0.1:5432)가 번들 DB에 접속.
    #   base compose 는 전부 docker 내부 통신이라 미발행. local override 에서만 노출한다.
    ports:
      - "5432:5432"

  klid-storage-init:
    # /data 호스트 바인드 → backend 와 동일 named volume 으로 교체.
    #   base 는 /data/klid/storage(호스트)를 init 하지만 local 의 backend 는 named volume(klid-storage)을
    #   쓰므로 서로 다른 위치를 가리키는 누락 버그였다. Mac/비-서버에서 호스트 바인드 미공유로 마운트 거부되고,
    #   설령 Linux 라도 backend 가 쓰는 볼륨을 init 하지 못한다. 같은 named volume 을 init 하도록 정정.
    #   ★ genai 산출물 볼륨도 함께 init 한다 — named volume 은 root:root 로 생성되는데 mock-server 는
    #     uid 999(app)로 실행돼, 초기화하지 않으면 결과 저장이 Permission denied 로 실패한다
    #     (job 이 FAILED/RESULT_SAVE_FAILED 로 끝나며 설정만 넣어서는 동작하지 않는다).
    command: sh -c "mkdir -p /storage/raw /storage/deidentified /genai-out && chown -R 999:999 /storage /genai-out && chmod -R 775 /storage /genai-out"
    volumes:
      - klid-storage:/storage
      - klid-genai-out:/genai-out

  klid-backend:
    # 영상 저장소 /data 바인드 → named volume
    #   ★ 생성형AI 산출물 볼륨도 함께 교체한다(base 는 /data/klid/genai-out 호스트 바인드) — 빠뜨리면
    #     Mac/비-서버에서 마운트가 거부되거나, 뜬다 해도 mock-server 가 쓰는 named volume 과 다른 위치를
    #     보게 되어 콜백 경로는 통과하는데 파일이 없어 증강 프레임 반입이 전건 실패한다.
    #     BE 는 <읽기 전용(:ro)> — 이 트리에 쓰지 않고 읽어서 frames/deid 로 복사만 한다.
    volumes:
      - klid-storage:/app/storage
      - klid-genai-out:/app/genai-out:ro
    environment:
      # ★ 프로파일 고정 — base compose 는 dev 로 뜨므로 로컬 자족 기동은 여기서 local 로 되돌린다.
      #   (local yml 의 시크릿 기본값·dev 시드(DevSeedRunner @Profile("local"))·mock 게이팅이 여기에 달려 있다)
      SPRING_PROFILES_ACTIVE: local
      # 외부 벤더 연동(mock-server 실 HTTP)은 base compose 가 이미 주입한다
      #   (KPST_DEID_* / VLM_* / WEBHOOK_CALLBACK_BASE_URL).
      #   여기서 다시 선언하면 값이 두 파일로 갈라지므로 중복 정의하지 않는다.
      # D-48 실동작 설정 — 관제 완료/수정 통지를 목 서버로 실제 전송한다(내부 목모드 우회 금지).
      #   mock-server 의 /api/data-set/v2/jobs/{job_id}/notify-completed|notify-updated 가
      #   409(job_id 중복)/404(선행 완료 없음)를 관제 계약대로 돌려주므로 자기치유가 HTTP 왕복으로 검증된다.
      #   (base 는 관제 통지 대상이 환경마다 달라 주입하지 않으므로 local override 에만 둔다)
      CONTROL_NOTIFY_ENABLED: "true"
      CONTROL_NOTIFY_URL: "http://klid-mock-server:9400"
      # Phase 7-A1 실동작 설정 — 증강(생성형 AI) 위탁을 목 서버로 실제 POST 한다(내부 목모드 우회 금지).
      #   mock-server 의 POST /api/genai/jobs 가 「생성형 AI API 연동명세서 v1.1」 그대로 202 + job_id 를
      #   돌려주므로 job_id 발급 주체 반전·분할 위탁이 HTTP 왕복으로 검증된다.
      #   application-local.yml 기본도 http 지만, 컨테이너 경로에서는 base-url 이 서비스명이어야 하므로
      #   두 값을 짝으로 명시한다(mode 만 상속하고 base-url 을 빼면 localhost 를 향해 위탁이 실패한다).
      AUGMENT_API_BASE_URL: "http://klid-mock-server:9400"
      #   ★ 위탁(http)과 콜백 수신은 <짝>이다 — genai 콜백 IP allowlist 는 미설정/none 이면 전면 차단이라
      #     열지 않으면 결과 콜백이 전건 403 이 되어 증강이 PENDING 에 영구 고착된다(그래서
      #     GenAiIntegrationWiringGuard 가 이 조합에서 <위탁을> 거부한다 — 기동은 통과하고 ERROR
      #     로그만 남으며 조회·취소는 막지 않는다. 구 서술 「기동 시점에 차단한다」는 폐기 —
      #     2026-09-03 · ADR-062). 목은 docker 브리지 사설 IP 로
      #     접속해 대역을 고정할 수 없으므로 <로컬만> 0.0.0.0/0 을 명시한다(base 는 fail-closed 'none' 유지).
      #     .env 의 빈 값 대입에 좌우되지 않도록 리터럴로 못박는다(env_file < environment 우선순위).
      WEBHOOK_GENAI_ALLOWED_IP_CIDRS: "0.0.0.0/0"
      # Phase 7-B 실동작 설정 — VLM describe 위탁도 목 서버로 실제 POST 한다(내부 목모드 우회 금지).
      #   목의 POST /v1/videovlm/describe 가 즉시 accepted 를 돌려주고, 이후 콜백
      #   (POST /v1/vlm/callback)으로 구간별 결과를 push 하므로 위탁↔콜백 왕복이 실동작으로 검증된다.
      #   ★ 목은 TLS 미지원 평문 http + docker 브리지 사설 IP 인데, 그 형태가 전 프로파일에서
      #     그대로 통과한다(2026-08-10 확정). 구 완화 플래그 VLM_ALLOW_INSECURE_URL 은 제거됐다.
      VLM_SERVICE_URL: "http://klid-mock-server:9400"
      # 목이 발사하는 웹훅이 컨테이너 네트워크에서 BE 에 실제로 닿으려면 콜백 base 가 서비스명이어야 한다
      #   (기본값 localhost:8080 은 목 컨테이너 자신을 가리킨다). klid-backend:8080 은 목의 SSRF
      #   allowlist 기본값에 포함돼 있다. 수신 컨트롤러는 GenAiCallbackController(/v1/genai/callback).
      WEBHOOK_CALLBACK_BASE_URL: "http://klid-backend:8080/api"
      # 로컬 FE dev 서버는 docker 매핑 포트 13000 으로 서빙된다(klid-frontend ports 13000:5174).
      #   base 의 .env CORS_ALLOWED_ORIGINS 는 5173/5174/3000 만 포함해 브라우저 Origin
      #   http://localhost:13000 이 Spring CorsFilter 403("Invalid CORS request")으로 거부되고
      #   POST /v1/dev/tokens(dev 로그인)가 막힌다. compose environment 가 env_file 보다 우선하므로
      #   여기서 13000(+127.0.0.1 변형)을 포함해 오버라이드한다(자족 로컬 기동 전제).
      # 다른 기기(태블릿/폰/사내망 PC)에서 호스트 IP 로 붙는 경우도 같은 이유로 403 이 난다 —
      #   Vite 프록시가 changeOrigin: true 로 Host 만 바꾸고 Origin 헤더(http://<IP>:13000)는
      #   그대로 전달하므로 BE 는 cross-origin 으로 판정한다. SecurityConfig 는 정확 문자열
      #   매칭(setAllowedOrigins)이라 IP 오리진을 명시해야 한다(allowCredentials=true 라 "*" 불가).
      CORS_ALLOWED_ORIGINS: "http://localhost:13000,http://127.0.0.1:13000,http://localhost:5174,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5174,http://127.0.0.1:5173,http://127.0.0.1:3000,http://100.118.40.23:13000,http://100.118.40.23:5174,http://100.118.40.23:5173"

  klid-ai-server:
    environment:
      # mock 대신 실제 모델 로드 (CPU)
      AI_MOCK_MODE: "false"
      AI_DEVICE: cpu
      # 탐지/트래킹 백엔드는 YOLOX (ONNX Runtime, 로컬 yolox_s.onnx 가중치, 오프라인 CPU 동작).
      # HuggingFace 캐시를 named volume 에 고정 (SAM2 등, 재기동 시 재다운로드 방지)
      HF_HOME: /app/.hf-cache
    # nvidia 런타임 의존 제거 (GPU 없는 환경) — 기본 OCI 런타임 사용
    runtime: runc
    volumes:
      # 로컬 가중치 마운트 (YOLOX yolox_s.onnx, SAM2 sam2_t.pt 등).
      - ./ai-server/weights:/app/weights:ro
      - klid-hf-cache:/app/.hf-cache
    deploy:
      resources:
        limits:
          # CPU 실추론(YOLOX/SAM2) 메모리 여유 확보
          memory: 4096m

  # 외부 벤더 목(mock) 서버 — 비식별(KPST)·VLM·생성형AI 증강 실연동 테스트용.
  #   서비스 정의 본체(build/env/포트/헬스체크)는 base docker-compose.yml 로 승격됐다(dev 도 함께 사용).
  #   여기서는 **차이분(볼륨)만** 남긴다: /data 호스트 바인드 → backend 와 동일 named volume.
  #   (전체 정의를 다시 쓰면 base 와 갈라져 MOCK_OUTPUT_BASE·MOCK_GENAI_*·포트가 조용히 달라진다)
  #   ★ ports 를 여기서 재선언하지 말 것 — base 의 루프백 전용 발행(127.0.0.1:9400:9400)이
  #     무력화된다. 목 서버는 인증이 없어 외부 인터페이스 노출 자체가 취약점이다.
  #   ★ depends_on(klid-storage-init 완료)·MOCK_GENAI_INPUT_BASE/OUTPUT_BASE 도 base 에 있으므로
  #     여기서는 볼륨 대상만 named volume 으로 바꿔 준다.
  mock-server:
    volumes:
      - klid-storage:/app/storage
      # 생성형AI 산출물 전용 — 입력 트리와 분리(base 주석 참조). named volume 은 root:root 로
      #   생성되므로 klid-storage-init 이 chown 999 한 뒤에야 목이 결과를 저장할 수 있다.
      - klid-genai-out:/app/genai-out

volumes:
  klid-pgdata:
  klid-storage:
  klid-hf-cache:
  # 생성형AI 목 산출물 전용 — 입력(klid-storage)과 분리해 쓰기 권한이 입력 읽기 권한이 되지 않게 한다.
  klid-genai-out:
