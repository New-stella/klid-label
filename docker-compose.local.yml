# ============================================================================
# klid-label 로컬 외부 0개 자족 테스트 override
#   사용: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
#   목적: 관제/포털/비식별/실VLM 등 외부 서버 0개로 전 시나리오를 띄워 검증.
#   - ai-server: mock 이 아닌 CPU 실추론 + YOLOX 탐지(onnxruntime) (GPU 불필요 — Mac 등 호환).
#   - 호스트 절대경로(/data) 대신 named volume → 비-Linux/비-서버 환경에서도 기동.
#   - 비식별은 backend local 프로파일의 mock-mode(application-local.yml)로 자동 no-op
#     (실 비식별 서버 부재 — Phase 1). VLM 은 local 에서 enabled=false.
#
#   주의: ENV 환경변수를 dev/stg/prd 로 설정하지 말 것 (LocalProfileGuard + 비식별
#         mock 게이트가 부트 차단). 상세는 docs/v2-wiki/00-local-setup.md.
# ============================================================================

services:
  klid-postgres:
    # /data 호스트 바인드 → named volume 으로 교체 (postgres-init 바인드는 유지 병합)
    volumes:
      - klid-pgdata:/var/lib/postgresql/data
    # 방법 B(Native) 지원: 호스트 5432 발행 → native backend(127.0.0.1:5432)가 번들 DB에 접속.
    #   base compose 는 전부 docker 내부 통신이라 미발행. local override 에서만 노출한다.
    ports:
      - "5432:5432"

  klid-storage-init:
    # /data 호스트 바인드 → backend 와 동일 named volume 으로 교체.
    #   base 는 /data/klid/storage(호스트)를 init 하지만 local 의 backend 는 named volume(klid-storage)을
    #   쓰므로 서로 다른 위치를 가리키는 누락 버그였다. Mac/비-서버에서 호스트 바인드 미공유로 마운트 거부되고,
    #   설령 Linux 라도 backend 가 쓰는 볼륨을 init 하지 못한다. 같은 named volume 을 init 하도록 정정.
    volumes:
      - klid-storage:/storage

  klid-backend:
    # 영상 저장소 /data 바인드 → named volume
    volumes:
      - klid-storage:/app/storage
    environment:
      # 실 KPST 연동(목 서버) — local 기본 mock 비식별(DEIDENTIFY_MOCK_MODE=true)을 끄고
      #   KPST 경로로 전환해 mock-server(klid-net 의 klid-mock-server:9400)에 실제 위탁한다.
      #   목이 공유 볼륨(/app/storage)에 원본 복사(실영상)한 비식별 결과를 BE 가 그대로 소비한다.
      #   application-local.yml L66/93 문서화된 실연동 전환 방법.
      DEIDENTIFY_MOCK_MODE: "false"
      KPST_DEID_ENABLED: "true"
      KPST_DEID_BASE_URL: "http://klid-mock-server:9400"
      # D-48 실동작 설정 — 관제 완료/수정 통지를 목 서버로 실제 전송한다(내부 목모드 우회 금지).
      #   mock-server 의 /api/data-set/v2/jobs/{job_id}/notify-completed|notify-updated 가
      #   409(job_id 중복)/404(선행 완료 없음)를 관제 계약대로 돌려주므로 자기치유가 HTTP 왕복으로 검증된다.
      CONTROL_NOTIFY_ENABLED: "true"
      CONTROL_NOTIFY_URL: "http://klid-mock-server:9400"
      # 로컬 FE dev 서버는 docker 매핑 포트 13000 으로 서빙된다(klid-frontend ports 13000:5174).
      #   base 의 .env CORS_ALLOWED_ORIGINS 는 5173/5174/3000 만 포함해 브라우저 Origin
      #   http://localhost:13000 이 Spring CorsFilter 403("Invalid CORS request")으로 거부되고
      #   POST /v1/dev/tokens(dev 로그인)가 막힌다. compose environment 가 env_file 보다 우선하므로
      #   여기서 13000(+127.0.0.1 변형)을 포함해 오버라이드한다(자족 로컬 기동 전제).
      CORS_ALLOWED_ORIGINS: "http://localhost:13000,http://127.0.0.1:13000,http://localhost:5174,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5174,http://127.0.0.1:5173,http://127.0.0.1:3000"

  klid-ai-server:
    environment:
      # mock 대신 실제 모델 로드 (CPU)
      AI_MOCK_MODE: "false"
      AI_DEVICE: cpu
      # 탐지/트래킹 백엔드는 YOLOX (ONNX Runtime, 로컬 yolox_s.onnx 가중치, 오프라인 CPU 동작).
      # HuggingFace 캐시를 named volume 에 고정 (SAM2 등, 재기동 시 재다운로드 방지)
      HF_HOME: /app/.hf-cache
    # nvidia 런타임 의존 제거 (GPU 없는 환경) — 기본 OCI 런타임 사용
    runtime: runc
    volumes:
      # 로컬 가중치 마운트 (YOLOX yolox_s.onnx, SAM2 sam2_t.pt 등).
      - ./ai-server/weights:/app/weights:ro
      - klid-hf-cache:/app/.hf-cache
    deploy:
      resources:
        limits:
          # CPU 실추론(YOLOX/SAM2) 메모리 여유 확보
          memory: 4096m

  # 외부 벤더 목(mock) 서버 — 비식별(KPST)·VLM 개발 완료 전 실연동 테스트용.
  #   이미지 klid-mock-server:latest 는 feat/mock-external-server 브랜치(PR #26)에서 빌드됨
  #   (docker build -t klid-mock-server:latest mock-server/). 현재 워킹트리엔 소스가 없어 image 참조.
  #   ⚠ 로컬/테스트 전용 — 무인증 + 콜백 SSRF 표면. 신뢰망에서만 기동.
  mock-server:
    image: klid-mock-server:latest
    container_name: klid-mock-server
    restart: unless-stopped
    environment:
      # 비식별 더미 출력 파일 생성 base(=BE STORAGE_DEIDENTIFIED_PATH). 미설정이면 파일 미생성(fail-closed).
      MOCK_OUTPUT_BASE: /app/storage/deidentified
    volumes:
      # BE 와 동일 공유 볼륨·동일 경로 → BE 가 넘긴 절대경로(export_path/input_path)를 그대로 읽고 씀.
      - klid-storage:/app/storage
    ports:
      - "9400:9400"
    networks:
      - klid-net

volumes:
  klid-pgdata:
  klid-storage:
  klid-hf-cache:
