spring:
  application:
    name: klid-la-authoring
  profiles:
    active: local
  lifecycle:
    # ★ 종료 유예 시간 — server.shutdown=graceful 이 진행 중 요청을 기다리는 상한.
    #
    #   왜 30초인가 (배포 지연 ↔ 진행 중 작업 보존의 균형)
    #     - 통상 API 는 ms 단위라 30초면 사실상 전부 완주한다. 유예가 지키는 것의 대부분이 이쪽이다.
    #     - 대용량 내려받기(상한 30분)는 **어떤 현실적 유예로도 완주시킬 수 없다**. 유예의 목적은
    #       "완주 보장"이 아니라 "무의미한 중도 절단 최소화"다 — 30분을 주면 완주는 여전히 못 시키면서
    #       배포만 30분 멈춘다.
    #     - 노드당 최대 30초 → 2노드 롤링 재배포에서 이 항목이 더하는 지연은 최대 1분이다.
    #     - 프레임워크 기본값과 같은 값이라 놀람이 없다(명시하는 이유는 이 예산이 보여야 하기 때문).
    #   ⚠ 총 종료 시간은 이 값 + 비동기 실행기의 awaitTerminationSeconds(60s, MvcAsyncExecutorConfig)다.
    #     systemd TimeoutStopSec 은 그 합보다 커야 한다 — 작으면 SIGKILL 이 유예를 무의미하게 만든다
    #     (deploy/onprem/config/systemd/klid-backend.service, 회귀 고정: GracefulShutdownConfigGuardTest).
    #   ⚠ 실행기의 60초를 여기 맞춰 줄이지 않았다: 커넥터가 닫힌 뒤 남은 작업은 소켓 쓰기가 즉시
    #     실패해 스스로 끝나므로 그 60초는 실제로 소진되지 않는다(상한일 뿐이다).
    timeout-per-shutdown-phase: 30s
  mvc:
    async:
      # ★ 비동기 응답(StreamingResponseBody 등)의 제한시간(ms). <b>전 프로파일 공통</b>으로 준다.
      #
      #   왜 필요한가 — 이 키가 없으면 컨테이너 기본값 30초가 적용된다. 그리고 그 30초는
      #   "다음 쓰기까지의 공백"이 아니라 **비동기 처리 시작 이후의 절대 경과시간**이라
      #   서버가 쉬지 않고 데이터를 쓰고 있어도 리셋되지 않는다(격리 재현: 2초 간격 20청크를
      #   연속으로 쓰는 중 t=30.1s 에 강제 종료 — 클라이언트는 16개만 수신).
      #   그래서 포털 작업 데이터 내려받기(GET /v1/portal/datamart/videos/{rawSn}/download —
      #   현재 유일한 StreamingResponseBody 경로, 비식별 영상이 포함되면 GB 급)는 사실상
      #   전부 30초에 잘리고 있었다.
      #
      #   왜 30분인가 — 실효 대역 5Mbps(내부망 기준으로 보수적으로 잡은 값)에서 약 1.1GB 를
      #   받아낼 수 있는 시간이다. 화면 쪽 상한(frontend DATAMART_DOWNLOAD_TIMEOUT_MS)도 같은
      #   근거로 30분이라 두 값이 정렬돼 있다. ⚠ 실제 상한은 언제나 **경로에 걸린 상한들 중 가장
      #   작은 값**이므로, 앞단(프록시·게이트웨이)에 더 짧은 상한이 있으면 이 값과 무관하게
      #   거기서 끊긴다 — 그 계층 정렬은 별도 과제다(여기서 다른 파일을 고치지 않는다).
      #
      #   ⚠ 전역이라 대가가 있다(사용자가 인지·수용한 선택) — 어딘가에서 **멈춘** 비동기 요청도
      #     30초가 아니라 30분 동안 요청 스레드·커넥션을 붙잡는다. "왜 이렇게 길지"로 되돌리면
      #     대용량 내려받기가 다시 전량 30초에 잘린다. 되돌리기 전에 그 경로부터 확인할 것.
      #   ⚠ 프로파일별 yml 로 옮기지 말 것 — 한 곳이 빠진 환경만 조용히 30초로 되돌아가,
      #     그 환경에서만 재현되는 결함이 된다(회귀 고정: AsyncRequestTimeoutConfigGuardTest).
      request-timeout: 1800000
  data:
    web:
      pageable:
        # CWE-770 / OWASP API4: 페이지 size 상한 — 무제한 size 입력으로 DoS 차단.
        # 전역 적용: 모든 @PageableDefault / RequestParam size 가 100 으로 캡됨.
        max-page-size: 100
        default-page-size: 20
  servlet:
    multipart:
      # 포털 이미지 업로드(multipart/form-data)는 전 프로파일(prd 포함)에서 동작해야 하므로 활성화.
      # TUS 업로드는 application/offset+octet-stream (raw body) 이라 multipart resolver 가 개입하지 않는다
      # (content-type 이 multipart/form-data 가 아니면 파싱하지 않음) → TUS 무영향.
      #
      # ★ 개당 한도는 전 프로파일 500MB 로 같고, 요청 총량만 운영에서 좁힌다.
      #   - 공통 500MB/1200MB: 수동 업로드(/v1/dev/upload) 영상 개당 500MB 를 수용해야 해서
      #     local/dev/stg 가 동일 값을 각자 복붙하고 있던 것을 공통으로 승격했다.
      #   - 운영(prd)은 application-prd.yml 에서 요청 총량만 1100MB 로 **다시 조인다**(개당은 공통과 같다).
      #     ⚠ 구 기재 폐기(2026-08-24 CO-008): 이 자리에는 "운영은 dev 업로드 경로가 없으므로 21MB 로 조인다"
      #       가 적혀 있었다. 수동 업로드를 운영 상시 기능으로 켜면서 그 전제와 수치가 둘 다 무효가 됐다.
      #       CCTV 영상 실측이 246MB 라 21MB 로는 운영에서 한 건도 올릴 수 없다.
      #     ⚠ prd override 를 지우면 요청 총량이 1200MB 로 조용히 상향된다(자원 소진, OWASP API4)
      #       → ConfigProfileDriftGuardTest 가 prd 한도를 고정해 회귀를 차단한다.
      #   - 앱 레벨에도 별도 상한이 있다 — authoring.dev.upload.max-file-size(@Value 기본 524288000 = 500MB).
      #     여기 값과 **같은 값이라 서블릿이 먼저 413 을 낸다**. 한쪽을 바꿀 때 다른 쪽도 함께 볼 것.
      # file-size-threshold(1MB): 임계 초과분은 메모리 대신 임시파일로 스풀 — 다건 업로드 시 힙 소진 방지.
      enabled: true
      max-file-size: 500MB
      max-request-size: 1200MB
      file-size-threshold: 1MB
  task:
    scheduling:
      pool:
        # @Scheduled 전용 스레드 풀 (B-1). 기본값 1 이면 앱 전체 @Scheduled(17개)가 한 스레드를 공유한다.
        # 관제 통지 디바운서 flush 는 sendModified 를 동기 블로킹(.block(15s), 자기치유 시 2회=최대 30s)으로
        # 호출하므로, 관제가 응답하지 않으면 작업락 sweeper·TUS 정리·포털 업로드 sweep 등 무관한 잡이
        # 전부 정지한다. 풀을 늘려 한 잡의 지연이 전체 스케줄러를 막지 않게 한다.
        size: ${SCHEDULING_POOL_SIZE:8}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          time_zone: Asia/Seoul
        order_inserts: true
        order_updates: true
  datasource:
    control:
      # 이중화 동시 마이그레이션 안전장치 — Flyway/앱 DDL 이 락 미획득 시 무한 대기하지 않고
      # 30초 후 실패하게 한다(이중화 노드가 동시에 flyway_schema_history 생성 시 10분+ 멈춤 방지).
      # @ConfigurationProperties(spring.datasource.control) 로 HikariCP 에 바인딩되어
      # Flyway 가 빌려 쓰는 @Primary controlDataSource 커넥션에도 적용된다.
      #
      # ★ portal 데이터소스에 같은 설정이 없는 것은 누락이 아니라 의도다 —
      #   Flyway 는 @Primary(=control) 데이터소스에서만 실행되고(ControlDataSourceConfig),
      #   portal 은 포털 DB 에 메타를 단방향으로 써 넣을 뿐(DML upsert) 저작도구가 DDL 을 걸지 않는다.
      #   ⚠ 구 주석 "읽기 위주로 참조" 는 방향이 반대라 폐기한다 — 저작도구는 포털 DB 를 읽지 않는다
      #   즉 portal 쪽에는 방어할 DDL 락 경합 자체가 없으므로 세션 lock_timeout 을 강제하지 않는다.
      connection-init-sql: SET lock_timeout = '30000'
      # ★ 저작도구 전용 스키마(klid_at) — 이 커넥션 풀에서 나가는 <모든> SQL 의 search_path 다.
      #
      #   왜 여기(커넥션 수준)여야 하는가: hibernate.default_schema 는 JPA 매핑 SQL 만 한정하고
      #   @Query(nativeQuery=true) 의 비한정 테이블명·Quartz JobStore·Flyway 는 전부 <커넥션의
      #   search_path> 를 따른다. 커넥션 수준에서 잡지 않으면 "테스트는 통과하는데 런타임에서
      #   네이티브 쿼리만 깨지는" 형태가 된다.
      #
      #   왜 data-source-properties 인가: pgjdbc 의 currentSchema 는 <접속 시작 파라미터>로
      #   전달되어 별도 왕복 없이 search_path 를 확정한다. JDBC URL 뒤에 ?currentSchema= 로 붙이면
      #   프로파일 yml 4곳에 복제되는 데다 테스트는 URL 을 Testcontainers 값으로 <통째로 덮어써서>
      #   그 파라미터가 사라진다(= 검증되지 않는 배선). 여기 두면 단일 지점이고 테스트도 상속한다.
      #   ⚠ Hikari 의 schema 속성(Connection.setSchema)은 쓰지 않는다 — 스키마를 1개만 받는다.
      #   ⚠ connection-init-sql 에 SET search_path 를 이어붙이는 다중 문장 방식도 쓰지 않는다
      #     (드라이버·풀 구현 의존이라 조용히 첫 문장만 도는 형태가 될 수 있다).
      #
      #   ★ portal 데이터소스에는 <의도적으로> 두지 않는다 — 포털 DB 는 별개 물리 DB 이고
      #     그 복제본 스키마는 설치 단계(17-load-portal-schema.sh)가 public 에 로드한다.
      data-source-properties:
        currentSchema: ${DB_SCHEMA:klid_at}
  flyway:
    enabled: true
    baseline-on-migrate: true
    # baseline-version=0 필수 (2026-08-13 스쿼시로 <근거가 교체됨> — 구 근거 "V0__init.sql 은
    # placeholder 주석뿐" 은 V0 파일 자체가 사라져 무효다. 값은 그대로 0 이지만 이유가 다르다).
    #
    # 지금의 근거: baseline-on-migrate 는 <스키마가 비어있지 않은데 flyway_schema_history 가 없는>
    # DB 에서만 발동하며, 그때 baseline-version <b>이하</b>의 마이그레이션을 <전부 스킵>한다.
    # 스쿼시 이후 V1 은 스키마 전체(테이블 69·뷰 4·시드 14행 — 미사용 7종을 덜어낸 뒤)를 만드는
    # 베이스라인이므로,
    # baseline-version 을 1(Flyway 기본값)로 두면 그 상황에서 <스키마가 통째로 생성되지 않은 채>
    # V2 만 적용돼 기동 직후 ddl-auto=validate 가 전면 실패한다. 0 으로 두면 V1·V2 가 모두 적용된다.
    #
    # 이미 이력이 있는 DB 는 baseline 자체가 미발동하므로 이 값과 무관하다(영향 0).
    # ⚠ 스쿼시 이전에 만들어진 기존 DB(로컬·dev)는 <앱 기동 전에> 이력 180행을 베이스라인 1행으로
    #   이관해야 한다 — 절차는 deploy/onprem/docs/09-operations-runbook.md 「Flyway 스쿼시」 절.
    #   이관하지 않고 이력만 지우면 V1 이 기존 테이블 위에서 "already exists" 로 <시끄럽게 실패>한다
    #   (조용히 스킵되는 것보다 안전한 방향이라 의도적으로 이 형상을 둔다).
    baseline-version: 0
    locations: classpath:db/migration
    # ★ 마이그레이션 대상 스키마 — 데이터소스의 currentSchema 와 <반드시 같은 값>이어야 한다
    #   (갈리면 Flyway 가 만든 테이블을 런타임이 못 본다). 그래서 같은 ${DB_SCHEMA} 를 읽는다.
    #   - schemas        : Flyway 가 관리하는 스키마. 비면 커넥션의 search_path 첫 항목을 쓴다.
    #   - default-schema : flyway_schema_history 가 놓이는 스키마.
    #   - create-schemas : 빈 DB(Testcontainers·신규 설치)에서 스키마를 먼저 만든다. 이게 없으면
    #                      "schema does not exist" 로 첫 기동이 실패한다.
    #   ⚠ 기존 DB 는 <배포 전에> 스키마를 옮겨 둬야 한다. 옮기지 않으면 Flyway 가 klid_at 을
    #     빈 스키마로 보고 V1 부터 전량 재적용해, 데이터는 public 에 남고 앱은 빈 klid_at 을 본다.
    schemas: ${DB_SCHEMA:klid_at}
    default-schema: ${DB_SCHEMA:klid_at}
    create-schemas: true
  quartz:
    # JDBC JobStore — controlDataSource(@Primary) 를 통해 기존 QRTZ_* 테이블 공유.
    # 실제 라벨링 잡은 Phase 5 에서 등록. Phase 3 는 부트스트랩 잡 1개만.
    # jobStore.class 는 Spring Boot 가 LocalDataSourceJobStore 로 자동 지정하므로 명시 X.
    job-store-type: jdbc
    jdbc:
      initialize-schema: never  # 운영 QRTZ_* 는 이미 존재 / 로컬은 V2 Flyway 로 생성
    properties:
      org.quartz.scheduler.instanceName: KlidAuthoringScheduler
      org.quartz.scheduler.instanceId: AUTO
      # ★ 반복 잡이 <여덟>인데 이 값이 셋이다 — 그 셋은 <잡이 하나뿐이던 시절>에 정한 값이고
      #   그 뒤로 갱신된 적이 없다(바로 위 주석의 「Phase 3 는 부트스트랩 잡 1개만」이 그 흔적이다).
      #   지금 등록되는 반복 잡: 상태점검(추론) · 상태점검(시계열) · 비식별 폴링 · 배치 파이프라인 ·
      #   관제 인입 스캔 · 배치 재시도 · 산출 미결 스윕 · 산출 실패 회수.
      # ⚠ 60초의 배수마다 다섯이 동시에 발화하고, 더 긴 주기가 겹치는 시점에는 여덟까지 간다.
      #   모자라면 밀린 틱은 <몰아서 발화하지 않고 건너뛴다>(상태점검의 미스파이어 정책) —
      #   즉 죽은 장비 배제가 그만큼 늦어진다. 오류로 드러나지 않으므로 관측이 필요하다.
      # ★ 기본값은 <바꾸지 않았다> — 동작을 그대로 두고 손잡이만 냈다. 올리는 것은 이제 코드가
      #   아니라 설정 변경이다. 올릴 때는 <커넥션 여력과 함께> 판단할 것:
      #   상용은 maximum-pool-size 20 이라 여유가 있고, 그 밖 환경은 <명시가 없어 기본값>이다.
      org.quartz.threadPool.threadCount: '${QUARTZ_THREAD_COUNT:3}'
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      # ★ QRTZ_* 는 저작도구 스키마에 있다(V2 가 생성). initialize-schema=never 라 Quartz 는
      #   테이블을 만들지 않고 <찾기만> 하므로, 스키마가 어긋나면 기동이 그 자리에서 깨진다.
      #   커넥션 search_path(위 currentSchema)로도 해석되지만 명시 한정해 fail-closed 로 둔다
      #   (다른 스키마의 동명 QRTZ_* 를 우연히 잡는 일이 없다).
      org.quartz.jobStore.tablePrefix: ${DB_SCHEMA:klid_at}.QRTZ_
      org.quartz.jobStore.useProperties: 'true'
      org.quartz.jobStore.misfireThreshold: '60000'
      # 공통 기본값은 **단일 노드(local/dev)** 기준의 false 다.
      # true 시 노드들이 QRTZ_LOCKS 행 락으로 조율되어 각 트리거를 1회만 발화한다.
      # ★ 배포 환경(stg/prd)은 2노드 Active-Active 이므로 각 프로파일 yml 에서 true 로 override 하며,
      #   false 로 되돌리면 QuartzClusteringGuard 가 기동을 거부한다(B-ISSUE-81).
      # ⚠ 클러스터 모드는 노드 클럭 동기화(NTP) 필수.
      # ⚠ 클러스터링은 **트리거 중복 발화**만 막는다 — 잡 내부에서 여러 노드가 같은 행을 집는 레이스는
      #   각 잡의 원자 클레임(조건부 UPDATE)이 따로 막는다(어느 쪽도 다른 쪽을 대체하지 않음).
      org.quartz.jobStore.isClustered: ${QUARTZ_CLUSTERED:false}
      org.quartz.jobStore.clusterCheckinInterval: ${QUARTZ_CHECKIN_MS:20000}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  # Phase 12 — Caffeine 캐시: 캐시별 TTL/사이즈가 달라 명시적 CacheManager 빈으로 구성한다.
  #   (CacheConfig.cacheManager(): sysconfig 60s / stream-deid 5m)

server:
  port: 8080
  # ⚠ `forward-headers-strategy: framework` 를 켜지 말 것 (REDESIGN — 2026-07-25 회귀 되돌림).
  #  이 설정은 ForwardedHeaderFilter 를 Ordered.HIGHEST_PRECEDENCE 로 등록해 Security 체인·
  #  HmacWebhookFilter·StreamSignatureFilter 보다 앞에서 getRemoteAddr() 를 X-Forwarded-For 의
  #  '첫 토큰'으로 **무검증 치환**하고, X-Forwarded-* 헤더를 getHeader() 에서 숨긴다.
  #  ① 저작도구는 2노드 Active-Active 로 프록시를 우회한 직접 도달이 가능한 형상이라 "XFF 는 항상
  #     신뢰 프록시가 붙인다" 는 전제가 성립하지 않는다.
  #  ② webhook 가드는 ClientIpResolver 가 **신뢰 프록시 CIDR 대조 후 직접** XFF 를 파싱하는 설계인데,
  #     이 필터가 먼저 remoteAddr 를 덮으면 대조 대상이 공격자가 고른 값이 되어 rate limit(CWE-307)이
  #     헤더 한 줄 회전으로 완전히 우회되고(실측: 위조 XFF 회전 12연타 전부 401, 429 없음),
  #     공유 카운터 테이블(LS_WHK_FAIL_NMTM)에 공격자 지정 문자열이 IP 로 적재된다.
  #  회귀 고정: ForwardedHeadersConfigGuard 가 이 키(및 server.tomcat.remoteip.*)를 어떤 소스로든
  #  감지하면 **기동을 거부**한다 — yml(공통/프로파일별)·환경변수(SERVER_FORWARD_HEADERS_STRATEGY)·
  #  시스템 프로퍼티 전 축. 추가로
  #  WebhookPathBypassSecurityIT.rotatingForwardedForHeader_doesNotBypassRateLimit 가 런타임 동작을 고정한다.
  #  ※ nonce 쿠키의 Secure 는 헤더가 아니라 **배포 설정 authoring.stream.cookie-secure**(기본 OFF)로
  #    정하므로 이 설정과 무관하다(StreamNonceCookie). 구 서술 "프로파일로 강제" 는 폐기 — 프로파일
  #    유추가 dev 로 도는 평문 HTTP 개발 서버를 예외에서 빠뜨려 스트림이 전건 401 이었다.
  #  ※ HSTS 현황(사실 기록): 현재 HSTS 는 앱·edge 어디서도 부여되지 않는다. 앱은 프록시 뒤에서 평문
  #    HTTP 로 요청을 받아 isSecure()=false 이고, edge 템플릿(deploy/onprem/config/frontend/
  #    nginx.conf.template · Caddyfile.template)의 Strict-Transport-Security 는 **주석 처리** 상태다.
  #    이는 forward-headers-strategy 도입 이전부터의 상태이며 위 되돌림이 만든 회귀가 아니다.
  #    edge 부여는 **후속 과제**(A-ISSUE-06 연관) — 배포 설정 변경은 별도 검토가 필요하다.
  servlet:
    context-path: /api
  # ★ 종료 유예 — 배포 때마다 진행 중 응답을 끊지 않는다.
  #   왜 필요한가: 비동기 실행기(MvcAsyncExecutorConfig)는 이미 waitForTasksToCompleteOnShutdown 으로
  #   진행 중 작업을 기다리게 돼 있는데, **커넥터는 즉시 닫혀** 반쪽이었다. 커넥터가 먼저 닫히면
  #   실행기가 아무리 기다려도 쓸 소켓이 없다 — 두 반쪽이 맞물려야 유예가 성립한다.
  #   ⚠ 이 값은 spring.lifecycle.timeout-per-shutdown-phase 가 상한을 준다(아래 참조).
  shutdown: graceful
  tomcat:
    # TUS PATCH 본문(최대 청크) 흡수 + 폼 사이즈 제한 해제 — raw octet-stream 업로드 호환.
    max-swallow-size: -1
    max-http-form-post-size: -1
    threads:
      # ★ 요청 스레드 예산을 **명시**한다(프레임워크 기본값과 같은 값 — 동작 변화 없음).
      #   왜 적어 두는가: 이 수가 곧 "동시에 붙잡힐 수 있는 요청 스레드의 최대치" 이고, 대용량
      #   스트리밍 상한(PortalDatamartDownloadService.MAX_CONCURRENT_STREAMS)이 안전한지 판정하려면
      #   이 예산이 보여야 한다. 기본값에 의존하면 예산이 어디에도 안 적혀 있어, 되밀기가 요청
      #   스레드를 잠식해도 "한계가 얼마인지" 를 아무도 모른 채 앱 전체가 무응답이 된다.
      #   ⚠ 이 값을 줄이면 스트리밍 상한과의 여유(200 - 16)가 함께 줄어든다. 함께 볼 것.
      max: ${TOMCAT_MAX_THREADS:200}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      # ★인증 없이 열려 있는 /actuator/health 한 번이 <노드 수만큼의 순차 블로킹 핑>을 낸다
      #   (AiServerHealthIndicator — 각 상한 2초). TTL 이 없으면 매 요청 재실행이라 익명 요청이
      #   서블릿 스레드를 노드 수 x 2초씩 점유하고, 동시 요청이 스레드 상한을 채우면 앱 전체가
      #   무응답이 된다(CWE-770). 캐시를 고른 이유는 <증폭 자체를 없애기> 때문이다 — 병렬 핑은
      #   한 번의 소요만 줄이고 요청 수만큼의 증폭은 그대로 둔다. 익명 호출은 캐시 키가 같아
      #   전부 한 항목을 공유한다.
      #   TTL 은 <추론> 관측 주기(authoring.integration.ai-server.poll-interval-seconds 기본 5초)와
      #   같다 — 그보다 짧게 잡아도 원장·핑이 더 새로운 값을 내주지 않는다.
      #   ⚠ 2026-09-08 부터 주기가 계통마다 갈렸다(시계열은 vlm.client.poll-interval-seconds 기본 10초).
      #     이 TTL 을 두 주기에 맞출 필요는 없다 — 여기서 막는 것은 <익명 헬스 호출의 증폭>이지
      #     원장 신선도가 아니며, 값이 더 긴 계통은 그만큼 더 낡은 값을 볼 뿐이다.
      cache:
        time-to-live: ${ACTUATOR_HEALTH_CACHE_TTL:5s}

# Springdoc OpenAPI / Swagger UI — FE 개발 DX.
#   - swagger-ui.persist-authorization: 브라우저 새로고침 후에도 Authorize 토큰 유지 (핵심 DX).
#   - operations/tags-sorter: alpha — 엔드포인트/태그 알파벳 정렬로 탐색성 향상.
#   - display-request-duration: 호출 소요 시간 표시.
#   - 운영(prd)에서는 application-prd.yml 에서 api-docs/swagger-ui 모두 비활성화 (노출 차단).
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

authoring:
  # ★ 이 배포본이 «어느 채널용인가» — 설치 시점에 정하는 배포 향 (@design ADR-012).
  #   값역: control(관제 채널) | portal(포털 채널). 대소문자 무시.
  #
  # ★★ 이 값이 «인계 토큰의 채널 해석»을 정한다.
  #    · portal → 토큰의 channel 클레임을 «읽지 않고» PORTAL 로 확정한다(기본값 전환이 아니라 강제).
  #    · control → 종전 그대로. 클레임이 있으면 그 값, 없으면 INTERNAL.
  #    · 미선언·값역 밖 → control (fail-closed). 기동을 막지는 않고 로그로 드러낸다.
  #
  #   ⚠ 인증 전용 설정을 «새로 두지 않는다» — 같은 사실을 두 곳에서 선언하면 어긋났을 때
  #     어느 쪽이 참인지 판정할 수단이 없다. 그래서 이미 규정된 KLID_DEPLOY_FLAVOR 를 재사용한다.
  #   ⚠ 프론트의 VITE_BUILD_CHANNEL 과 «값이 같아야» 한다(키는 둘로 유지 — 합치지 않는다).
  #   ⚠ 잘못 선언하면 그 배포본이 «통째로» 반대 채널로 동작한다 — 토큰 단위로 바로잡을 여지가
  #     없다. 기동 로그의 [DeployFlavor] 줄이 유일한 사전 관측 수단이므로 배포 점검에 넣을 것.
  deploy:
    flavor: ${KLID_DEPLOY_FLAVOR:}

  # ★ 브라우저가 우리 API 를 부를 때 쓰는 «같은 출처 경로 접두어».
  #   응답 본문에 절대 경로를 담아 내려주는 세 자리(영상 재생 서명 주소·포털 업로드 재생 서명
  #   주소·검수 프레임 이미지 주소)가 이 값을 쓴다. 그 주소는 <video src>·<img src> 로 그대로
  #   들어가므로 <컨트롤러 매핑>이 아니라 <앞단 웹서버가 우리에게 넘겨주는 접두어>여야 한다.
  #
  # ★★ 대개는 <비워 둔다>. 비우면 WAR 웹 컨텍스트에서 자동으로 도출한다 —
  #    「컨트롤러는 컨텍스트 바로 아래 /v1 에서 시작한다」는 불변식 덕분에
  #    <브라우저 주소 = 웹 컨텍스트 + /v1> 이 성립하기 때문이다.
  #      포털향 : 컨텍스트 /authoring-api    → /authoring-api/v1
  #      관제향 : 컨텍스트 /label-studio/api → /label-studio/api/v1
  #      로컬   : 컨텍스트 /api              → /api/v1  (종전과 동일)
  #    ⇒ 웹 컨텍스트(KLID_WEB_CONTEXT) 한 곳만 바꾸면 두 축이 함께 움직인다.
  #      값을 두 곳에 적게 하면 <한 곳만 바꿨을 때 아무 신호 없이> 영상·이미지가 남의 서버로 간다.
  #
  #   ⚠ 명시가 «필요한» 경우: 앞단이 접두어를 <떼고> 넘기는 향(strip). 현재 그런 향은 없다.
  #   ⚠ 형식이 어긋나면 기동을 막는다(PublicApiPathGuard) — 스킴·호스트·'..'·질의·공백 금지.
  public-api-base-path: ${PUBLIC_API_BASE_PATH:}

  # Phase 1 (role-claim) — 관리자 공유 패스워드 BCrypt 해시 (cost ≥ 12).
  #   - 평문은 코드/yml 어디에도 보관 금지 (CWE-256). 해시만 보관.
  #   - 운영(dev/stg/prd)에서는 환경변수 ADMIN_CLAIM_PASSWORD_HASH 로 override 필수.
  #   - 로컬 기본값은 application-local.yml 에 명시.
  auth:
    # ★기본값은 평문 `admin` 의 BCrypt(cost 12) 해시다 (2026-09-01 사용자 확정).
    #   빈 값이면 어떤 패스워드도 통과하지 않아 최초 배포에서 관리자 기능에 손댈 수 없다.
    #   ⚠ 이것은 <널리 알려진 값>이다 — 운영 배포는 첫 진입 직후 화면에서 반드시 교체한다.
    #   교체하면 그 값이 저장소로 옮겨가고 이 설정값은 더 이상 판정에 쓰이지 않는다.
    admin-claim-password-hash: ${ADMIN_CLAIM_PASSWORD_HASH:$2b$12$iN2qH.urDFs.hh28.bskS.QjnQDVBqZYCq7gSEmzDg54EuOeXRu4W}
  user:
    last-login:
      # 최종로그인일시(LS_ACNT_USER.LAST_LGN_DT) 기록 최소 간격(분).
      #   저작도구엔 독립 로그인 UI 가 없어 기록 지점이 <JWT 검증을 통과한 요청>이고 그 경로는 모든
      #   요청에서 돈다. 이 값이 없으면 요청 수만큼 DB 쓰기가 발생하므로, 기록기가 넘기는
      #   (now - 이 값) 창을 조건부 UPDATE 의 WHERE 절이 판정한다.
      #   ★ 2노드 Active-Active 라 애플리케이션 로컬 캐시가 아니라 <DB 조건절>이 정확성의 근거다.
      #   0·음수·파싱 실패는 throttle 무력화와 같으므로 기동을 실패시키지 않고 기본값(5)으로 폴백한다
      #   (부가 기록 기능이라 잘못된 설정 하나로 앱이 뜨지 않는 편이 더 해롭다).
      throttle-minutes: ${USER_LAST_LOGIN_THROTTLE_MINUTES:5}
  portal:
    # ★ 포털 서버간 <정리 삭제 트리거> 창구의 사전 공유 키 (@design INT-014 · API-244).
    #   포털이 학습데이터셋의 새 버전을 받으면 이 창구를 부른다. 부르는 쪽이 사람이 아니라 포털
    #   서버라 토큰이 아니라 <사전에 나눠 가진 고정 문자열>로 가른다.
    #
    #   ★ 비면 그 창구가 닫힌다 — 어떤 요청도 통과하지 못한다(fail-closed). 값이 없을 때 열리는
    #     것이 아니라 <닫히는> 방향이라 안전하다. 배포에서 주입을 잊었을 때 무인증으로 열려 있는
    #     것보다 아예 안 받는 편이 낫다.
    #
    #   ⚠ 그 대가 — 포털이 호출을 시작했는데 이 값이 비어 있으면 <전건 거부>가 되고 포털에는
    #     「키가 틀렸다」로 보인다. 기동 로그에 그 상태를 한 번 남긴다.
    #
    #   ⚠ 관제지원 수신 채널이 쓰는 키와 <섞지 않는다> — 연동 축마다 별도 키가 원칙이고,
    #     한 축이 유출돼도 다른 축으로 번지지 않게 한다(포털 명시 요청).
    #   ⚠ 최상위 portal.* (업로드·데이터마트 보존)과는 다른 축이다. 합치지 말 것.
    cleanup-api-key: ${PORTAL_CLEANUP_API_KEY:}
  jwt:
    # 서명 알고리즘은 설정값이 아니라 코드 상수다 — 발급은 Jwts.SIG.HS256, 검증은 SecretKeyResolver 의
    #   HMAC 키(Keys.hmacShaKeyFor)로 고정. alg 를 설정으로 뽑으면 alg=none/약한 알고리즘 주입 표면이 생긴다(CWE-347).
    issuer: ${JWT_ISSUER:klid-auth}
    # 운영/스테이징/개발: 환경변수 JWT_SECRET 필수 (미설정 시 부트 실패)
    # 로컬: application-local.yml 의 dev 기본값 사용
    secret: ${JWT_SECRET}
    allowed-issuers: ${JWT_ALLOWED_ISSUERS:klid-auth,klid,klid-portal}
  storage:
    raw-path: ${STORAGE_RAW_PATH:./storage/raw}
    deidentified-path: ${STORAGE_DEIDENTIFIED_PATH:./storage/deidentified}
    # 구(롤백) 학습데이터 산출 루트 — base-strategy=labeling-root 일 때만 사용한다.
    #   기본 전략(co-locate)에서는 산출 루트가 dirname(RAW_FILE_PATH_NM)/{RAW_SN}/ 이라 이 값을 쓰지 않는다.
    labeling-path: ${STORAGE_LABELING_PATH:./storage/labeling}
    # 산출 base(=dirname(RAW_FILE_PATH_NM)) 검증용 <고정> allowlist — 콤마 구분 마운트 루트 목록.
    #   co-locate 산출은 base 를 DB 값에서 도출하므로, 요청과 무관한 이 고정 목록이 유일한 신뢰 기준이다
    #   (VideoArtifactRootResolver: lexical + toRealPath 재검증, CWE-22/59). 위반 시 폴백 없이 거부한다.
    #   미설정 시 기본값 = [raw-path, deidentified-path] (원본 NAS 마운트 + 파생영상 저장소). 다만 폴백 결과는
    #   배포 형상마다 갈리므로 각 배포 파일(docker-compose.yml / deploy/onprem/config/backend/env.template /
    #   .env.example)에서 STORAGE_RAW_MOUNT_ROOTS 를 <명시>한다 — 암묵 폴백에 기대지 않는다.
    #   ★ '/' 등 파일시스템 루트를 지정하면 가드가 무력화되므로 **기동을 실패**시킨다(fail-closed, CWE-1188).
    raw-mount-roots: ${STORAGE_RAW_MOUNT_ROOTS:}
    # 외부 벤더 산출물 <읽기> 전용 허용 루트 — 콤마 구분. 위 raw-mount-roots(쓰기 base 축)와 <별개 축>이다.
    #   왜 필요한가: 생성형 AI(증강) 벤더는 결과 이미지를 <자기 트리>에 쓰고 그 절대경로를 콜백으로 준다
    #   (local/dev 목=/app/genai-out, 실벤더=벤더 공유 NAS 경로). 우리는 그 파일을 <읽어서> 파생 프레임
    #   위치로 복사하므로, 그 트리를 쓰기 allowlist 에 넣으면 "우리가 산출물을 쓸 수 있는 범위"가 벤더
    #   트리까지 넓어져 PII 격리 축이 흐려진다. 그래서 읽기 축만 분리해 넓힌다.
    #   판정 절차(정규화 + lexical + toRealPath 재검증)는 쓰기 축과 <동일 코드>이며, 실제 허용 집합은
    #   [raw-mount-roots] ∪ [external-read-roots] 다. 미설정(기본)이면 쓰기 allowlist 와 완전히 동일해
    #   읽기 범위가 넓어지지 않는다(fail-closed — 설정하지 않으면 벤더 경로는 400 으로 거부된다).
    #   ★ '/' 등 파일시스템 루트를 지정하면 기동을 실패시킨다(쓰기 축과 동일, CWE-1188).
    external-read-roots: ${STORAGE_EXTERNAL_READ_ROOTS:}
    # 마킹 스트림 Range 요청당 반환 상한(bytes). 기본 8MB — 값이 작으면(구 1MB) 4배속 재생 시
    # 재요청 폭증으로 버벅임 발생. 1MB 미만 설정은 코드가 안전 기본값(8MB)으로 폴백한다.
    stream-chunk-size: ${STORAGE_STREAM_CHUNK_SIZE:8388608}
  # 학습데이터 파일 산출(export) 기능 토글 — 검수 승인 시 라벨링 산출물 파일 저장 활성화 여부.
  #   Phase 1 은 인프라(추적 테이블·경로 리졸버)만 도입하며, 실제 파일 쓰기/승인 연동은 후속 Phase.
  dataset-export:
    enabled: ${DATASET_EXPORT_ENABLED:true}
    # MED-1(Phase 5C) — 승인 후 수정 → v{n+1} export 전량 재생성을 발화시키는 디바운스 flush 스케줄러 토글.
    #   ControlNotifyDebouncer 는 이 flush 를 @Scheduled(=@EnableScheduling 의존)가 아니라 자신이 소유한
    #   데몬 스레드 1개짜리 전용 스케줄러로 돌린다(RoleClaimAttemptPurgeJob/WebhookGuardPurgeJob 동형).
    #   그래서 control-notify/work-lock/resolution 등 무관한 스케줄러 토글의 on/off 와 독립적으로 항상 tick 하며,
    #   다른 @Scheduled 잡(Portal/TUS sweep)을 부수적으로 발화시키지 않는다.
    #   기본 활성 — 운영에서 끄지 말 것(끄면 승인 후 수정이 재생성까지 도달하지 못함). 테스트만 격리 목적 false.
    regen-flush:
      enabled: ${DATASET_EXPORT_REGEN_FLUSH_ENABLED:true}
    # 산출 루트 전략(A-8 롤백 플래그).
    #   co-locate(기본) — dirname(RAW_FILE_PATH_NM)/{RAW_SN}/ 아래 deid/ + v{n}/{orgnl|deid}/.
    #                     관제가 경로 1개로 비식별 영상 + 전 버전 산출물을 픽업한다.
    #   labeling-root   — 구 구조({labeling_root}/{RAW_SN}/v{n}/…, 비식별 영상은 {deid_base}/videos/{RAW_SN}/).
    #   이 플래그는 <신규 산출 시점의 base 선택>에만 관여한다. 이미 DB 에 적재된 절대경로
    #   (LS_DATASET_EXPORT.EXPORT_PATH_NM · LS_DEIDENT_PROC_LOG.DE_IDNTF_FILE_PATH_NM)는 재계산하지 않으므로
    #   전략을 되돌려도 기존 산출물 조회가 깨지지 않는다.
    base-strategy: ${DATASET_EXPORT_BASE_STRATEGY:co-locate}
    # stale PENDING 정리 잡 — 파일 쓰기/상태 마감 전 크래시로 PENDING 고착된 export 를 주기 회수(FAILED 마감, 파일 삭제 없음).
    #   enabled=false 시 잡 미등록(test/local 격리). interval-sec 간격 tick, stale-minutes 초과 PENDING 만 대상.
    pending-sweep:
      enabled: ${DATASET_EXPORT_SWEEP_ENABLED:true}
      interval-sec: ${DATASET_EXPORT_SWEEP_INTERVAL_SEC:600}
      stale-minutes: ${DATASET_EXPORT_SWEEP_STALE_MINUTES:30}
    # 실패 export 회수 잡(D-ISSUE-04) — 최신 export 가 FAILED 인 영상을 주기적으로 재산출 트리거.
    #   승인 후 export 는 AFTER_COMMIT @Async 라 실패해도 롤백되지 않고 재시도 경로가 없었다.
    #   retry-delay-minutes: 실패 후 재시도까지 유예(일시 장애 진정 대기).
    #   max-attempts: 마지막 성공/부분 산출 이후 누적 실패 허용 횟수(초과 시 자동 회수 중단 — 운영 개입 필요).
    #   batch-size: tick 당 재시도 트리거 상한.
    failure-recovery:
      enabled: ${DATASET_EXPORT_RECOVERY_ENABLED:true}
      interval-sec: ${DATASET_EXPORT_RECOVERY_INTERVAL_SEC:900}
      retry-delay-minutes: ${DATASET_EXPORT_RECOVERY_DELAY_MINUTES:10}
      max-attempts: ${DATASET_EXPORT_RECOVERY_MAX_ATTEMPTS:3}
      batch-size: ${DATASET_EXPORT_RECOVERY_BATCH_SIZE:20}
  # 통합 메타 스냅샷(LS_DATASET_VIDEO_META) 소급 보정 — 기동 시 1회(DatasetVideoMetaBackfillRunner, !local).
  dataset-video-meta:
    # M-1(Phase 10B) 촬영환경 레거시 파생 동결값 정정 백필의 <1회 실행당 상한>.
    #   정정 1건마다 export 폴더가 새 버전으로 전량 재생성되고 관제 통지가 나가므로, 승인 영상이 많은
    #   환경에서 한 번에 전부 돌리면 스토리지·통지가 몰린다. 잔여분은 다음 기동에서 이어서 처리된다
    #   (정정된 영상은 판별식에서 빠져 멱등). 대상 총건수/잔여건수는 실행 로그에 남는다.
    env-correction:
      max-per-run: ${DATASET_ENV_CORRECTION_MAX_PER_RUN:200}
  # R6 — 영상 단위 「시작 버전 선택」 자원 상한. 불러오기(GET /v1/videos/{rawSn}/versions/{version}/labels,
  #   API-195)와 확정 저장(PUT /v1/videos/{rawSn}/labels, API-196)이 <같은 값>을 쓴다 — 두 곳에 상한을
  #   두면 한쪽만 조정돼 어긋난다. (구 PUT /videos/{rawSn}/start-version 즉시 적용 경로는 폐기됐다.)
  #   요청 1건이 영상의 <전 프레임> 라벨을 한 트랜잭션에서 교체하고 프레임 행 락을 커밋까지 보유하며,
  #   승인 영상이면 호출마다 산출물 전량 재생성(이미지 2벌)을 유발한다. 상한이 없으면 요청 1건이
  #   커넥션을 장시간 점유해 그 영상의 라벨 저장·승인을 전면 블록한다(CWE-770).
  #   - max-frames: 초과 요청은 잘라내지 않고 400 으로 거부한다(일부만 저장하면 회차가 섞인 혼합
  #     영상이 된다). 0 이하로 설정하면 <기동이 실패>한다 — 빈 값이 기본값을 무력화해 상한이 조용히
  #     사라지거나 기능이 통째로 죽는 것을 막는 fail-closed 검증이다(StartVersionProperties).
  version:
    start-version:
      max-frames: ${START_VERSION_MAX_FRAMES:2000}
  # 콜백 충실 플로우 — 외부 증강 시스템이 결과를 push 할 콜백 엔드포인트 base URL.
  #   - 실제 콜백 경로는 base + /v1/genai/callback (WebhookProtectedPaths.PATH_GENAI_CALLBACK).
  #     운영(dev/stg/prd)에서는 환경변수로 override.
  webhook:
    callback-base-url: ${WEBHOOK_CALLBACK_BASE_URL:http://localhost:8080/api}
    idempotency:
      # 콜백 멱등 원장 구현 선택. 기본 false = DB 원장(PersistentWebhookIdempotencyLedger, 2노드 공유).
      #   true 로 켜면 프로세스 메모리 원장(InMemoryWebhookIdempotencyLedger)이 대신 등록된다 —
      #   재기동 시 유실 + 노드 간 미공유라 단일 프로세스 테스트/실험 용도로만 쓴다.
      in-memory: ${WEBHOOK_IDEMPOTENCY_IN_MEMORY:false}
  # Phase 7-A1 — 외부 증강(생성형 AI) 위탁 클라이언트.
  #   「생성형 AI API 연동명세서 v1.1」 정합. 인증 없음(명세서·벤더 목 모두 미구현이 확정 계약).
  #   - ⚠ mode(AUGMENT_EXTERNAL_MODE): <축 자체가 폐기>됐다(2026-09-03 확정). 「나갈지 말지」를
  #     환경설정으로 고르지 않으며 <연동이 유일한 형상>이다. 아래 augment.external 블록 주석이 정본.
  #     ★ 구 서술 폐기 — "http(기본) | noop(외부 미연동, dev/stg/prd 가 명시 사용)" 도,
  #       "'dev' 를 넣으면 ExternalAugmentClient 빈이 하나도 등록되지 않아 기동이 실패한다" 도
  #       <더 이상 사실이 아니다>. 이 키는 어디에서도 읽히지 않아 어떤 값을 넣어도 아무 일이 없고
  #       위탁 클라이언트 빈은 언제나 만들어진다(회귀 가드 retiredModeToggleNoLongerGatesTheBean).
  #     ★ 되살리지 말 것 — 그 토글이 「벤더 주소가 아직 없다」를 피하는 우회로 쓰이면서
  #       dev/stg/prd 가 전부 미연동으로 도망가 위탁이 한 번도 나간 적이 없는 상태가 굳었다.
  #       「아직 연동 안 됨」의 유일한 표현은 <base-url 이 비어 있는 것>이다.
  #   - base-url: 벤더/목 서버 base. 검증은 AugmentUrlPolicy(=VLM·KPST 와 동일 공용 정책)이며
  #     <스킴(http/https) + 형식>만 본다 — 대역 차단·HTTPS 강제는 2026-09-01 확정으로 폐기됐다
  #     (연동 대상이 내부망 별도 장비일 수 있고, 아웃바운드 통제는 인프라 계층의 몫).
  #     placeholder 호스트·비허용 스키마·클라우드 메타데이터 등 예약 대역 차단은 전 프로파일에서 유지된다.
  #     ★ 구 완화 플래그 allow-insecure-url(AUGMENT_ALLOW_INSECURE_URL)은 켜든 끄든 결과가 같아져
  #       <죽은 설정>이 되었으므로 제거했다. 되살리지 말 것.
  #     ★ 위 「차단」은 전부 <위탁 시점> 거부다 — 어떤 주소값도 기동을 막지 않는다
  #       (2026-09-03 · ADR-062). 구 서술 「평문 벤더 주소에서 기동이 막힌다」는 폐기.
  #     ★ 기본값에 localhost 를 두지 않는다 — 목업 기본값이 운영 형상에 상주해 환경변수 미설정 배포가
  #       조용히 목업을 향해 기동하는 것을 막는다. local 은 application-local.yml/compose 가 명시 주입.
  #   - max-input-files: 분할 위탁 청크 크기. 계약 상한 100 을 넘길 수 없다(초과 설정은 100 으로 clamp).
  augment:
    external:
      # ★ 미연동 모드 토글(AUGMENT_EXTERNAL_MODE)은 2026-09-03 확정으로 <축 자체가 폐기>됐다.
      #   「나갈지 말지」를 환경설정으로 고르지 않는다 — 연동이 유일한 형상이다. 되살리지 말 것:
      #   그 우회 때문에 dev/stg/prd 가 전부 미연동으로 도망가 위탁이 한 번도 나간 적이 없었다.
      #   「아직 연동 안 됨」의 유일한 표현은 <base-url 이 비어 있는 것>이며, 그때 기동은 정상이고
      #   위탁 시도 시점에 실패한다(AugmentTransportGuard).
      base-url: ${AUGMENT_API_BASE_URL:}
      timeout-seconds: ${AUGMENT_API_TIMEOUT_SECONDS:10}
      max-input-files: ${AUGMENT_MAX_INPUT_FILES:100}
    # Phase 8-A — 위탁 job 만료 스윕(AugmentJobExpirySweeper). 비종결(RECEIVED/RUNNING)로 떠 있는
    #   LS_DATA_AUG_JOB 을 회수해 종결을 보장한다. 회수되지 않으면 롤업이 무기한 보류돼 증강 1건이
    #   PENDING 에 영구 고착된다(취소 통보 미수신·콜백 400 거부·외부 무응답).
    #   ★ 이 스윕은 자기 토글만 본다 — 위탁 주소(external.base-url)·관제 통지 토글에 얹지 않는다.
    #     위탁 주소가 없는 환경은 후보가 0건이라 무해하게 돈다.
    #   ★ 전용 데몬 executor 로 기동한다(@Scheduled 미사용) — 무조건적 @EnableScheduling 은 게이팅
    #     없는 남의 @Scheduled 잡까지 전 환경에서 깨운다.
    #   - idle-timeout-minutes: 마지막 갱신(MDFCN_DT) 이후 이 시간이 지나면 만료 종결한다. RUNNING
    #     웹훅이 계속 오는 정상 장기 작업은 갱신이 이어져 대상이 아니다. 하한 5분(오설정 fail-safe).
    #   - batch-size: tick 당 회수 상한(자원 고갈 방지).
    job-expiry:
      enabled: ${AUGMENT_JOB_EXPIRY_ENABLED:true}
      interval-ms: ${AUGMENT_JOB_EXPIRY_INTERVAL_MS:900000}
      initial-delay-ms: ${AUGMENT_JOB_EXPIRY_INITIAL_DELAY_MS:300000}
      idle-timeout-minutes: ${AUGMENT_JOB_EXPIRY_IDLE_TIMEOUT_MINUTES:360}
      batch-size: ${AUGMENT_JOB_EXPIRY_BATCH_SIZE:50}
    # 증강 파생영상 폐기(소프트 삭제 → 유예 → 실삭제) — Phase 7.
    #   REVIEWER 반려 시 폐기 표식(LS_DATA_AUG_DSCD)을 남기고, grace-days 가 지나면 배치가 DB 행과
    #   생성 파일까지 삭제한다. 유예 내에는 복구(POST /v1/augments/{id}/restore)로 되돌릴 수 있다.
    #   ★ grace-days 는 0/음수면 <기동을 거부>한다(AugmentDiscardProperties) — 0 은 "반려 즉시 영구
    #     삭제" 라 되돌릴 수 없다. .env 에 빈 값을 두면 기본값이 적용되지 않으니 값을 반드시 명시할 것.
    #   ★ 전용 데몬 executor 로 기동한다(@Scheduled 미사용, job-expiry 와 동일 이유).
    #   - claim-stale-minutes: 클레임 후 집행이 끝나지 않으면(프로세스 사망 등) 재클레임을 허용하는 경과.
    #   - file-cleanup-max-attempts: DB 는 지웠는데 파일 정리가 실패한 비석의 <재시도 상한>. 초과하면
    #     재시도 큐에서 빼고(데드레터) 사람이 수동 정리한다. interval-ms 와 곱해 <자동 복구를 포기하기까지의
    #     시간>이 정해지므로(기본 1h × 5회 = 5시간) NAS 장애가 그보다 길 수 있는 환경에서는 올려야 한다.
    discard:
      enabled: ${AUGMENT_DISCARD_ENABLED:true}
      grace-days: ${AUGMENT_DISCARD_GRACE_DAYS:7}
      interval-ms: ${AUGMENT_DISCARD_INTERVAL_MS:3600000}
      initial-delay-ms: ${AUGMENT_DISCARD_INITIAL_DELAY_MS:600000}
      batch-size: ${AUGMENT_DISCARD_BATCH_SIZE:50}
      claim-stale-minutes: ${AUGMENT_DISCARD_CLAIM_STALE_MINUTES:60}
      file-cleanup-max-attempts: ${AUGMENT_DISCARD_FILE_CLEANUP_MAX_ATTEMPTS:5}
  # TUS 1.0 재개 가능 업로드 (관리 화면 대용량 영상 적재).
  #   - max-file-size: 전체 파일 크기 상한(bytes). POST 시 Upload-Length 초과 즉시 413.
  #   - max-chunk-bytes: 단일 PATCH 청크 크기 상한(bytes). 본문은 64KB 버퍼로 스트리밍 기록(OOM 방어),
  #     누적이 한도 초과 시 413 + truncate 롤백. 기본 16MB.
  upload:
    tus:
      max-file-size: ${TUS_MAX_FILE_SIZE:524288000}
      max-chunk-bytes: ${TUS_MAX_CHUNK_BYTES:16777216}
      # 만료 TUS 세션 정리 잡(TusUploadCleanupJob) 스케줄 — @Scheduled 고정 지연.
      #   interval-ms 1h 마다 실행, 부팅 후 initial-delay-ms 10m 뒤 첫 실행(기동 부하 회피).
      cleanup:
        interval-ms: ${TUS_CLEANUP_INTERVAL_MS:3600000}
        initial-delay-ms: ${TUS_CLEANUP_INITIAL_DELAY_MS:600000}
  # 영상 스트림 단기 서명 URL — <video> 가 Authorization 헤더를 못 붙이는 문제 우회.
  #   - sign-secret: JWT_SECRET 재사용 금지(키 분리). 운영(dev/stg/prd)은 STREAM_SIGN_SECRET 환경변수 필수.
  #     설정 시 256bit(32B) 이상이어야 함(미달 시 부팅 차단). 미설정이면 서명 URL 발급/검증 모두 fail-closed.
  #     로컬 기본값은 application-local.yml 에 명시.
  #   - url-ttl-seconds: 서명 유효 시간(초). 5~600 클램프. 기본 60s.
  #   - cookie-secure: 서명 검증 입력인 nonce 쿠키(klid_stream_nonce)에 Secure 속성을 붙일지.
  #     ★ 기본은 OFF(false) 다. HTTPS 로 서비스되는 배포에서 켜려면 STREAM_COOKIE_SECURE=true 로 명시할 것.
  #     기본을 OFF 로 둔 이유: 켜져 있으면 평문 HTTP 로 서비스되는 배포에서 브라우저가 쿠키를 저장하지 않아
  #     서명 검증이 전량 실패하고 영상이 아예 재생되지 않는다. 이는 개발 서버만의 문제가 아니었다 —
  #     온프렘 운영 설치도 프로파일은 prd 인데 프런트가 평문 HTTP(:80)이고 폐쇄망이라 TLS 를 걸지 않는 것이
  #     설치 기본이라(deploy/onprem/docs/04-configuration.md), 프로파일로 Secure 를 강제하던 구 동작은
  #     운영에서도 같은 결함이었다. 대가는 켜지 않은 HTTPS 배포에서 이 쿠키가 평문 http 요청에 실려 나갈
  #     수 있다는 것이며, 인지·수용된 선택이다. 기본값 회귀는 StreamCookieSecureDefaultGuardTest 가 고정한다.
  #     ⚠ request.isSecure()/X-Forwarded-Proto 로 자동 판정하지 말 것 — TLS 종단 LB 뒤에서 항상 false 이고
  #     forward-headers-strategy 는 2026-07-25 REDESIGN 으로 되돌린 결정이다(기동 가드가 거부).
  stream:
    sign-secret: ${STREAM_SIGN_SECRET:}
    url-ttl-seconds: ${STREAM_URL_TTL_SECONDS:60}
    cookie-secure: ${STREAM_COOKIE_SECURE:false}
  integration:
    deidentify:
      base-url: ${DEIDENTIFY_API_URL:http://localhost:9200}
      # 타임아웃은 여기 설정값이 아니라 KpstDeidentifyClient 상수가 단일 출처다
      #   (업로드/다운로드 10m, 그 외 45s — WebClient `.timeout(...)` 으로 Reactor 네이티브 처리).
    ai-server:
      base-url: ${AI_SERVER_URL:http://localhost:9300}
      # 타임아웃은 resilience4j.timelimiter.instances.ai(60s) 가 단일 출처다.
      #
      # --- 노드 관측(상태점검·부하) — ADR-057 -------------------------------------------------
      # base-url 은 원장이 비어 있을 때의 <씨앗>이고, 그 뒤로는 LS_AI_SRVR 원장이 이긴다.
      # 아래 값들은 그 원장을 주기적으로 갱신하는 배치의 설정이다.
      #
      # ★ poll-enabled 기본값을 true 로 켠다 (2026-09-01). 아래 <꺼둔 이유>는 이제 해소됐다 —
      #   그 조건이 「실행이 용도별로 나뉜 뒤에 켠다」였고, 추론 서버의 실행이 용도별 슬롯으로
      #   갈리면서 배치 포화 중에도 인터랙티브 응답이 유지되는 것이 실측으로 확인됐다.
      #   ⚠ 꺼둔 채로 두면 <분산이 도입됐는데 동작하지 않는> 상태가 조용히 유지된다: 관측값이
      #     전부 0 으로 동률이 되고 동률의 결정 규칙이 식별자 순서라 요청이 항상 한 대로만 간다.
      #     장비를 여러 대 등록해도 소용이 없고 아무 신호도 나지 않는다.
      #   ⚠ 시계열 축은 이 설정과 무관하다 — 그 축의 부하 원천은 폴러가 아니라 <우리 원장의 미결
      #     위탁 수>라 외부를 찌르지 않는다(꺼져 있어도 분산된다).
      #
      # --- 아래는 <왜 처음에 꺼두고 들어갔는지>의 기록이다. 되살릴 동작이 아니라 근거다. ---
      # ★ poll-enabled 기본값이 false 였던 것은 미완성이라서가 아니라 <의도된 배포 형상>이었다.
      #   상태 점검과 부하 조회는 둘 다 추론 서버가 요청을 받아 응답할 여유가 있어야 성립하는데,
      #   추론 서버가 실행을 용도별로 나누기 전에는 추론이 처리 흐름을 통째로 붙잡아 상태 점검조차
      #   늦어진다. 그 시기에 켜면 <바쁜 장비를 죽은 장비로 오판>하고, 장비가 둘 이상이면 먼저
      #   판정된 하나는 「마지막 가용 노드 보호」에 걸리지 않아 <멀쩡한 장비를 하나 잃는다>.
      #   그래서 부하 축만이 아니라 상태 점검 축까지 함께 끄고 들어가며, 실행이 용도별로 나뉜 뒤에 켠다.
      #   켜짐/꺼짐은 잡 <등록 여부> 자체를 가른다(꺼져 있으면 이 관측 배치는 외부 호출을 한 건도
      #   내지 않는다). ⚠ 시스템 전체로 확대해 읽지 말 것 — /actuator/health 의 ai-server 인디케이터는
      #   이 설정과 무관하게 호출될 때마다 노드를 직접 핑한다(배치가 꺼져 있어 원장 값이 갱신되지
      #   않으므로 그것이 의도다).
      #   ⚠ 이 값은 잡 등록 조건 @ConditionalOnProperty(havingValue="true") 가 읽는다 — "true" 만
      #   참이며 1/on/yes 는 <꺼짐>이다(폴러도 같은 규칙으로 읽는다).
      poll-enabled: ${AI_SERVER_POLL_ENABLED:true}
      # 상태점검 주기(초) — <추론 계통 전용> (ADR-057 · AC-1099).
      # ⚠ 그 계통의 노드 수 x 핑 상한(2초)이 이 값을 넘으면 틱이 뒤로 밀린다.
      # ★ 계통마다 <자기 자리와 자기 기본값>을 갖는다. 시계열 계통의 주기는
      #   vlm.client.poll-interval-seconds 이며 <서로를 물려받지 않는다> — 트리거가 계통마다
      #   따로 있어 이 값을 바꿔도 시계열 점검 간격은 움직이지 않는다(그 반대도 같다).
      # ⚠ 0 이하를 넣으면 Quartz 가 트리거를 만들지 못해 기동이 깨진다 — 하한 1로 흡수한다.
      poll-interval-seconds: ${AI_SERVER_POLL_INTERVAL_SECONDS:5}
      # 부하 조회(GET /internal/load) 상한(ms). ★ 이 상한을 넘긴 것을 「포화」로 읽지 않는다 —
      #   그 경로는 슬롯을 거치지 않으므로 느린 것은 부하 신호가 아니라 배선·프로세스 이상 신호다.
      #   부하를 미상으로 두고 직전 값을 유지하며, 연속 실패 판정은 상태점검 축이 따로 한다.
      load-timeout-ms: ${AI_SERVER_LOAD_TIMEOUT_MS:500}
      # 평활 표본 수 — 최근 N회 관측의 <최대값>을 쓴다(평균이 아니다). 과소평가는 이미 밀린 노드에
      #   요청을 더 얹지만, 과대평가는 요청을 옆 노드로 보낼 뿐이라 손해가 작은 쪽을 골랐다.
      smoothing-window: ${AI_SERVER_SMOOTHING_WINDOW:3}
      # 연속 실패 N회 -> 이용불가 / 연속 성공 N회 -> 복귀. 한 번의 네트워크 흔들림으로 장비를
      #   잃지 않으려고 연속을 센다(둘 다 하한 1로 클램프).
      fail-threshold: ${AI_SERVER_FAIL_THRESHOLD:3}
      recover-threshold: ${AI_SERVER_RECOVER_THRESHOLD:3}
  batch:
    # Phase 5 배치 파이프라인
    enabled: ${BATCH_ENABLED:true}
    interval-sec: ${BATCH_INTERVAL_SEC:60}
    retry:
      max-attempts: ${BATCH_RETRY_MAX:3}
      initial-delay-sec: ${BATCH_RETRY_INITIAL_DELAY_SEC:60}
      interval-sec: ${BATCH_RETRY_INTERVAL_SEC:300}
      # B-ISSUE-83 — stale RETRYING 회수 스윕(BatchRetryStaleReclaimSweeper).
      #   RETRYING 은 폴링 노드의 "처리 중" 표시이고 PENDING 복귀는 그 노드가 정상적으로 예외를 받을
      #   때만 일어난다. 노드가 처리 중 죽으면(kill -9/OOM/순단) 항목이 영구 RETRYING 으로 남아 해당
      #   영상의 재시도가 무음 중단된다. 이 스윕이 임계를 넘긴 항목만 PENDING 으로 되돌린다.
      #   - enabled: 자기 토글. batch.enabled 등 남의 스위치에 얹지 않는다(무관 토글 종속 사고 방지).
      #   - interval-ms/initial-delay-ms: 전용 데몬 스케줄러 주기(@EnableScheduling 비의존). 주기 하한 1분.
      #   - stale-timeout-minutes: 마지막 갱신(MDFCN_DT=클레임 시각) 이후 이 시간이 지나야 회수 대상이다.
      #     정상 처리 중인 항목을 뺏지 않으려면 배치 1건 최장 처리 시간보다 커야 한다. 하한 30분(fail-safe).
      #   - batch-size: tick 당 회수 상한(자원 고갈 방지).
      stale-reclaim:
        enabled: ${BATCH_RETRY_STALE_RECLAIM_ENABLED:true}
        interval-ms: ${BATCH_RETRY_STALE_RECLAIM_INTERVAL_MS:900000}
        initial-delay-ms: ${BATCH_RETRY_STALE_RECLAIM_INITIAL_DELAY_MS:300000}
        stale-timeout-minutes: ${BATCH_RETRY_STALE_RECLAIM_TIMEOUT_MINUTES:180}
        batch-size: ${BATCH_RETRY_STALE_RECLAIM_BATCH_SIZE:50}
    # 「처리 중」 고착 회수 스윕(ProcessingStaleReclaimSweeper).
    #   재기동/묶음 재수행은 요청 안에서 배치 단계를 PROCESSING 으로 선점하고 실행은 전용 풀
    #   (core 2 / 큐 4)로 넘긴다. 그 대기 중에 노드가 재시작·재배포되면 큐는 사라지는데 선점 표시는
    #   DB 에 남아, 그 영상은 이후 모든 재기동이 409 로 막히고 앱 안에 복구 수단이 0 이 된다.
    #   이 스윕이 유일한 복구 경로이며 상태를 되돌리기만 하고 자동 재시도하지 않는다(사람이 다시 누른다).
    #   - enabled: 자기 토글. batch.enabled 등 남의 스위치에 얹지 않는다(무관 토글 종속 사고 방지).
    #   - interval-ms/initial-delay-ms: 전용 데몬 스케줄러 주기(@EnableScheduling 비의존). 주기 하한 1분.
    #   - stale-timeout-minutes: 「선점 시각」과 「진행 로그 마지막 갱신」 중 더 나중이 이 시간을 넘겨야
    #     회수 대상이다(=진행이 멈췄는가). 실행 중 파이프라인을 뺏지 않으려면 ①선점 후 실행 시작까지의
    #     큐 대기 ②가장 긴 단일 단계(오토라벨) 보다 커야 한다.
    #     ★②의 소요는 「호출당 타임아웃」이 아니라 「프레임 수 × 호출 시간」이며 프레임 수 상한은 코드에
    #      없다(추출 간격과 영상 길이가 정한다). 호출당 타임아웃만 보고 "최장 단계가 1분 남짓"으로 읽어
    #      임계를 낮추지 말 것 — 프레임이 수천 장이면 이 단계 하나가 몇 시간이 될 수 있다.
    #     ★임계를 낮추면 얻는 것은 「회수가 빨라지는 것」뿐이고, 잃는 것은 「살아 있는 선점을 뺏지 않는다는
    #      보장」이다. 짧으면 정상 실행 중인 선점이 회수돼 같은 영상이 2벌 돌고(외부 위탁 중복) 먼저 돌던
    #      작업이 나중에 끝나며 상태를 덮어쓴다. 하한 60분은 바닥일 뿐 안전한 값이라는 뜻이 아니다.
    #     ★판정은 서로 다른 노드가 기록한 시각을 비교하므로 노드 간 시계 동기(NTP)를 전제한다. 시계가
    #      어긋나면 임계가 그만큼 밀린다(앞선 노드는 일찍 뺏고, 뒤처진 노드는 늦게 회수한다).
    #     기본값(24시간)은 살아 있는 선점을 뺏지 않는 것이 회수 지연보다 중요하다는 판단에 따라 두 구간을
    #     넉넉히 덮도록 크게 잡았다 — 잘못 회수하면 완주 영상이 실패로 강등돼 사람이 손댄 보간 라벨이
    #     파괴되지만, 늦게 회수해도 결과는 복구가 늦어질 뿐이다(대가: 고착 영상도 최대 24시간은 재기동이
    #     막힌 채 방치된다). 운영에서 설정으로 조정 가능(올리는 방향만 권장).
    #     ★하한 60분이며 그 미만·0·음수·파싱 실패면 기동을 거부한다(fail-closed — 조용한 보정 없음).
    #   ⚠ 남는 위험(인지·수용 — 이 스윕이 만든 결함이 아니라 기존 진입 가드의 한계): 회수 직후 다른 주체가
    #     선점하면 큐에서 뒤늦게 깨어난 옛 작업이 소유권 확인 없이 병행 실행될 수 있고, 판정~조건부 UPDATE
    #     사이의 좁은 창에 갓 접수된 정상 선점을 뺏을 수 있다. 닫으려면 선점 소유권 토큰이라는 별도 설계가
    #     필요하며, 기본 임계가 24시간이라 도달 가능성이 매우 낮아 수용한다.
    #   - batch-size: tick 당 회수 상한(자원 고갈 방지).
    stuck-reclaim:
      enabled: ${BATCH_STUCK_RECLAIM_ENABLED:true}
      interval-ms: ${BATCH_STUCK_RECLAIM_INTERVAL_MS:900000}
      initial-delay-ms: ${BATCH_STUCK_RECLAIM_INITIAL_DELAY_MS:600000}
      stale-timeout-minutes: ${BATCH_STUCK_RECLAIM_TIMEOUT_MINUTES:1440}
      batch-size: ${BATCH_STUCK_RECLAIM_BATCH_SIZE:50}
  ffmpeg:
    threads: ${FFMPEG_THREADS:2}
    binary: ${FFMPEG_BIN:ffmpeg}
    # 프레임 1장 추출 프로세스의 대기 상한(초).
    #   ★ 상한이 없으면 ffmpeg 이 멈췄을 때 호출 스레드가 «영원히» 붙잡힌다. 그 스레드가 포털 프레임
    #     추출이면 「무갱신 경과」 하트비트를 한 번도 못 쳐서, 멈춘 처리와 정상 처리를 구분하지 못한
    #     채 자산이 방치로 판정되고 실패 보존기간 뒤 비가역 삭제된다.
    #   ★ 왜 10분인가 — 프레임 정확 추출(select=eq(n,N))은 입력 seek 없이 파일 처음부터 N번 프레임까지
    #     디코딩하므로 1장의 비용이 프레임 위치에 대략 비례해 커진다. seek 기반 추출(통상 수 초)에는
    #     넉넉하고, 정확 추출의 뒤쪽 프레임에도 대개 충분한 값이다.
    #   ⚠ 올릴 때는 portal.upload.stuck-timeout-minutes 와의 예산 관계를 함께 볼 것 —
    #     「하트비트 간격 + 이 상한 < 고착 커트라인」이 깨지면 정상 추출이 방치로 판정된다
    #     (회귀 고정: PortalFrameExtractHeartbeatTest).
    #   ⚠ 0·음수면 기본값으로 폴백한다(무한 대기로 두지 않는다). 이건 <보호 장치>라 값이 이상하다고
    #     꺼 버리면 막으려던 위험이 그대로 열리기 때문이며, 「이상하면 건너뛴다」는 고착 스윕 규칙과
    #     방향이 반대인 것은 의도다(그쪽은 폴백이 곧 데이터 손실, 이쪽은 폴백이 곧 안전).
    frame-timeout-sec: ${FFMPEG_FRAME_TIMEOUT_SEC:600}
    # ffprobe 바이너리 경로 — 영상 기술메타/duration 추출 전 경로의 단일 진실원 키.
    #   사용처: BrampVideoProbe · PortalVideoProbeFfprobe · DurationProbeFfprobe.
    #   (dev 업로드는 자체 ffprobe 래퍼를 버리고 BrampVideoProbe 를 재사용하므로 이 키를 간접 사용한다 —
    #    영상 길이와 기술메타를 «한 번의 호출» 결과에서 함께 뽑으려면 프로브가 하나여야 한다)
    #   (과거 BrampVideoProbe 만 미정의 키 authoring.ffprobe.binary 를 읽어 FFPROBE_BIN 주입이 누락됐다)
    ffprobe-binary: ${FFPROBE_BIN:ffprobe}
  # Phase 2 — 관제서버 outbound 완료/수정 통지.
  #  - enabled=false 기본 (local/dev). 관제서버 연동 확정 시 환경변수로 true 활성화.
  #  - url: 관제서버 inbound SPI 주소. 평문 커밋 금지 → 환경변수 CONTROL_NOTIFY_URL 사용.
  control-notify:
    enabled: ${CONTROL_NOTIFY_ENABLED:false}
    url: ${CONTROL_NOTIFY_URL:http://localhost:8090}
    # ADR-063 ⑥ — 관제 inbound SPI 인증 토큰(헤더 x-access-token). 관제 계약(API-251/API-285) 요구.
    #   ★ 기본은 발송 시점 동적 발급이다 — 아래 token 이 비어 있으면 ControlNotifyTokenProvider 가 매 통지마다
    #     HS256 서비스 토큰을 새로 발급한다(iss=token-issuer · exp=now+token-ttl-seconds · JWT_SECRET HMAC).
    #   token 은 하위호환 override — 관제팀이 별도 토큰을 주는 경우에만 환경변수 CONTROL_NOTIFY_TOKEN 으로
    #     주입한다(평문 커밋 절대 금지, CWE-798). 그 값이 있으면 발급기 대신 그 값을 그대로 싣는다.
    #   token 도 없고 JWT_SECRET 도 없으면 헤더 미부착 fail-safe(통지는 죽지 않고 폴백 큐가 회수). 로그에 값
    #     출력 금지(CWE-532).
    token: ${CONTROL_NOTIFY_TOKEN:}
    # 동적 발급 서비스 토큰 규칙(발송 시점 발급). 관제 발급 토큰과 형식 정합(HS256).
    #   - token-ttl-seconds: 발급 토큰 수명(초). 발송 즉시 사용이라 짧게 둔다(기본 300, 상한 3600 clamp).
    #   - token-issuer/token-subject: iss/sub 클레임. sub 는 사용자가 아니라 서비스 신원이다(역할 미포함).
    token-ttl-seconds: ${CONTROL_NOTIFY_TOKEN_TTL_SECONDS:300}
    token-issuer: ${CONTROL_NOTIFY_TOKEN_ISSUER:klid-auth}
    token-subject: ${CONTROL_NOTIFY_TOKEN_SUBJECT:klid-authoring-notify}
    timeout-ms: ${CONTROL_NOTIFY_TIMEOUT_MS:10000}
    debounce-window-sec: ${CONTROL_NOTIFY_DEBOUNCE_SEC:60}
    # Phase 9-C — 디바운스 윈도우는 DB(LS_MON_NOTI_ACML)에 영속화되어 2노드가 공유한다.
    #   어느 노드에서 축적됐든 한 노드가 전량을 1회만 flush 하고(원자 클레임), 노드가 flush 전에
    #   죽어도 축적분이 남는다(구 인메모리 윈도우는 이중 통지 + 축적분 유실이었다).
    #   - debounce-lease-sec: flush 클레임 임차(초). 클레임 노드가 이 시간 안에 발송을 못 마치면
    #     (=죽으면) 다른 노드가 재클레임한다. 너무 짧으면 정상 발송 중인 윈도우를 뺏어 이중 통지가
    #     되므로 하한 60초로 clamp 한다(오설정 fail-safe).
    #   - debounce-flush-batch-size: 한 tick 이 처리할 윈도우 상한(무제한 조회 금지).
    debounce-lease-sec: ${CONTROL_NOTIFY_DEBOUNCE_LEASE_SEC:300}
    debounce-flush-batch-size: ${CONTROL_NOTIFY_DEBOUNCE_FLUSH_BATCH_SIZE:100}
    #   - debounce-shutdown-flush-enabled: 컨텍스트 종료(@PreDestroy) 시 남은 윈도우를 만료 대기 없이
    #     drain 할지. **운영 기본 true(현행 동작)** — 노드 종료 시 축적분을 즉시 내보낸다. false 로 두면
    #     축적분은 DB(LS_MON_NOTI_ACML)에 남아 살아 있는 노드/다음 기동이 처리하므로 유실은 아니고,
    #     종료 경로에서 DB 트랜잭션을 열지 않게 된다(테스트 프로파일 전용 — 캐시된 컨텍스트 수십 개가
    #     동시에 닫히며 축소된 커넥션 풀을 기다려 종료가 길어지는 것을 막는다).
    debounce-shutdown-flush-enabled: ${CONTROL_NOTIFY_DEBOUNCE_SHUTDOWN_FLUSH_ENABLED:true}
    # 통지 실패분(dead-letter) 재전송 잡(ControlNotifyFallbackRetryJob) 스케줄 — @Scheduled 고정 지연.
    #   interval-ms 5m 마다 재시도, 부팅 후 initial-delay-ms 1m 뒤 첫 실행.
    retry:
      interval-ms: ${CONTROL_NOTIFY_RETRY_INTERVAL_MS:300000}
      initial-delay-ms: ${CONTROL_NOTIFY_RETRY_INITIAL_DELAY_MS:60000}
  # 해상도 파생영상 생성(리스케일) 동시 실행 게이트(ResizeConcurrencyGate).
  #   - resize-max-concurrent: 동시 리스케일 허용 수(ffmpeg/디스크 자원 보호).
  #   - resize-acquire-timeout-sec: permit 대기 상한(초). 초과 시 즉시 거부(무한 대기 방지).
  resolution:
    resize-max-concurrent: ${RESOLUTION_RESIZE_MAX_CONCURRENT:2}
    resize-acquire-timeout-sec: ${RESOLUTION_RESIZE_ACQUIRE_TIMEOUT_SEC:5}
  # SAM2 분할 요청 시 ai-server 로 보낼 프레임 이미지의 크기 상한(bytes, 기본 20MB).
  #   초과 이미지는 전송 전 거부한다(CWE-770 자원 소진 방어).
  sam2:
    max-image-bytes: ${SAM2_MAX_IMAGE_BYTES:20971520}
  # 관제 인입 픽업 적재 — 관제가 LS_DATA_INGEST 에 INSERT 한 PENDING 행을 주기 스캔해 LS_DATA_RAW 적재.
  #  - enabled=true 기본 (matchIfMissing). 토글 시 Quartz 트리거 미등록.
  #  - interval-sec: 스캔 주기(초). 기본 60.
  #  - not-arrived-timeout-hours: 파일 미도착 대기 경과 상한(시간, RCPTN_DT 기준). 설계 §6-0-1 ①.
  #    미도착은 실패가 아니라 PENDING 복귀지만, 상한이 없으면 스스로 낫지 않는 행(NAS 권한 오류·
  #    깨진 경로)이 FIFO 앞자리를 영구 점유해 그 뒤 정상 인입이 영원히 픽업되지 않는다
  #    (head-of-line blocking). 상한 초과분만 사유와 함께 FAILED 로 내려 큐를 비운다.
  #    ★기본 24시간 — 관제 NAS 파일 복사는 통상 분 단위이고 대용량·야간 지연을 감안해도 수 시간이면
  #      끝난다. 그 최악치의 수 배 여유를 둬 "정상 지연"을 조기 종결하지 않는다. 종결은 가역이므로
  #      (LsDataIngestRepository#requeueFailedForRetry) 상한을 넘겨 내려간 행도 재큐로 복구된다.
  #      하한 1시간으로 clamp 한다(0·음수 오설정이 전량 즉시 종결로 이어지지 않게 — fail-safe).
  control:
    training-scan:
      enabled: ${TRAINING_SCAN_ENABLED:true}
      interval-sec: ${TRAINING_SCAN_INTERVAL_SEC:60}
      not-arrived-timeout-hours: ${TRAINING_SCAN_NOT_ARRIVED_TIMEOUT_HOURS:24}
  # R4 — 만료 작업락(LS_AUTH_WORK_LOCK) sweeper.
  #  - enabled: 운영(dev/stg/prd) 기본 true. local/test 는 override false (스케줄러 발화 억제).
  #  - interval-ms: sweep 주기(ms). 기본 10분. 만료(lockRaw=1h/redeident=6h) 대비 충분히 촘촘.
  #  - 2노드 Active-Active 에서 양 노드 발화해도 건별 조건부·멱등 release 라 안전.
  work-lock:
    sweep:
      enabled: ${WORK_LOCK_SWEEP_ENABLED:true}
      interval-ms: ${WORK_LOCK_SWEEP_INTERVAL_MS:600000}
      initial-delay-ms: ${WORK_LOCK_SWEEP_INITIAL_DELAY_MS:60000}
  # 외부 산출물 이관 — 검사(미리보기) 단계 자원 상한.
  #   scan.max-entries: 산출물 폴더 <바로 아래> 항목을 몇 개까지 훑을지. 경로는 사람이 넣는 값이라
  #     파일이 수십만 개인 디렉터리를 가리킬 수 있다(CWE-770). 상한을 넘으면 조용히 자르지 않고 읽기를
  #     그만두고 그 사실을 경고(SCAN_LIMIT_EXCEEDED)로 알린 뒤 적재를 막는다 — 잘라 담으면 "덜 들어온 것"과
  #     "원래 그만큼인 것"이 구분되지 않는다. 깊이 상한은 두지 않는다(파서가 하위 폴더로 내려가지 않는다).
  #   ★ 설계에 근거 값이 없어 설정으로 뽑아 둔 값이다 — 산출물 규모가 커지면 재배포 없이 올린다.
  #   browse.*: 위치를 골라 넣기 위한 <탐색>. 검사와 축이 다르다 — 검사는 상한을 넘으면 읽기를 그만두고
  #     적재를 막지만, 탐색은 <잘라 버리지 않고 나눠서 이어 준다>. 한 번에 정해진 만큼만 담고 이어받을
  #     자리(nextCursor)를 함께 돌려주므로, 이어받기를 되풀이하면 그 자리의 항목에 모두 도달한다.
  #     ⚠ 두 값의 축이 다르다 — 하나로 합치지 말 것.
  #     browse.page-size: 한 번에 <담는> 수. 응답 폭주를 막는다.
  #     browse.scan-limit: 한 번에 <살펴보는> 수. ★이것이 없으면 페이징을 둔 취지가 사라진다 — 담는
  #       것은 종류가 들어맞는 것뿐이라, 들어맞지 않는 항목이 이어지면 담을 것을 채우지 못한 채 계속
  #       종류를 확인하게 된다(영상 몇 개가 이미지 수천 장 사이에 놓인 자리가 이 도메인의 정상 형상이라
  #       그때 저장 장치 부하가 한 요청에 통째로 몰린다 — CWE-770). 이쪽에 먼저 걸리면 담은 것이
  #       page-size 보다 적거나 <하나도 없을> 수 있고, 그때도 이어받을 자리는 돌아간다. 끝났는지는
  #       담은 개수가 아니라 이어받을 자리가 비었는지로 판정한다.
  #     ⚠ scan.max-entries(적재 훑기 상한)와는 <별개 축>이다.
  import:
    scan:
      max-entries: ${IMPORT_SCAN_MAX_ENTRIES:20000}
    browse:
      page-size: ${IMPORT_BROWSE_PAGE_SIZE:200}
      scan-limit: ${IMPORT_BROWSE_SCAN_LIMIT:2000}
    # 마킹 산출물 일괄 가져오기(ADR-053) — 위 scan/browse 와는 <별개 갈래>다.
    #   그쪽은 라벨링이 끝난 결과를 폴더 하나 단위로 받고, 이쪽은 폴더 안의 N 쌍을 재귀로 훑어
    #   비동기로 건별 적재한다. 값을 공유하지 않는다.
    marking:
      max-depth: ${IMPORT_MARKING_MAX_DEPTH:8}          # 훑을 폴더 깊이 상한(시작 폴더가 0)
      max-entries: ${IMPORT_MARKING_MAX_ENTRIES:20000}  # 훑을 파일 수 상한 (CWE-770)
      max-items: ${IMPORT_MARKING_MAX_ITEMS:2000}       # 한 번에 다룰 마킹 문서 수 상한
      max-unmatched-names: ${IMPORT_MARKING_MAX_UNMATCHED_NAMES:100}
      max-progress-items: ${IMPORT_MARKING_MAX_PROGRESS_ITEMS:500}
      video-extensions: ${IMPORT_MARKING_VIDEO_EXT:mp4,mov,avi,mkv,m4v,wmv}
      concurrency: ${IMPORT_MARKING_CONCURRENCY:2}      # 한 노드가 동시에 처리할 항목 수 상한
      max-retry: ${IMPORT_MARKING_MAX_RETRY:3}          # 같은 항목을 다시 집을 수 있는 횟수
      # 역산 프레임 재생 속도와 실측값의 허용 오차. 넘으면 그 항목의 마킹을 적용하지 않고 멈춘다.
      #   ⚠ 0 으로 내리지 말 것 — 역산은 나눗셈이라 실측값과 정확히 같을 수 없어 전건 실패한다.
      fps-tolerance: ${IMPORT_MARKING_FPS_TOLERANCE:0.5}
      # 처리 중인 채로 이만큼 갱신이 멈춘 항목을 다시 집을 수 있게 되돌린다.
      #   ⚠ 짧게 잡으면 <지금 돌고 있는 처리>를 빼앗는다. 코드가 5분 하한으로 보정한다.
      stale-timeout-minutes: ${IMPORT_MARKING_STALE_TIMEOUT_MINUTES:30}
      recovery:
        # 멈춘 작업 회수 잡. 잡 빈과 @EnableScheduling 이 <같은 키>를 본다(한쪽만 걸면
        # 남의 기능이 켜 둔 스케줄링 위에서 이 잡이 자기 토글과 무관하게 돈다).
        enabled: ${IMPORT_MARKING_RECOVERY_ENABLED:true}
        # 아래 둘은 @Scheduled 속성이라 상수 표현식만 허용돼 설정 record 로 옮기지 못한다.
        interval-ms: ${IMPORT_MARKING_RECOVERY_INTERVAL_MS:120000}
        initial-delay-ms: ${IMPORT_MARKING_RECOVERY_INITIAL_DELAY_MS:60000}
  # HIGH-5 fix (OWASP A06): CORS allowlist — 환경별로 명시 필수.
  # 기본값 빈 문자열 → 외부 origin 전부 차단 (same-origin only).
  # 운영(dev/stg/prd): 환경변수 CORS_ALLOWED_ORIGINS=https://fe.example.com,...
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # dev 로그인(/v1/dev/tokens)·수동 업로드(/v1/dev/upload) 토글.
  #   ★ 두 토글의 성격이 다르다 — 한 문장으로 묶어 읽지 말 것(2026-08-24 CO-008).
  #   - 공통: 값 미지정 시 빈 부재로 endpoint 미노출(fail-closed). @ConditionalOnProperty 게이팅이며
  #     SecurityConfig 도 authoring.dev.login.enabled 를 읽어 permitAll 매처를 조건부 추가한다.
  #   - dev 로그인: **bring-up 전용**이다. 기본 false 이고 운영에서 켜면 안 된다 —
  #     DevToggleProfileGuard 가 prd·stg 에서 이 토글이 켜져 있으면 부팅을 거부한다(인증 우회 표면).
  #     관제서버 미기동 폐쇄망 bring-up 시에만 DEV_LOGIN_ENABLED=true 로 켠다.
  #   - 수동 업로드: **운영 상시 기능**이다. 아래 폴백(false)만 fail-closed 이고,
  #     **local·dev·stg·prd 네 프로파일이 모두 각자 yml 에서 true 로 override 한다** —
  #     즉 실제 배포 형상에서는 어디서나 켜져 있다. 끄려면 DEV_UPLOAD_ENABLED=false 를 명시한다.
  #     부팅 가드 대상이 아니다(그건 dev 로그인 축만).
  #     ⚠ 구 기재 폐기: "기본 false … bring-up 시에만 켠다 … local/dev/stg 는 각 프로파일 yml 에서 true override"
  #       — 셋 다 업로드 축에서는 무효다(운영도 override 한다).
  #   - 어느 쪽이든 켜지면 기동 시 DevToggleStartupWarner 가 WARN 을 남긴다(꼬리 지시문은 토글별로 갈린다).
  dev:
    login:
      enabled: ${DEV_LOGIN_ENABLED:false}
    upload:
      enabled: ${DEV_UPLOAD_ENABLED:false}
      # 즉시 실행 업로드가 올린 파일에서 영상 기술메타(LS_DATA_META 의 video.*)를 읽어 적재할지.
      #   - 기본 true — 누락된 동작을 메우는 것이라 끄는 쪽이 예외다(ffprobe 는 영상 길이 추출로
      #     이미 매 업로드마다 1회 호출되므로 추가 전제가 없다 — 그 한 결과를 함께 쓴다).
      #   - false 로 끄면 기동 로그(INFO)에 그 사실이 남는다(운영자 추적용).
      #   - 사용자 «입력» 기술메타는 이 토글과 무관하게 이 경로에서 전송되지 않는다(요청 계약 6필드).
      extract-technical-meta: ${DEV_UPLOAD_EXTRACT_TECHNICAL_META:true}

# Phase 11 — 포털 채널 TUS 업로드 정책
# + 포털 전용 이미지/영상 업로드 정책 (PortalUploadProperties 바인딩)
portal:
  upload:
    max-file-size-bytes: ${PORTAL_MAX_FILE_SIZE:5368709120}        # 5 GB (영상)
    allowed-extensions: ${PORTAL_ALLOWED_EXT:mp4,mov,avi}          # 영상 확장자 allowlist
    storage-path: ${PORTAL_STORAGE_PATH:${authoring.storage.raw-path:./storage/raw}/portal}
    allowed-image-extensions: ${PORTAL_ALLOWED_IMAGE_EXT:jpg,jpeg,png}  # 이미지 확장자 allowlist
    max-image-size-bytes: ${PORTAL_MAX_IMAGE_SIZE:20971520}        # 20 MB (이미지 1장)
    max-images-per-request: ${PORTAL_MAX_IMAGES_PER_REQUEST:50}    # 1회 요청 최대 이미지 수
    max-frames: ${PORTAL_MAX_FRAMES:2000}                          # 영상 1건 최대 추출 프레임 수
    # D2 — 아래 4개는 흩어진 @Value 를 PortalUploadProperties(record) 로 통합하면서 명시했다.
    #   값은 이관 전 @Value 기본값 그대로다(동작 변경 0).
    max-chunk-bytes: ${PORTAL_MAX_CHUNK_BYTES:16777216}            # 16 MB — TUS PATCH 단일 청크 상한
    max-label-body-bytes: ${PORTAL_MAX_LABEL_BODY_BYTES:2097152}   # 2 MB — 라벨 PUT 본문 상한(파싱 전 413)
    probe-timeout-sec: ${PORTAL_PROBE_TIMEOUT_SEC:30}              # ffprobe 하드 타임아웃(초)
    # 무갱신 N분 초과 업로드(UPLOADED/PROCESSING) → FAILED 마감.
    #   ★ 판정 축은 「총 처리 시간」이 아니라 「MDFCN_DT 무갱신 경과」다 — 프레임 추출 러너가
    #     하트비트로 그 값을 밀어내므로 대용량 영상 추출이 몇 시간 걸려도 방치로 판정되지 않는다.
    #   ★ 단 그 전제는 <하트비트 간격에 상한이 있을 때만> 성립한다. 두 축이 그 상한을 만든다 —
    #     ① 러너 하트비트가 «경과 시간» 기준이고 그 간격은 이 값에서 파생된다(이 값의 1/4, 5~60초)
    #     ② 프레임 1장 추출 프로세스에 대기 상한이 있다(authoring.ffmpeg.frame-timeout-sec).
    #     성립해야 하는 관계: 「하트비트 간격 + 프레임 대기 상한 < 이 값」.
    #     이 값을 줄일 때는 반드시 그 관계를 다시 볼 것 — 깨지면 «정상 추출이 방치로 판정»되고
    #     그 자산은 failed-retention-days 뒤 파일·행이 비가역 삭제된다.
    #   ★ 0·음수면 <그 회차를 건너뛰고 경고>한다(기본값 폴백 없음). 이 전이는 삭제의 예고이고,
    #     0 을 그대로 적용하면 정상 처리 중인 자산을 즉시 죽이기 때문이다.
    #   ★ 숫자가 아니거나 빈 값이면 이 잡이 아니라 <설정 바인딩>이 먼저 막아 «기동이 실패»한다
    #     (PortalUploadProperties 의 long 성분). 오타 하나가 삭제 기준을 조용히 바꾸는 것보다 낫다.
    stuck-timeout-minutes: ${PORTAL_STUCK_TIMEOUT_MINUTES:30}
    # 정리 스윕 잡(PortalUploadSweepJob) 스케줄 — 만료 TUS 세션 삭제 + 고착 자산 FAILED 전이.
    #   @Scheduled 어노테이션 속성은 상수 표현식만 허용해 record 로 옮길 수 없으므로 placeholder 유지.
    sweep:
      # ★ 자기 전용 스케줄링 토글. 이 잡은 자기 @EnableScheduling 없이 남의 기능(관제 통지·작업락
      #   스윕)이 켜 둔 스케줄링에 얹혀 돌고 있었고, 그래서 무관한 기능을 끄면 정리가 <소리 없이>
      #   멈췄다. 이제 PortalUploadSweepSchedulingConfig 가 이 키로 @EnableScheduling 을 켜고
      #   같은 키가 잡 빈 등록도 게이팅한다(WorkLockSweepConfig 관례).
      enabled: ${PORTAL_SWEEP_ENABLED:true}
      interval-ms: ${PORTAL_SWEEP_INTERVAL_MS:1800000}             # 30 m 주기
      initial-delay-ms: ${PORTAL_SWEEP_INITIAL_DELAY_MS:600000}    # 부팅 후 10 m 뒤 첫 실행
  # 보존기간 만료 자동 삭제 잡(PortalRetentionSweepJob) 스케줄 — 데이터마트 라벨 + 업로드 자산 2축.
  #   ★ 보존일수(portal.datamart.retention-days 등)는 여기가 아니라 LS_SYSTEM_CONFIG 가 소유한다
  #     (REVIEWER 가 화면에서 조정). 여기 있는 것은 <스윕 주기>뿐이며, 주기를 바꿔도 보존기간은
  #     달라지지 않는다 — 삭제 시점 판정은 언제나 커트라인이 한다.
  #   보존기간은 일 단위라 1 h 주기로 충분하다. 기동 직후 마이그레이션·캐시 준비와 겹치지 않게
  #   초기 지연을 형제 스윕보다 길게 둔다.
  retention:
    sweep:
      # ★ 자기 전용 스케줄링 토글 — 업로드 스윕(portal.upload.sweep.enabled)과 <별개 키>다.
      #   이 잡은 사용자 데이터를 비가역으로 지우므로 정리 성격의 형제 잡과 한 스위치에 묶지 않는다
      #   (한쪽을 끄려다 다른 쪽까지 끄면 그 잘못이 어느 방향으로든 조용하다).
      #   과거엔 자기 @EnableScheduling 이 없어 관제 통지 등 <무관한 기능>을 끄면 보존기간 삭제가
      #   소리 없이 멈췄다 — 회귀 고정은 PortalSweepSchedulingIT.
      enabled: ${PORTAL_RETENTION_SWEEP_ENABLED:true}
      interval-ms: ${PORTAL_RETENTION_SWEEP_INTERVAL_MS:3600000}          # 1 h 주기
      initial-delay-ms: ${PORTAL_RETENTION_SWEEP_INITIAL_DELAY_MS:900000} # 부팅 후 15 m 뒤 첫 실행

# UC018 — ㈜KPST 비식별 솔루션 폴링 연동 클라이언트 (docs/v2-wiki/22-deid-solution-api.md).
#  - enabled=true 기본 (비식별 단일 경로 = KPST 폴링. 레거시 동기 SPI/콜백 경로는 제거됨).
#    킬스위치로 필드는 유지. ★자체 채움(mock) 비식별 경로는 폐지됐다(2026-08-19) — local 도 목 서버로 실 위탁한다.
#    KPST_DEID_ENABLED=false 로 내리면 위탁이 비활성화되며, mock 도 아니면 DeidentifyStep 이 설정 오류로 거부한다.
#  - base-url: KPST 테스트/운영 서버 주소(http/https 자동 분기 — 내부망은 http, 외부는 https+사설CA). 평문 커밋 금지 → 환경변수 사용.
#  - ca-cert-path: KPST 자체 CA(ca.crt) 경로. ★https 일 때만 필수다(스키마로 조건부 강제) — https 인데
#    미설정이면 <위탁 거부> fail-closed(CWE-295: 검증할 수 없으면 보내지 않는다). http 배포는 비워 둔다.
#    ⚠ 구 서술 폐기(2026-09-03) — "기동 실패". 연동 주소·TLS 자료로는 기동을 막지 않는다.
#  - creator-id / req-user-id: /project, /retrieve_progress 호출 시 기본값.
kpst:
  deid:
    enabled: ${KPST_DEID_ENABLED:true}
    # 전송은 base-url 스키마로 자동 분기한다 — 내부망 http://IP:port(평문, 격리 전제) 또는 https+사설CA 둘 다 지원.
    # ★ 이 기본값(https+loopback)을 그대로 상속하면 <기동은 정상>이고 비식별 위탁만 거부된다
    #   (자체 CA 미설정 + 운영에서는 루프백이 목/시뮬레이터로 판정). 구 동작은 기동 차단이었다.
    base-url: ${KPST_DEID_BASE_URL:https://localhost:9201}
    # ca-cert 는 https 일 때만 필요하다(KpstWebClientConfig 가 스키마로 조건부 강제). https 인데 비었거나 못
    #   읽으면 <비식별 위탁이 거부>된다(CWE-295 — 기동은 정상이다). http 배포는 선택값(빈 기본)으로 둔다.
    ca-cert-path: ${KPST_DEID_CA_CERT_PATH:}
    creator-id: ${KPST_DEID_CREATOR_ID:authoring}
    req-user-id: ${KPST_DEID_REQ_USER_ID:authoring}
    # UC018 — 완료감지 폴링 잡 (enabled=true 일 때만 트리거 등록).
    poll-interval-sec: ${KPST_DEID_POLL_INTERVAL_SEC:30}        # 폴링 주기(초)
    # B-ISSUE-82 — 틱당 폴링 대상 상한(무제한 조회 금지). 폴링 1건 = 외부 HTTP 호출이라 상한이 필요하다.
    #   대상 선점은 리스 기반 원자 클레임(POLL_LAST_DT 조건부 UPDATE)이라 2노드 동시 발화에도 중복되지 않으며,
    #   리스 길이는 poll-interval-sec 에서 파생한다(주기보다 짧게 — 단일 노드 매 틱 폴링 유지).
    poll-batch-size: ${KPST_DEID_POLL_BATCH_SIZE:200}           # 틱당 폴링 대상 상한
    poll-max-attempts: ${KPST_DEID_POLL_MAX_ATTEMPTS:240}       # 시도 횟수 타임아웃(무한 폴링 방지)
    poll-timeout-minutes: ${KPST_DEID_POLL_TIMEOUT_MINUTES:180} # 위탁 후 경과 시간 타임아웃(분)
    # B-ISSUE-01 — 위탁 전 원본 영상 실재 검증(fail-closed). 기본 켬.
    #   원본이 없는데 위탁하면 KPST 가 결과를 만들지 못한 채 완료로 응답해 거짓 'Y'/MARKING_READY 가 된다.
    #   공유 마운트가 앱에서 보이지 않는 배포에서만 false 로 내린다(끈 상태의 위탁은 매 건 WARN 을 남긴다).
    verify-source-exists: ${KPST_DEID_VERIFY_SOURCE_EXISTS:true}
    # B-ISSUE-01 — 산출물 무결성 실패 시 1회 재확인 유예(ms, 0=즉시 판정). "쓰기 중"/가시성 지연과
    #   "진짜 불완전"을 구분하기 위한 창. 무결성 실패는 terminal 'F' 라 자동 재시도가 없다.
    result-recheck-delay-ms: ${KPST_DEID_RESULT_RECHECK_DELAY_MS:2000}

resilience4j:
  circuitbreaker:
    configs:
      # ai-server 추론 호출 공통값 — 용도별(그리고 나중에 노드별) 인스턴스가 이 값을 물려받는다.
      # 인스턴스가 늘어날 때 값을 복제하지 않기 위한 자리다.
      aiShared:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        # ★ 결정적 실패는 서킷 failure 로 집계하지 않는다 — 시계열 축(vlmClient)과 같은 기준이다.
        #   여기 해당하는 것은 ①쓸 수 있는 장비 후보 0 거부 ②고른 주소로 목적지를 만들 수 없음 둘이며,
        #   <둘 다 ai-server 가 아니라 우리 원장의 상태>다. 집계하면 원장을 고친 뒤에도 서킷이 열려
        #   있어 멀쩡한 추론이 wait-duration 만큼 계속 막히고, 서킷이 "추론 서버가 나쁘다"는 거짓 신호를
        #   낸다(그 사이 정상 호출이 서킷 오픈으로 확정 실패한다).
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
    instances:
      deid:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
      # ai-server 추론 — 용도별로 가른다(ADR-056). 구 형상은 인스턴스 하나를 다섯 호출이 공유해서,
      # 배치가 연달아 실패해 서킷이 열리면 화면 요청까지 함께 막혔다. 그 차단은 호출하는 쪽에서
      # 일어나므로 ai-server 안에서 실행 슬롯을 나눠도 막히지 않는다 — 슬롯 분리와 짝이다.
      # ⚠ 이름은 AiWorkload.circuitName() 이 만든다. 여기 값을 고칠 때 그 열거형과 어긋나면
      #   설정이 안 붙은 채 기본값으로 조용히 동작한다(오류가 나지 않는다).
      ai-batch:
        base-config: aiShared
      ai-interactive:
        base-config: aiShared
      # 객체 검증 경로 전용 — 용도 축 밖이다. 추론 모델을 올리지 않아 가속기 부하가 없고,
      # 배치·화면 어느 쪽에 묶어도 그쪽 실패율에 잡음만 넣는다.
      ai:
        base-config: aiShared
      # Phase 1 — 외부 VLM 시계열 위탁 클라이언트
      vlmClient:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        # V1: 4xx(400/415 등) 결정적 실패는 서킷 failure 로 집계하지 않는다(정상 4xx 가 서킷을 여는 것 방지).
        # ★ 429(동시 처리 한도 초과)도 제외한다 — 서킷이 열리면 그 구간의 정상 위탁이 확정 실패로
        #   종결되고 마킹이 종결 상태로 굳는다. 과부하 완충은 서킷이 아니라 재시도 백오프가 맡는다.
        #   (429 는 retry 의 ignore 목록에는 <넣지 않아> 재시도 대상으로 남는다 — 아래 retry 블록 참조.)
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
          - kr.co.cudo.authoring.common.client.RateLimitedExternalException
      # Phase 2 — 관제서버 outbound 통지
      controlNotify:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        # N-5: 4xx(409 중복 / 404 미존재 / 422)는 결정적 응답이라 서킷 failure 로 집계하지 않는다.
        #   정상 흐름인 409(재승인) 가 서킷을 여는 것을 막는다. 예외는 그대로 전파되어
        #   ControlNotifyService 의 자기치유 분기(409→updated / 404→completed)를 발동시킨다.
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
      # Phase 1 — KPST 비식별 폴링 클라이언트 (kpst.deid.enabled=true 일 때만 호출 발생)
      kpstDeid:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        # K3: 4xx(400/403/404/409) 결정적 실패는 서킷 failure 로 집계하지 않는다(정상 409 중복이 서킷을 여는 것 방지).
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
      # Phase 7-A1 — 외부 증강(생성형 AI) 위탁 클라이언트 (mode=http 일 때만 호출 발생)
      augmentClient:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        # 4xx(400 형식/경로 오류, 413 등)는 결정적 실패라 서킷 failure 로 집계하지 않는다.
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
      # Phase 7-A2 — 외부 증강 상태/결과/취소 조회 (INT-020/030/031).
      #   ★ 위탁(augmentClient)과 <반드시 별도 인스턴스>다. 조회는 화면 폴링으로 호출량이 곱해지므로
      #   벤더 지연·5xx 를 가장 먼저·가장 많이 맞는다. 인스턴스를 공유하면 그 실패가 서킷을 열어
      #   <신규 증강 위탁(POST /jobs)까지> 차단된다 — 조회 장애가 위탁을 막는 것은 장애 전파다.
      #   호출량이 위탁보다 많으므로 표본(window/minimum)도 크게 잡아 단발 실패에 덜 예민하게 한다.
      augmentQuery:
        failure-rate-threshold: 50
        sliding-window-size: 20
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 30s
        # 404(JOB_NOT_FOUND) / 409(STATE_CONFLICT) 는 정상 흐름의 결정적 응답이다.
        #   집계하면 "조회 시도 = 서킷 오픈" 이 되어 조회 전체가 죽는다.
        #   디코딩 실패(깨진 본문·크기 초과·비-JSON)도 같은 예외로 분류되어 여기서 제외된다 —
        #   재요청해도 결과가 같은 결정적 실패이기 때문(DEV_FIX MED-1a).
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
      # Phase 7-A2 / DEV_FIX MED-1b — 취소(INT-031) 전용. 폴링(augmentQuery)과도 <별도 인스턴스>다.
      #   취소는 사용자가 직접 누르는 능동 행위이고 폴링은 배경 자동 호출이다. 공유하면 "상태조회
      #   응답만 깨뜨리는 벤더" 가 서킷을 열어 사용자 취소를 30초 단위로 반복 차단한다.
      #   호출량이 낮으므로 표본(window/minimum)은 위탁과 같은 수준으로 작게 잡는다.
      augmentCancel:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
  retry:
    instances:
      deid:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
      ai:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        # ★ 「쓸 수 있는 장비 후보가 0」 거부(AiSrvrSelector)는 재시도 대상이 아니다 — ADR-057/AC-1093.
        #   그 거부는 목적지를 <고르는 자리>에서 나고 Mono.defer 안이라 이 연산자가 그것을 재시도한다.
        #   결과: 거부 한 건이 원장 조회 3회 + 지수 백오프만큼의 지연 뒤에야 화면으로 돌아갔다.
        #   같은 예외의 정의가 「이 요청만으로는 풀리지 않는 결정적 실패」이고, 시계열 축(vlmClient)은
        #   이미 같은 이유로 이 예외를 제외하고 있다 — 두 축을 대칭으로 맞춘다.
        #   ⚠ 「목적지를 만들 수 없다」(PinnedTarget 실패)도 같은 예외형이며 역시 결정적이다.
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
      vlmClient:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        # V1: 4xx(400/415 등) 비-일시적 오류는 재시도하지 않는다(불필요한 지수 백오프 지연 제거).
        # ★ 단 429(동시 처리 한도 초과)는 <재시도한다> — 규격 §2.9 가 "잠시 후 재시도"로 규정한 일시
        #   상태이며 전용 예외(RateLimitedExternalException)라 이 ignore 목록에 들어가지 않는다.
        #   즉 재시도 대상 = 5xx · 네트워크 · 429.
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
      controlNotify:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        # N-5: 4xx(409/404/422)는 재전송해도 결과가 같은 결정적 실패라 재시도하지 않는다.
        #   재시도하면 자기치유가 늦어지고 폴백 큐가 DEAD_LETTER 로 오염된다.
        #   ★ ignore-exceptions 는 "재시도 억제" 일 뿐 "예외 삼킴" 이 아니다 —
        #     예외는 catch 까지 전파되어야 409/404 분기가 동작한다(ControlNotifyClientTest 로 단언).
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
      kpstDeid:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        # K3: 4xx(409 중복/400/404) 결정적 실패는 재시도하지 않는다(즉시 CONFLICT/INVALID_INPUT/NOT_FOUND 반환). 5xx·네트워크만 재시도.
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
      # Phase 7-A1 — 외부 증강 위탁. 4xx 는 재시도하지 않는다(요청이 이미 외부에 도달했을 수 있는
      #   결정적 오류를 재시도하면 중복 위탁 위험). 연결 실패·타임아웃·5xx 만 재시도한다.
      #   재시도가 안전한 근거: 동일 request_id 를 Idempotency-Key 로 보내므로 외부가 기존 job 을 반환한다.
      augmentClient:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
      # Phase 7-A2 — 조회/취소 3종 전용(위탁과 분리).
      #   max-attempts 를 2 로 낮춘 이유: 조회는 <다음 폴링 주기가 곧 재시도>다. 여기서 3회 백오프까지
      #   돌리면 이미 힘든 벤더에 부하를 곱하고, 화면 응답만 늦어진다(취소도 사용자가 다시 누르면 된다).
      #   4xx(404/409)는 아래 ignore 로 애초에 재시도 대상이 아니다.
      augmentQuery:
        max-attempts: 2
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
      # DEV_FIX MED-1b — 취소 전용. 사용자가 기다리는 요청이라 백오프를 길게 물리지 않는다(2회).
      augmentCancel:
        max-attempts: 2
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - kr.co.cudo.authoring.common.client.NonRetryableExternalException
  timelimiter:
    instances:
      deid:    { timeout-duration: 60s }
      ai:      { timeout-duration: 60s }
      # kpstDeid TimeLimiter 미사용 — WebClient `.timeout(...)` 으로 Reactor 네이티브 처리.
      # (업로드/다운로드 10m, 그 외 45s 단일 출처: KpstDeidentifyClient 상수)
      # vlmClient TimeLimiter 미사용 — WebClient `.timeout(...)` 으로 Reactor 네이티브 처리.
      # 타임아웃 단일 출처: vlm.client.timeout-seconds (아래)
  bulkhead:
    instances:
      # Phase 3 — YOLO 오토라벨 온라인(수동 트리거) 경로 전용 동시 호출 제한 (F-2).
      #  - 배치 YOLO 경로와 격리(온라인 트리거만 제한). 초과 시 BulkheadFullException → 429.
      #  - max-wait-duration=0: 대기 없이 즉시 거부(fail-fast) — Tomcat 스레드 점유 최소화.
      aiOnline:
        max-concurrent-calls: 4
        max-wait-duration: 0
  ratelimiter:
    configs:
      # V107 이슈8 (CWE-770) — 포털 이미지 업로드 사용자별(portalUserNo) 요청량 제한 config.
      #  - per-user 이름(portalUpload-{userNo})으로 이 config 를 공유하는 RateLimiter 를 lazy 생성.
      #  - limit-refresh-period(1m) 당 limit-for-period(60) 회 허용. 초과 시 429 (즉시 거부).
      #    업로드는 다건 배치라 여유를 둔다. timeout-duration=0: 대기 없이 즉시 거부.
      portalUpload:
        limit-for-period: 60
        limit-refresh-period: 1m
        timeout-duration: 0
      # (CWE-770) — 포털 사용자 라벨 저장(POST /v1/portal/user-labels) 사용자별 요청량 제한 config.
      #  - per-user 이름(portalUserLabel-{userNo})으로 이 config 를 공유하는 RateLimiter 를 lazy 생성.
      #  - 라벨 행은 삭제 API 가 없어 누적되므로 유입 속도 제한이 유일한 자원 방어선이다.
      #  - 한도 근거: FE 는 화면의 라벨 N 건을 <b>1건씩 순차 POST</b> 한다(단건 계약). 프레임당 라벨
      #    수백 건 + 재저장을 고려해 업로드(60/분)보다 넉넉한 300/분으로 잡되 무제한은 막는다.
      #    timeout-duration=0: 대기 없이 즉시 429.
      portalUserLabel:
        limit-for-period: 300
        limit-refresh-period: 1m
        timeout-duration: 0
      # API-203 (CWE-770) — 포털 데이터마트 작업 데이터 ZIP 다운로드 사용자별 요청량 제한 config.
      #  - per-user 이름(portalDatamartDownload-{userNo})으로 이 config 를 공유하는 RateLimiter 를 lazy 생성.
      #  - 한도 근거: 산출물에 비식별 영상이 포함되면 한 요청의 입출력 부담이 크므로 연타를 막는다
      #    (사용자 확정 — 분당 3회). timeout-duration=0: 대기 없이 즉시 429.
      #  - ⚠ 형제 제한기와 동일하게 <노드별 in-memory> 라 2노드에서는 실질 한도가 2배다.
      #    이는 인지·수용된 성질이며 이를 이유로 분산 제한기를 도입하지 않는다.
      portalDatamartDownload:
        limit-for-period: 3
        limit-refresh-period: 1m
        timeout-duration: 0

# Phase 1 — 외부 VLM 시계열 메타 분석 서비스 위탁 클라이언트.
#  - ★ 활성/비활성 토글은 폐지됐다(ADR-049). 껐다 켜는 손잡이를 되살리지 말 것 —
#    기본값이 비활성이라 <시계열이 꺼진 채 납품돼도 그 사실이 산출물에도 이력에도 남지 않았다>.
#  - 미연동 판정은 <url 주입 여부>가 한다. 비어 있으면 URL 검증을 생략하고 기동은 성공하되
#    위탁은 조용히 건너뛰지 않고 <실패>한다. 벤더 미연동 구간은 REVIEWER 가 사유를 남기고 누르는
#    단계 스킵으로 운영한다(누가 언제 왜 건너뛰었는지가 처리 이력에 남는다).
#    ⚠ 스킵 없이 그대로 돌리면 마킹이 위탁 실패로 <종결>되어 이후 재수행해도 표시가 되돌아오지 않는다
#      — 미연동 구간에는 반드시 먼저 스킵할 것.
#  - url/token 은 평문 커밋 금지. 환경변수 ${VLM_SERVICE_URL}, ${VLM_SERVICE_TOKEN} 만 허용.
vlm:
  client:
    url: ${VLM_SERVICE_URL:}
    # ★ 이 값은 <X-API-Key> 헤더로 실린다 (연동 규격 v1.2.0 §2.1). `Bearer ` 접두를 붙이지 않는다.
    #    구 배선 `Authorization: Bearer <token>` 은 규격 근거가 없던 것이다 — 이전 판에는 인증 절
    #    자체가 없었다. 되살리지 말 것.
    #  - 값이 비면 헤더를 아예 붙이지 않는다(키를 쓰지 않는 환경). 지금 동작은 그대로다.
    #  - ⚠ 키 사용 여부와 값은 규격 밖에서 별도로 전달되며 아직 수신 전이다. 지어내 채우지 말 것.
    #  - ⚠ 키가 필요한데 없으면 벤더가 401 로 거부하고 <콜백을 보내지 않는다> — 위탁이 아무 신호
    #    없이 사라지고 미결 회수가 재위탁해도 같은 401 이라 회복되지 않는다.
    #  - 설정 키 이름(VLM_SERVICE_TOKEN)은 그대로 둔다 — 값의 의미가 같고, 개명하면 반입 설정
    #    템플릿과 매체 문서까지 함께 움직여야 한다.
    token: ${VLM_SERVICE_TOKEN:}
    #  - url 검증은 <스킴(http/https) + 형식>만 본다 — 대역 차단·HTTPS 강제는 2026-08-10 확정으로
    #    폐기됐다(연동 대상이 내부망 별도 장비일 수 있고, 아웃바운드 통제는 인프라 계층의 몫).
    #    placeholder 호스트·비허용 스키마·클라우드 메타데이터 대역 차단은 전 프로파일에서 유지된다.
    #    ★ 구 완화 플래그 allow-insecure-url(VLM_ALLOW_INSECURE_URL)은 켜든 끄든 결과가 같아져
    #      <죽은 설정>이 되었으므로 제거했다. 되살리지 말 것.
    #    ★ 위 「차단」은 전부 <위탁 시점> 거부다 — 어떤 주소값도 기동을 막지 않는다
    #      (2026-09-03 · ADR-062). 구 서술 「평문 http 주소를 넣는 순간 기동이 막힌다」는 폐기.
    timeout-seconds: 10
    # --- 장비 상태점검 임계 — <시계열 계통 전용> (ADR-057 · AC-1099) ---------------------------
    # ★ 계통마다 <자기 자리와 자기 기본값>을 갖는다. 추론 계통의 값은
    #   authoring.integration.ai-server.{fail,recover}-threshold 이며 <서로를 물려받지 않는다>.
    #   공통값을 두고 물려받게 하면 그 값을 바꾸는 순간 두 계통이 함께 움직여, 계통을 가른
    #   이 조항이 이름만 남는다.
    #  - 근거: 추론은 <우리가 배포한 서버>이고 시계열은 <외부 벤더의 서비스>라 응답 특성도,
    #    우리가 손댈 수 있는 범위도 같지 않다. 하나로 공유하면 한쪽을 조이려다 다른 쪽까지 움직인다.
    #  - 초기 기본값 3은 추론이 쓰던 값을 그대로 옮긴 것이다(새 숫자를 지어내지 않았다).
    #    두 계통의 기본값이 같은 값이어도 무방하다 — 요구되는 것은 자리가 갈려 있다는 것이다.
    #  - 0 이하를 넣으면 <점검 한 번 만에> 장비가 내려가거나 올라간다. 오설정은 하한 1로 흡수한다.
    fail-threshold: ${VLM_HEALTH_FAIL_THRESHOLD:3}
    recover-threshold: ${VLM_HEALTH_RECOVER_THRESHOLD:3}
    # --- 장비 상태점검 주기 — <시계열 계통 전용> (ADR-057 · AC-1099, 2026-09-08) ----------------
    # ★ 임계와 같은 자리에 둔다. 추론 계통의 주기는
    #   authoring.integration.ai-server.poll-interval-seconds 이며 <서로를 물려받지 않는다> —
    #   트리거가 계통마다 따로 있어 한쪽을 바꿔도 다른 쪽 점검 간격은 움직이지 않는다.
    #  - 기본값이 추론(5초)보다 긴 것은 이 값이 <외부 벤더를 두드리는 횟수>이기 때문이다.
    #    임계는 우리 쪽 판정 기준만 바꾸지만, 주기는 상대에게 부담으로 그대로 간다.
    #  - ⚠ 인지·수용한 대가: 주기가 길어지면 죽은 벤더가 목록에 남는 시간이 길어진다.
    #    배제까지는 「주기 x 연속 실패 임계」라 기본값에서 추론의 대략 두 배이며, 그 구간의 위탁은
    #    죽은 주소로 나갔다 실패한다.
    #  - ⚠ 0 이하를 넣으면 Quartz 가 트리거를 만들지 못해 기동이 깨진다 — 하한 1로 흡수한다.
    #  - ⚠ 이 축의 잡 등록 여부는 여전히 authoring.integration.ai-server.poll-enabled 가 가른다
    #    (관측 배치 전체를 켜고 끄는 스위치는 하나다 — 켜고 끄는 축과 얼마나 자주 묻는가 축은 다르다).
    poll-interval-seconds: ${VLM_HEALTH_POLL_INTERVAL_SECONDS:10}

# 외부 시스템 결과 수신 webhook 인증 — VLM·생성형 AI(증강) 둘 다 계약상 무서명 가드다.
#  - 보호 대상 경로는 코드의 allowlist(WebhookProtectedPaths)가 단일 진실원이며,
#    Spring MVC 와 동일한 RequestPath/PathPattern 으로 판정한다(경로 인코딩 변형 우회 차단, E-ISSUE-01).
#  - Phase 7-A2 — 구 증강 콜백(/v1/aug/**, HMAC 서명 필수)은 외부 실계약과 맞지 않아 제거됐다.
#    등록된 서명 필수 경로는 현재 **0개**다. 그래서 HMAC 시크릿은 <미설정이어도 기동한다>
#    (HmacWebhookFilter — 쓰이지 않는 시크릿을 기동 조건으로 두면 배포 함정이 되므로 MEDIUM-3 에서 완화).
#    단 ①값을 <설정하면> 강도(32B 이상)·공개 placeholder 검증은 경로 유무와 무관하게 적용돼 위반 시
#    기동 차단이고, ②서명 필수 경로가 다시 등록되면 미설정도 즉시 기동 차단으로 돌아온다.
#    런타임은 **경로 판정 불가 요청을 401 로 끝내 fail-closed** 를 유지한다(E-ISSUE-04 의 조용한 우회 없음).
#  - timestamp-window-seconds: 과거 방향 허용창(기본 300s). 미래 방향은 코드에서 30s(시계 오차)만 허용.
#  - replay 방지: 서명 nonce 를 LS_WHK_SIGN_USE 에 1회성 소비(노드 공유). 중복은 401 이 아니라 409.
#  - 평문 커밋 금지: ${WEBHOOK_HMAC_SECRET_*} 환경변수만 허용.
#  - (UC018 — 비식별은 KPST 폴링으로 단일화되어 deidentify 콜백 시크릿 키를 제거함.)
#  - VLM describe 콜백(/v1/vlm/callback)은 벤더 확정 계약(v2.0.1) 무서명 규격 —
#    HMAC 대상이 아니며(2026-07-07 승인) IP allowlist + rate limit + 본문 size cap +
#    request_id 발급 게이트 3계층으로 보호한다(B-ISSUE-25).
#  - 생성형 AI 콜백(/v1/genai/callback)도 명세서 v1.1 무서명 규격 — 동일 3계층으로 보호하되
#    IP allowlist 는 **미설정 시 전면 차단**(fail-closed)이다. genai.allowed-ip-cidrs 참조.
webhook:
  hmac:
    secret:
      augment: ${WEBHOOK_HMAC_SECRET_AUGMENT:}
    timestamp-window-seconds: ${WEBHOOK_HMAC_TIMESTAMP_WINDOW:300}
  genai:
    # 생성형 AI 무서명 웹훅 IP allowlist. 기본 'none'(=허용 IP 없음, 전면 차단).
    # 프로파일별로 외부 송신 대역을 명시해야 콜백이 통과한다.
    allowed-ip-cidrs: ${WEBHOOK_GENAI_ALLOWED_IP_CIDRS:none}
  # 신뢰 프록시 CIDR (CSV) — 이 대역에서 들어온 요청의 X-Forwarded-For 만 해석한다.
  # 비어 있으면 XFF 를 전면 무시하고 remoteAddr 만 사용(헤더 위조로 rate limit 우회 차단, CWE-348).
  # 로컬/dev 는 비워 두고 LB 뒤에 배포되는 운영 환경에서만 채운다.
  trusted-proxy-cidrs: ${WEBHOOK_TRUSTED_PROXY_CIDRS:}
  vlm:
    # VLM 콜백 허용 출처 CIDR (CSV). 비어 있으면 미적용(rate limit + request_id 게이트만 적용).
    allowed-ip-cidrs: ${WEBHOOK_VLM_ALLOWED_IP_CIDRS:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
