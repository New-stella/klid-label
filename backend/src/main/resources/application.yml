spring:
  application:
    name: klid-la-authoring
  profiles:
    active: local
  data:
    web:
      pageable:
        # CWE-770 / OWASP API4: 페이지 size 상한 — 무제한 size 입력으로 DoS 차단.
        # 전역 적용: 모든 @PageableDefault / RequestParam size 가 100 으로 캡됨.
        max-page-size: 100
        default-page-size: 20
  servlet:
    multipart:
      # TUS 업로드는 application/offset+octet-stream (raw body) 사용 → multipart 비활성.
      # 활성화 시 Spring 이 form data 로 파싱 시도하여 5GB 파일 메모리 적재 위험.
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          time_zone: Asia/Seoul
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  quartz:
    # JDBC JobStore — controlDataSource(@Primary) 를 통해 기존 QRTZ_* 테이블 공유.
    # 실제 라벨링 잡은 Phase 5 에서 등록. Phase 3 는 부트스트랩 잡 1개만.
    # jobStore.class 는 Spring Boot 가 LocalDataSourceJobStore 로 자동 지정하므로 명시 X.
    job-store-type: jdbc
    jdbc:
      initialize-schema: never  # 운영 QRTZ_* 는 이미 존재 / 로컬은 V2 Flyway 로 생성
    properties:
      org.quartz.scheduler.instanceName: KlidAuthoringScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: '3'
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.useProperties: 'true'
      org.quartz.jobStore.misfireThreshold: '60000'
      org.quartz.jobStore.isClustered: 'false'
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  # Phase 12 — Caffeine 캐시 (시스템 설정 TTL 60s)
  cache:
    type: caffeine
    cache-names: sysconfig
    caffeine:
      spec: maximumSize=100,expireAfterWrite=60s

server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    # TUS PATCH 본문(최대 청크) 흡수 + 폼 사이즈 제한 해제 — raw octet-stream 업로드 호환.
    max-swallow-size: -1
    max-http-form-post-size: -1

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

authoring:
  # Phase 1 (role-claim) — 관리자 공유 패스워드 BCrypt 해시 (cost ≥ 12).
  #   - 평문은 코드/yml 어디에도 보관 금지 (CWE-256). 해시만 보관.
  #   - 운영(dev/stg/prd)에서는 환경변수 ADMIN_CLAIM_PASSWORD_HASH 로 override 필수.
  #   - 로컬 기본값은 application-local.yml 에 명시.
  auth:
    admin-claim-password-hash: ${ADMIN_CLAIM_PASSWORD_HASH:}
  jwt:
    issuer: ${JWT_ISSUER:klid-auth}
    algorithm: HS256
    # 운영/스테이징/개발: 환경변수 JWT_SECRET 필수 (미설정 시 부트 실패)
    # 로컬: application-local.yml 의 dev 기본값 사용
    secret: ${JWT_SECRET}
    allowed-issuers: ${JWT_ALLOWED_ISSUERS:klid-auth,klid,klid-portal}
  storage:
    raw-path: ${STORAGE_RAW_PATH:./storage/raw}
    deidentified-path: ${STORAGE_DEIDENTIFIED_PATH:./storage/deidentified}
  integration:
    deidentify:
      base-url: ${DEIDENTIFY_API_URL:http://localhost:9200}
      timeout-ms: 30000
    ai-server:
      base-url: ${AI_SERVER_URL:http://localhost:9300}
      timeout-ms: 60000
    gitea:
      base-url: ${GITEA_BASE_URL:http://localhost:3000}
      # 운영/스테이징/개발: 환경변수 GITEA_TOKEN 필수 (미설정 시 부트 실패)
      token: ${GITEA_TOKEN}
      owner: ${GITEA_OWNER:authoring}
      repo: ${GITEA_REPO:labels}
  batch:
    rate-per-min: 1
    frame-interval-sec: 60
    # Phase 5 배치 파이프라인
    enabled: ${BATCH_ENABLED:true}
    interval-sec: ${BATCH_INTERVAL_SEC:60}
    retry:
      max-attempts: ${BATCH_RETRY_MAX:3}
      initial-delay-sec: ${BATCH_RETRY_INITIAL_DELAY_SEC:60}
      interval-sec: ${BATCH_RETRY_INTERVAL_SEC:300}
  ffmpeg:
    threads: ${FFMPEG_THREADS:2}
    binary: ${FFMPEG_BIN:ffmpeg}
    # ffprobe 바이너리 경로 — DevAutolabelTestService 가 업로드된 영상에서 duration 자동 추출 시 사용.
    ffprobe-binary: ${FFPROBE_BIN:ffprobe}
  gitea:
    retry:
      # Gitea fallback 재시도 잡 활성화 (Phase 8). 기본 false → prd 에서 true 로 오버라이드.
      enabled: ${GITEA_RETRY_ENABLED:false}

# Phase 3 — Gitea fallback 영속 큐 (ccarch if-gitea-contents).
#  - false 기본 (local/dev). CircuitBreaker open 시 즉시 예외 전파 (현재 동작 유지).
#  - true (stg/prd) 활성화 시 LS_GITEA_FALLBACK_QUEUE 적재 + GiteaFallbackRetryJob 1분 polling.
gitea:
  fallback:
    enabled: ${GITEA_FALLBACK_ENABLED:false}
    retry:
      interval-ms: ${GITEA_FALLBACK_RETRY_INTERVAL_MS:60000}
      initial-delay-ms: ${GITEA_FALLBACK_RETRY_INITIAL_DELAY_MS:30000}
  # HIGH-5 fix (OWASP A06): CORS allowlist — 환경별로 명시 필수.
  # 기본값 빈 문자열 → 외부 origin 전부 차단 (same-origin only).
  # 운영(dev/stg/prd): 환경변수 CORS_ALLOWED_ORIGINS=https://fe.example.com,...
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Phase 11 — 포털 채널 TUS 업로드 정책
portal:
  upload:
    max-file-size-bytes: ${PORTAL_MAX_FILE_SIZE:5368709120}        # 5 GB
    allowed-extensions: ${PORTAL_ALLOWED_EXT:mp4,mov,avi}
    storage-path: ${PORTAL_STORAGE_PATH:${authoring.storage.raw-path:./storage/raw}/portal}

resilience4j:
  circuitbreaker:
    instances:
      deid:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
      ai:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
      gitea:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
      # Phase 1 — 외부 VLM 시계열 위탁 클라이언트 (vlm.client.enabled=true 일 때만 호출 발생)
      vlmClient:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
  retry:
    instances:
      deid:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
      ai:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
      gitea:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
      vlmClient:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
  timelimiter:
    instances:
      deid:    { timeout-duration: 60s }
      ai:      { timeout-duration: 60s }
      gitea:   { timeout-duration: 60s }
      # vlmClient TimeLimiter 미사용 — WebClient `.timeout(...)` 으로 Reactor 네이티브 처리.
      # 타임아웃 단일 출처: vlm.client.timeout-seconds (아래)

# Phase 1 — 외부 VLM 시계열 메타 분석 서비스 위탁 클라이언트.
#  - enabled=false 기본값 (local/dev 환경 영향 0건). stg/prd 실 연동 확정 시 환경변수로 활성화.
#  - url/token 은 평문 커밋 금지. 환경변수 ${VLM_SERVICE_URL}, ${VLM_SERVICE_TOKEN} 만 허용.
vlm:
  client:
    enabled: ${VLM_CLIENT_ENABLED:false}
    url: ${VLM_SERVICE_URL:http://localhost:9400}
    token: ${VLM_SERVICE_TOKEN:}
    timeout-seconds: 10

# Phase 2 — 외부 시스템 결과 수신 webhook HMAC 시크릿.
#  - 경로별 시크릿 분리 (/v1/deidentify/result, /v1/vlm/result, /v1/augments/result).
#  - 시크릿 미설정 시 fail-closed (HmacWebhookFilter 가 401 반환) — 빈 키 회피 차단.
#  - timestamp-window-seconds: replay 방지용 ±윈도우 (기본 300s).
#  - 평문 커밋 금지: ${WEBHOOK_HMAC_SECRET_*} 환경변수만 허용.
webhook:
  hmac:
    secret:
      deidentify: ${WEBHOOK_HMAC_SECRET_DEIDENTIFY:}
      vlm: ${WEBHOOK_HMAC_SECRET_VLM:}
      augment: ${WEBHOOK_HMAC_SECRET_AUGMENT:}
    timestamp-window-seconds: ${WEBHOOK_HMAC_TIMESTAMP_WINDOW:300}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"
