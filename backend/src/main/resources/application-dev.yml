spring:
  # multipart 한도(500MB/1200MB)는 local/dev/stg 가 동일해 application.yml 공통으로 승격됐다.
  #   (수동 업로드 /v1/dev/upload 영상 개당 500MB 수용. 개당 한도는 운영 포함 전 프로파일이 같고,
  #    운영만 application-prd.yml 에서 요청 총량을 1100MB 로 좁힌다.
  #    ⚠ 구 기재 폐기(2026-08-24 CO-008): "운영만 21MB 로 조인다" 는 수동 업로드를 운영에 노출하면서 무효가 됐다)
  #
  # DB 접속 정보는 stg/prd 와 동일하게 **기본값 없이** 환경변수로만 주입한다.
  #   과거 dev 에만 내부 DB 호스트 IP·DB 명이 기본값으로 박혀 있었다 — 리포지토리에 내부망 정보가
  #   평문으로 남고, 환경변수 누락 시 조용히 엉뚱한 서버를 향할 수 있어 제거했다(미주입 시 기동 실패).
  datasource:
    control:
      jdbc-url: jdbc:postgresql://${CONTROL_DB_HOST}:${CONTROL_DB_PORT}/${CONTROL_DB_NAME}
      username: ${CONTROL_DB_USERNAME}
      password: ${CONTROL_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
    portal:
      jdbc-url: jdbc:postgresql://${PORTAL_DB_HOST}:${PORTAL_DB_PORT}/${PORTAL_DB_NAME}
      username: ${PORTAL_DB_USERNAME}
      password: ${PORTAL_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

# [개발/검수 전용] dev 로그인/업로드 토글 — dev 는 기본 ON(기존 @Profile("!prd") 동작 유지)이되,
#   환경변수로 끌 수 있어야 한다. 리터럴 true 로 박으면 내릴 수단이 없다.
#   (공통 application.yml 은 ${DEV_LOGIN_ENABLED:false} fail-closed — 기본값만 프로파일에서 뒤집는다)
authoring:
  dev:
    login:
      enabled: ${DEV_LOGIN_ENABLED:true}
    upload:
      enabled: ${DEV_UPLOAD_ENABLED:true}
  # Phase 7-A1 — 외부 증강(생성형 AI)의 기본값을 noop 으로 명시한다.
  #   공통 기본값(http)이 운영 환경으로 새지 않도록 fail-safe 로 못박는 것이다.
  #   ★ AUGMENT_EXTERNAL_MODE=http + AUGMENT_API_BASE_URL 은 <실벤더 연동>과 <목업 연동> 양쪽에
  #     쓰이는 같은 스위치다. 값이 http 라는 사실만으로는 어느 쪽인지 알 수 없고, 무엇을 향하는지는
  #     base-url 이 정한다. 벤더 규격은 아직 확정 전이므로 기본값은 noop 으로 둔다.
  augment:
    external:
      # ⚠ 여기 적힌 noop 은 기본값이지 <실행 중인 서버의 상태>가 아니다 — 배포 형상이 덮어쓸 수 있다.
      #   실제로 cudo_246(dev)은 2026-08-26 부터 compose override 로
      #   AUGMENT_EXTERNAL_MODE=http + AUGMENT_API_BASE_URL=http://klid-mock-server:9400 을 주입해
      #   목업 벤더 서버로 실제 왕복한다(요청 → 목 처리 → 콜백 → 파생 생성). 비식별·시계열이 이미
      #   그 형상이라 증강만 꺼져 있던 비대칭을 없앤 것이다. 실벤더가 아니라 목업이다.
      #   ★ 현재 상태 판정은 이 파일이 아니라 기동 로그의
      #     `[Augment] active ExternalAugmentClient=...`(Noop/Http) 로 한다 — 배포 형상은 바뀔 수 있고
      #     그때 이 주석은 낡는다. 그 로그만이 실행 중인 사실을 말한다.
      #   ⚠ 켜면 증강 요청이 실제로 파생영상을 만든다. 같은 (영상 × 종류) 중복 요청은 서버가
      #     차단하지 않고 속도 제한도 두지 않는 확정 정책이라(연타 방어는 화면 단독 책임),
      #     그 형상에서는 파생이 쌓일 수 있다.
      mode: ${AUGMENT_EXTERNAL_MODE:noop}

# UC018 — dev 비식별은 KPST 폴링 단일 경로다(자체 채움 경로는 폐지됐다). 기본 위탁 대상은 목업 벤더
#   서버(mock-server, 컨테이너 네트워크 klid-net 의 klid-mock-server:9400)다 — 벤더 실서버 개발
#   완료 전까지 dev 에서 파이프라인 전체를 실 HTTP 로 돌리기 위한 배선이며, 실서버 전환은
#   KPST_DEID_BASE_URL 주입만으로 끝난다(코드 변경 없음).
#   계정은 application.yml 기본값(creator-id/req-user-id=authoring) 사용. 내부 http 평문이라 ca-cert 불요.
#   ★ https 주소를 주입하는 경우 KPST 자체 CA 경로(KPST_DEID_CA_CERT_PATH)도 함께 주입할 것(CWE-295 fail-closed).
#   ★ 호스트명 기본값은 도커 네트워크 전용이다 — 도커 밖(네이티브) 기동 시 반드시 KPST_DEID_BASE_URL 주입.
kpst:
  deid:
    enabled: ${KPST_DEID_ENABLED:true}
    base-url: ${KPST_DEID_BASE_URL:http://klid-mock-server:9400}

# Phase 1 — 외부 VLM 시계열. 공통 기본값은 url 이 **빈 값**이고, 비면 위탁이 그대로 실패한다
#   (활성/비활성 토글은 폐지됐다 — ADR-049. 조용한 SKIPPED 는 더 이상 없다). dev 는 목업 벤더 서버로
#   실제 위탁해 verify → 콜백(/v1/vlm/callback) 왕복까지 돌린다.
#   ⚠ 콜백은 mock-server → 저작도구 방향이므로 authoring.webhook.callback-base-url 이 컨테이너에서
#     도달 가능한 주소여야 한다(도커: WEBHOOK_CALLBACK_BASE_URL=http://klid-backend:8080/api).
#   - allow-insecure-url: 목업이 평문 http + 컨테이너 내부 호스트라, 운영 표준(HTTPS + 공인망)을 그대로
#     적용하면 VlmUrlPolicy 가 빈 생성을 실패시켜 **기동 자체가 막힌다**. 완화는 이 전용 플래그로만 열리고
#     local/dev 프로파일에서만 인정된다 — 추가로 배포 표식 ENV=stg|prd 가 있으면 dev 프로파일이라도
#     인정하지 않고 기동을 거부한다(ProfileGatedUrlPolicy · DevProfileGuard 와 동일 기준).
#     ★ 목 주소와 이 플래그는 짝이다. 플래그 없이 목 주소만 넣으면 부팅이 깨진다.
#     실벤더(HTTPS) 전환 시에는 VLM_ALLOW_INSECURE_URL=false 로 내린다.
#   ★ 활성/비활성 토글은 폐지됐다(ADR-049) — 미연동 판정은 url 주입 여부가 한다.
vlm:
  client:
    url: ${VLM_SERVICE_URL:http://klid-mock-server:9400}
    allow-insecure-url: ${VLM_ALLOW_INSECURE_URL:true}

logging:
  level:
    root: INFO
    kr.co.cudo.authoring: DEBUG
