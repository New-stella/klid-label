spring:
  datasource:
    control:
      jdbc-url: jdbc:postgresql://${CONTROL_DB_HOST:192.168.102.101}:${CONTROL_DB_PORT:5432}/${CONTROL_DB_NAME:klid_system}
      username: ${CONTROL_DB_USERNAME}
      password: ${CONTROL_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
    portal:
      jdbc-url: jdbc:postgresql://${PORTAL_DB_HOST}:${PORTAL_DB_PORT}/${PORTAL_DB_NAME}
      username: ${PORTAL_DB_USERNAME}
      password: ${PORTAL_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
  # dev 업로드(/v1/dev/autolabel-test) multipart 파싱 활성화 — 공통 yml 의 false(TUS 호환) override.
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

# [개발/검수 전용] dev 로그인/업로드 토글 — dev 는 항상 ON(기존 @Profile("!prd") 동작 유지).
authoring:
  dev:
    login:
      enabled: true
    upload:
      enabled: true
  # dev 비식별 — 기본 mock 모드. KPST 미호출, 원본을 비식별 경로로 복사하는 mock 비식별로 자족 동작한다.
  #   실 KPST 연동은 DEIDENTIFY_MOCK_MODE=false 로 전환(KPST API 연동 테스트 서버에 실제 위탁).
  #   mock-mode=true 는 prd(운영) 만 차단(DeidentifyStep 게이팅) — local/dev/stg 는 허용, prd 에서 true 면 부트 거부.
  integration:
    deidentify:
      mock-mode: ${DEIDENTIFY_MOCK_MODE:true}

# UC018 — dev 는 기본 mock 비식별(위 mock-mode=true)이라 아래 kpst.deid.* 는 미사용이다(mock 우선).
#   실 KPST 연동 시(DEIDENTIFY_MOCK_MODE=false) 사용 — enabled 는 application.yml 기본값(true), 계정도
#   기본값(creator-id/req-user-id=authoring) 사용. 내부망 http 평문이라 ca-cert 불요. base-url 은 override 가능.
kpst:
  deid:
    base-url: ${KPST_DEID_BASE_URL:http://222.118.130.251:9989}

logging:
  level:
    root: INFO
    kr.co.cudo.authoring: DEBUG
