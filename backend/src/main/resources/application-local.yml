# ============================================================================
# WARNING — local 프로파일 전용 fallback 시크릿 (CWE-798)
#
#   본 파일의 fallback 비밀번호/토큰은 docker dev 컨테이너(klid-mariadb) 한정.
#   운영 환경(dev/stg/prd)에 SPRING_PROFILES_ACTIVE=local 로 배포하지 말 것.
#   ENV 환경변수가 dev/stg/prd 인 경우 LocalProfileGuard 가 부트를 거부함.
#
#   운영 시크릿은 환경변수(JWT_SECRET, *_DB_PASSWORD, GITEA_TOKEN)로 주입.
# ============================================================================
spring:
  # [개발/검수 전용] /v1/dev/autolabel-test multipart 업로드용 — local 프로파일만 활성화.
  #   상위 application.yml 에서 false (TUS 호환). local 에서 dev endpoint 사용 시 override.
  #   prd 는 application.yml 의 enabled: false 가 유지되어 영향 없음.
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    control:
      jdbc-url: jdbc:mariadb://127.0.0.1:3307/klid_system?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      username: ${CONTROL_DB_USERNAME:klid_user}
      password: ${CONTROL_DB_PASSWORD:klid_local_2024}
      driver-class-name: org.mariadb.jdbc.Driver
    portal:
      jdbc-url: jdbc:mariadb://127.0.0.1:3307/portal?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      username: ${PORTAL_DB_USERNAME:klid_user}
      password: ${PORTAL_DB_PASSWORD:klid_local_2024}
      driver-class-name: org.mariadb.jdbc.Driver

  flyway:
    enabled: true

# 로컬 개발 전용 시크릿/토큰 기본값 (운영 배포 환경에는 절대 적용되지 않음)
# DO NOT use these defaults in any non-local environment
authoring:
  # Phase 1 (role-claim) — 로컬 BCrypt 해시 (cost 12).
  # 평문은 코드/yml 에 절대 노출 금지 — 로컬 평문은 별도 채널(README/문서)로만 공유한다.
  # 운영(dev/stg/prd)에서는 ADMIN_CLAIM_PASSWORD_HASH 환경변수로 override 필수.
  auth:
    admin-claim-password-hash: ${ADMIN_CLAIM_PASSWORD_HASH:$2y$12$NxE8qu8kf7G6kxmhtKs8b.d4uWDvWg1YsSQ7ShVvQmrLTwCE.mCSq}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32bytes-minimum}
  integration:
    gitea:
      token: ${GITEA_TOKEN:dev-gitea-token}
  # Phase 5 — local 환경에서는 자동 트리거 비활성화 (Quartz 잡 미등록).
  # Step/Orchestrator/Service 빈은 그대로 등록되어 단위 테스트 가능.
  batch:
    enabled: false
  # HIGH-5 fix (OWASP A06): 로컬 FE 개발 서버 기본 허용
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}
  # [개발/검수 전용] /v1/dev/autolabel-test 업로드 한도 (bytes) — 500MB 기본.
  #   서비스 레이어에서 multipart 한도와 별개로 이중 가드.
  dev:
    autolabel-test:
      max-file-size: ${AUTHORING_DEV_AUTOLABEL_TEST_MAX_FILE_SIZE:524288000}

logging:
  level:
    root: INFO
    kr.co.cudo.authoring: DEBUG
    org.hibernate.SQL: DEBUG
