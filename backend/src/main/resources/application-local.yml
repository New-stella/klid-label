spring:
  datasource:
    control:
      jdbc-url: jdbc:h2:mem:klid_system;MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver
    portal:
      jdbc-url: jdbc:h2:mem:portal;MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver

  flyway:
    enabled: true  # 로컬 H2도 V1__phase2_base_schema 적용 (운영은 klid_system 기존 테이블, IF NOT EXISTS로 충돌 방지)

# 로컬 개발 전용 시크릿/토큰 기본값 (운영 배포 환경에는 절대 적용되지 않음)
# DO NOT use these defaults in any non-local environment
authoring:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32bytes-minimum}
  integration:
    control-server:
      m2m-token: ${CONTROL_M2M_TOKEN:dev-m2m-token-32bytes-or-longer-please}
    portal-server:
      m2m-token: ${PORTAL_M2M_TOKEN:dev-m2m-token-32bytes-or-longer-please}
    gitea:
      token: ${GITEA_TOKEN:dev-gitea-token}
  # Phase 5 — local 환경에서는 자동 트리거 비활성화 (Quartz 잡 미등록).
  # Step/Orchestrator/Service 빈은 그대로 등록되어 단위 테스트 가능.
  batch:
    enabled: false

logging:
  level:
    root: INFO
    kr.co.cudo.authoring: DEBUG
    org.hibernate.SQL: DEBUG
