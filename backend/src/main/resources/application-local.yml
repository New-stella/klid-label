# ============================================================================
# WARNING — local 프로파일 전용 fallback 시크릿 (CWE-798)
#
#   본 파일의 fallback 비밀번호/토큰은 docker dev 컨테이너(klid-postgres) 한정.
#   운영 환경(dev/stg/prd)에 SPRING_PROFILES_ACTIVE=local 로 배포하지 말 것.
#   ENV 환경변수가 dev/stg/prd 인 경우 LocalProfileGuard 가 부트를 거부함.
#
#   운영 시크릿은 환경변수(JWT_SECRET, *_DB_PASSWORD)로 주입.
# ============================================================================
spring:
  # multipart 한도(500MB/1200MB)는 local/dev/stg 가 동일해 application.yml 공통으로 승격됐다.
  #   (dev 업로드 /v1/dev/upload 영상 개당 500MB 수용. 운영만 application-prd.yml 에서 21MB 로 조인다)
  datasource:
    control:
      jdbc-url: jdbc:postgresql://127.0.0.1:5432/klid_system
      username: ${CONTROL_DB_USERNAME:klid_user}
      password: ${CONTROL_DB_PASSWORD:klid_local_2024}
      driver-class-name: org.postgresql.Driver
    portal:
      jdbc-url: jdbc:postgresql://127.0.0.1:5432/portal
      username: ${PORTAL_DB_USERNAME:klid_user}
      password: ${PORTAL_DB_PASSWORD:klid_local_2024}
      driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

# 로컬 개발 전용 시크릿/토큰 기본값 (운영 배포 환경에는 절대 적용되지 않음)
# DO NOT use these defaults in any non-local environment
authoring:
  # Phase 1 (role-claim) — 로컬 BCrypt 해시 (cost 12).
  # 평문은 코드/yml 에 절대 노출 금지 — 로컬 평문은 별도 채널(README/문서)로만 공유한다.
  # 운영(dev/stg/prd)에서는 ADMIN_CLAIM_PASSWORD_HASH 환경변수로 override 필수.
  auth:
    admin-claim-password-hash: ${ADMIN_CLAIM_PASSWORD_HASH:$2y$12$NxE8qu8kf7G6kxmhtKs8b.d4uWDvWg1YsSQ7ShVvQmrLTwCE.mCSq}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32bytes-minimum}
  # 영상 스트림 서명 URL — 로컬 기본 시크릿(32B 이상). JWT_SECRET 과 다른 값으로 키 분리.
  # 운영(dev/stg/prd)은 STREAM_SIGN_SECRET 환경변수로 override 필수.
  stream:
    sign-secret: ${STREAM_SIGN_SECRET:local-stream-sign-secret-change-me-32bytes-min}
  # 콜백 충실 플로우 Phase 2 / Phase 7-A1 — local 외부 증강 연동 모드.
  #   ★ 이 블록은 원래 kpst: 하위에 잘못 중첩(kpst.augment.external.mode)돼 있어 실제 프로퍼티
  #     키(authoring.augment.external.mode)에 전혀 반영되지 않았다(ENV-ISSUE-01).
  #     최상위 authoring: 아래로 바로잡는다. 아래 cors:/dev: 와 <b>같은 오배치 계열</b>이며(동일 원인,
  #     동일 교정) 코드가 authoring.* 를 읽으므로 반드시 authoring 하위여야 한다 — 오배치 시 조건부
  #     빈 선택이 기본값(matchIfMissing)으로 떨어져 의도한 클라이언트가 로드되지 않는다.
  #   - mode 기본 http → mock-server(:9400) 에 실제 위탁한다. Phase 7-A2 에서 자족 시뮬레이터
  #     (DevAugmentCallbackSimulator)를 제거했다 — 본 프로그램이 스스로 성공 결과를 만들어내면
  #     외부 연동이 실제로 성립하는지 검증할 수 없다(local-must-use-mock-server 원칙).
  #   - 콜백 URL = authoring.webhook.callback-base-url + /v1/genai/callback
  #   - allow-insecure-url: 목업이 평문 http + 사설/loopback IP 라 완화 플래그를 local 에서만 켠다.
  #     이 플래그는 local/dev 프로파일에서만 인정되며 그 밖(stg/prd/미지정)에서 true 면 기동이 실패한다.
  augment:
    external:
      mode: ${AUGMENT_EXTERNAL_MODE:http}
      base-url: ${AUGMENT_API_BASE_URL:http://localhost:9400}
      allow-insecure-url: ${AUGMENT_ALLOW_INSECURE_URL:true}
  # Phase 5 — local 환경에서는 자동 트리거 비활성화 (Quartz 잡 미등록).
  # Step/Orchestrator/Service 빈은 그대로 등록되어 단위 테스트 가능.
  batch:
    enabled: false
  # ★ 인입 폴링은 local 에서도 켠다 — 적재 주체 반전 이후 이 잡이 <자체 업로드분 적재의 유일한
  #   통로>다. 꺼두면 dev 업로드가 200 을 받고도 인입 행이 영원히 PENDING 에 머물러
  #   LS_DATA_RAW 가 생기지 않는다(InternalUploadWiringGuard 가 기동 시 ERROR 로 경고하던 형상).
  #   테스트 격리는 src/test/resources/application-local.yml 의 false 가 그대로 담당한다.
  control:
    training-scan:
      enabled: true
  # local 환경에서는 만료 작업락 sweeper 도 비활성화 (@Scheduled 미발화 — WorkLockSweepConfig 미등록).
  work-lock:
    sweep:
      enabled: false
  # local 은 해상도 파생 유예 삭제 스윕 잡도 비활성화 (@Scheduled 미발화). 유예 자체는 유지되며,
  #   백필을 다시 실행하면(run) 그 안에서 스윕이 수행되므로 잔존물은 재실행으로 정리된다.
  # local/test 에서는 포털 메타 복제 워커 잡도 비활성화 (Quartz 잡 미등록 — 테스트가 워커를 직접 호출).
  #   운영(dev/stg/prd)은 application.yml 기본값(enabled 미설정=matchIfMissing=true)으로 활성화된다.
  meta-replication:
    enabled: false
  # local 비식별 — 기본 mock 모드. KPST 미호출, 원본을 비식별 경로로 복사하는 mock 비식별로 자족 동작한다.
  #   ★자체 채움(mock) 비식별 경로는 폐지됐다(2026-08-19) — 로컬도 목 서버(mock-server)로 실제 위탁한다.
  integration:
    deidentify:
  # D-48 — 로컬은 관제 통지를 **켜고 목 서버(:9400)로 실제 HTTP 왕복**한다.
  #   내부 목모드로 외부 호출을 우회하지 않는다(구속 규칙) — mock-server 의
  #   POST /api/data-set/v2/jobs/{job_id}/notify-completed|notify-updated 가 관제 계약을 흉내내며
  #   409(job_id 중복)/404(선행 완료 없음)를 실제로 돌려주므로 자기치유 분기가 실동작으로 검증된다.
  #   docker compose(local override)에서는 CONTROL_NOTIFY_URL=http://klid-mock-server:9400 이 주입되고,
  #   네이티브 bootRun 은 아래 기본값(호스트 발행 포트 9400)을 사용한다.
  #   목 서버 없이 띄우려면 CONTROL_NOTIFY_ENABLED=false 로 끈다(통지 미발송).
  control-notify:
    enabled: ${CONTROL_NOTIFY_ENABLED:true}
    url: ${CONTROL_NOTIFY_URL:http://localhost:9400}
  # HIGH-5 fix (OWASP A06): 로컬 FE 개발 서버 기본 허용.
  #   SecurityConfig 가 ${authoring.cors.allowed-origins} 를 읽으므로 반드시 authoring 하위에 위치해야 한다.
  #   (과거 kpst 하위 오배치 → authoring.cors.allowed-origins 가 빈 기본값으로 남아 브라우저 Origin
  #    http://localhost:5174 가 Spring CorsFilter 의 403 "Invalid CORS request" 로 거부되던 버그를 교정)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:13000,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:13000}
  # [개발/검수 전용] /v1/dev/upload 업로드 한도 (bytes) — 500MB 기본.
  #   서비스 레이어에서 multipart 한도와 별개로 이중 가드. (authoring.dev.* — kpst 오배치 동반 교정)
  dev:
    # [개발/검수 전용] dev 로그인/업로드 토글 — local 은 항상 ON(기존 @Profile("!prd") 와 동일 동작 유지).
    login:
      enabled: true
    upload:
      enabled: true
      # 게이팅 키(upload.enabled)와 같은 prefix 로 합쳐 둔다 — 별도 prefix 로 떨어져 있으면
      # 한쪽만 고쳐도 조용히 기본값으로 동작한다(개명 이력은 DevUploadPathRenameGuardTest 참조).
      max-file-size: ${AUTHORING_DEV_UPLOAD_MAX_FILE_SIZE:524288000}
    # [로컬 전용] dev-seed.sql(db/seed) 자동 적재 — bootRun(local) 시 별도 psql 수동 실행 불필요.
    #   DevSeedRunner 가 Flyway 마이그레이션 이후 controlDataSource 에 멱등 적재한다.
    #   @Profile("local") + 본 토글 이중 게이팅 — prd/dev/stg 에서는 절대 실행되지 않음.
    seed:
      enabled: ${AUTHORING_DEV_SEED_ENABLED:true}

# UC018 — local 의 KPST 위탁 대상은 **목업 벤더 서버(mock-server)** 다.
#   구속 정책: 로컬은 외부 벤더 실서버가 아니라 mock-server(:9400)를 바라본다. 과거 이 자리에 벤더
#   테스트 서버 IP 가 평문 기본값으로 박혀 있어(내부망 전용 주소가 리포지토리에 남고, 내부망 밖에서는
#   비식별이 조용히 실패) 제거했다.
#   - 도커 로컬(`-f docker-compose.yml -f docker-compose.local.yml`): compose 가 klid-mock-server 를 주입.
#   - 네이티브(bootRun): mock-server 를 호스트에서 직접 띄우고 KPST_DEID_BASE_URL=http://localhost:9400 주입.
#   계정은 application.yml 기본값(creator-id/req-user-id=authoring) 사용. http 평문이라 ca-cert 불요.
kpst:
  deid:
    enabled: ${KPST_DEID_ENABLED:true}
    base-url: ${KPST_DEID_BASE_URL:http://klid-mock-server:9400}

# 외부 VLM 시계열 — local 도 목업 벤더 서버로 **실제 위탁**한다.
#   공통 기본값은 enabled=false 이고, false 면 VlmClient 가 외부 호출 없이 SKIPPED 를 반환해
#   **VLM 단계가 통째로 빈다**(결과 0건인데 파이프라인은 성공처럼 보인다). 구속 정책상 로컬도
#   자체 결과채움/스킵이 아니라 mock-server(:9400) 실 HTTP 왕복(describe → /v1/vlm/callback)을 쓴다.
#   ★ 코드가 읽는 키는 vlm.base-url 이 아니라 vlm.client.enabled / vlm.client.url 이다
#     (WebClientConfig.vlmWebClient / VlmClient). base-url 로 적으면 조용히 무시된다.
#   - 도커 로컬(`-f docker-compose.yml -f docker-compose.local.yml`): 주 사용 경로. 컨테이너
#     네트워크 이름으로 도달하므로 아래 기본값(klid-mock-server:9400)이 그대로 맞는다.
#     (base compose 도 동일 값을 주입한다 — 단, 루트 .env 에 VLM_CLIENT_ENABLED=false 가 남아
#      있으면 환경변수가 이겨 다시 SKIPPED 가 되므로 .env 를 함께 확인할 것)
#   - 네이티브(bootRun): 컨테이너명이 해석되지 않는다 — mock-server 를 호스트에서 띄우고
#     VLM_SERVICE_URL=http://localhost:9400 을 주입할 것(위 KPST_DEID_BASE_URL 과 동일 관례).
#   - allow-insecure-url: 목업이 평문 http + 컨테이너 내부/사설 호스트라, 운영 표준(HTTPS + 공인망)을
#     그대로 적용하면 VlmUrlPolicy 가 빈 생성을 실패시켜 **기동 자체가 막힌다**. 완화는 이 전용 플래그로만
#     열리고 local/dev 프로파일에서만 인정된다(그 밖에서 true 면 기동 실패 — ProfileGatedUrlPolicy).
#     ★ enabled=true 와 이 플래그는 짝이다. 플래그 없이 enabled 만 켜면 부팅이 깨진다.
vlm:
  client:
    enabled: ${VLM_CLIENT_ENABLED:true}
    url: ${VLM_SERVICE_URL:http://klid-mock-server:9400}
    allow-insecure-url: ${VLM_ALLOW_INSECURE_URL:true}

# 콜백 충실 플로우 Phase 2 — local 전용 webhook HMAC 시크릿(dev placeholder, 32B 이상).
#   - Phase 7-A2 이후 서명 필수 경로는 0개다(VLM·생성형 AI 콜백 모두 벤더 규격상 무서명). 이 값은
#     HmacWebhookFilter 가 **경로 판정 불가 요청을 401 로 끝내기 위한 fail-closed 시크릿**으로만 쓰인다.
#     (구 서술 "dev 콜백 시뮬레이터가 같은 값으로 서명" 은 시뮬레이터 제거로 사문화돼 정정)
#   - 평문 운영 시크릿 아님. 운영(dev/stg/prd)은 WEBHOOK_HMAC_SECRET_AUGMENT 환경변수로 override 필수.
#   - ★ 이 값은 리포에 커밋된 공개 placeholder 라 **local 프로파일에서만** 허용된다. 다른 프로파일에서
#     이 값이 감지되면 HmacWebhookFilter 가 기동을 차단한다(KNOWN_PLACEHOLDER_SECRETS, DEV_FIX H-1).
#     "빈 값이면 기동 실패" 회피용으로 이 기본값을 운영에 흘리면 공개 키로 서명 위조가 가능해진다.
webhook:
  hmac:
    secret:
      augment: ${WEBHOOK_HMAC_SECRET_AUGMENT:local-augment-callback-hmac-change-me-32bytes-min}
  genai:
    # 생성형 AI 콜백 IP allowlist — 기본 fail-closed(전면 차단)라 로컬은 명시적으로 열어 준다.
    # mock-server 는 docker 브리지에서 접속하므로 IP 가 유동적이다.
    allowed-ip-cidrs: ${WEBHOOK_GENAI_ALLOWED_IP_CIDRS:0.0.0.0/0}

logging:
  level:
    root: INFO
    kr.co.cudo.authoring: DEBUG
    org.hibernate.SQL: DEBUG
