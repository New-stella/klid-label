spring:
  datasource:
    control:
      jdbc-url: jdbc:mariadb://${CONTROL_DB_HOST}:${CONTROL_DB_PORT}/${CONTROL_DB_NAME}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
      username: ${CONTROL_DB_USERNAME}
      password: ${CONTROL_DB_PASSWORD}
      driver-class-name: org.mariadb.jdbc.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
    portal:
      jdbc-url: jdbc:mariadb://${PORTAL_DB_HOST}:${PORTAL_DB_PORT}/${PORTAL_DB_NAME}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
      username: ${PORTAL_DB_USERNAME}
      password: ${PORTAL_DB_PASSWORD}
      driver-class-name: org.mariadb.jdbc.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
  quartz:
    properties:
      org.quartz.jobStore.isClustered: 'true'
      org.quartz.jobStore.clusterCheckinInterval: '20000'
      org.quartz.scheduler.instanceId: AUTO

authoring:
  gitea:
    retry:
      enabled: ${GITEA_RETRY_ENABLED:true}

# Phase 12 — 운영 환경 actuator 최소 노출 (보안: env/beans/heapdump 차단)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    kr.co.cudo.authoring: INFO
