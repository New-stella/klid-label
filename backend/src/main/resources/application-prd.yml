spring:
  # 풀 설정은 prefix 직하(평면)에 둔다. ControlDataSourceConfig 가 HikariDataSource 인스턴스에
  #   @ConfigurationProperties(prefix="spring.datasource.control") 로 직접 바인딩하므로
  #   Boot 오토컨피그 규약인 `hikari:` 중첩 키는 unknown field 로 조용히 무시된다(= 기본 풀 10 으로 동작).
  #   회귀 방지: DataSourcePoolBindingTest 가 본 파일을 실제로 바인딩해 20/5 를 검증한다.
  # 이중화(HA) — Quartz 클러스터링 **필수**(B-ISSUE-81). 배포 토폴로지가 주 서버 2노드 Active-Active 라
  #   공통 기본값(false)을 상속하면 관제 학습용 스캔(60s)·KPST 폴링(30s)·export sweep(600s) 트리거가
  #   노드마다 중복 발화한다(@DisallowConcurrentExecution 은 스케줄러 인스턴스 내부에서만 유효).
  #   ⚠ QUARTZ_CLUSTERED=false 로 되돌리면 QuartzClusteringGuard 가 기동을 거부한다(설정 우회 불가).
  #   ⚠ 노드 간 시계 동기(NTP/chrony) 필수. clusterCheckinInterval 은 공통 yml 값(20s)을 상속한다.
  quartz:
    properties:
      org.quartz.jobStore.isClustered: ${QUARTZ_CLUSTERED:true}
  datasource:
    control:
      jdbc-url: jdbc:postgresql://${CONTROL_DB_HOST}:${CONTROL_DB_PORT}/${CONTROL_DB_NAME}
      username: ${CONTROL_DB_USERNAME}
      password: ${CONTROL_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 20
      minimum-idle: 5
  # 운영(prd) multipart 한도 — 요청 총량만 공통(1200MB)보다 좁게 조인다.
  #   ★ 2026-08-24 변경: 개당 한도 21MB → 500MB (CO-008).
  #     구 근거는 "prd 에는 dev 업로드 경로 자체가 없다" 였는데, 그 전제가 무너졌다 —
  #     수동 업로드(/v1/dev/upload)를 운영에 노출하기로 확정했다(아래 authoring.dev.upload).
  #     CCTV 영상 실측이 246MB(3840x2160, 80초)이고 사업 기준이 30초 이상/건이라 2배 여유로 500MB.
  #     공통값과 같은 값이라 프로파일 간 개당 한도 드리프트가 사라진다.
  #   ⚠ 개당 한도가 커지면서 포털 이미지도 서블릿 계층에서는 500MB 까지 통과한다 —
  #     개당 20MB 판정은 서비스 계층 검증이 계속 담당한다(방어 한 겹이 얕아진 것은 인지·수용).
  #   요청 총량 1100MB 는 유지한다 — 영상 단건(500MB)을 수용하면서 포털 다건 업로드의
  #     총량 상한 역할을 그대로 한다(공통 1200MB 보다 좁다).
  #   ⚠ 이 블록을 지우면 요청 총량이 공통값 1200MB 로 조용히 상향된다
  #     (무제한 대용량 요청 자원 소진, OWASP API4). ConfigProfileDriftGuardTest 가 회귀를 차단한다.
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 1100MB

# 운영(prd) webhook 설정 — 미설정 시 부팅 차단(fail-closed).
#
# ★ `${VAR:?msg}` 는 쓰지 않는다 (DEV_FIX H-1). Spring 의 placeholder 는 첫 ':' 뒤를 전부
#   기본값으로 해석하므로 `${VAR:?msg}` 는 fail-fast 가 아니라 "?msg" 라는 문자열이 그대로 주입된다.
#   그 문자열은 비어 있지도 않고 32B 를 넘어 시크릿 검증을 통과 → **커밋된 문자열을 키로 기동**하게 된다.
#   따라서 yml 은 빈 기본값(${VAR:})으로 두고, 미설정·공개 placeholder·약한 길이는 모두
#   HmacWebhookFilter / ClientIpResolver / WebhookIpAllowlist 의 기동 검증이 차단한다.
#
# (UC018 — 비식별은 KPST 폴링으로 단일화되어 deidentify 콜백 시크릿 키를 제거함.)
# (VLM describe 콜백은 벤더 v2.0.1 무서명 규격 — HMAC 제거, request_id 발급 게이트로 대체. 증강만 유지.)

# 외부 증강(생성형 AI) — 벤더 주소를 주입하면 그 순간 연동이다(2026-09-03 확정).
#   ★ 구 형상은 mode: ${AUGMENT_EXTERNAL_MODE:noop} 로 미연동을 못박았다. 근거는 "base-url 미주입이면
#     AugmentUrlPolicy 의 빈값 거부로 기동이 죽는다" 였는데, 그 <기동 의존 자체가 제거>됐다 —
#     빈 주소는 위험한 것이 아니라 아직 안 정해진 것이라 기동을 막지 않고 위탁 시점에 실패한다.
#     그래서 토글로 못박을 이유가 사라졌고, 그 축은 폐기됐다. 실연동 전환은 AUGMENT_API_BASE_URL
#     주입만으로 끝난다.
#   ⚠ 주입하면 콜백 allowlist(WEBHOOK_GENAI_ALLOWED_IP_CIDRS)도 함께 명시해야 한다 — 짝이 안 맞으면
#     GenAiIntegrationWiringGuard 가 <위탁을> 거부한다(위탁은 나가는데 콜백이 전건 403 이 되는 고착 방지).
#     ★ 구 서술 「기동을 막는다」는 폐기다(2026-09-03 · ADR-062) — 주소 축과 같은 근거로 판정을 기동에서
#       위탁 시점으로 옮겼다. 기동은 통과하고 ERROR 만 남는다.
#     ⚠ 이 파일의 다른 「기동 차단」 서술(HmacWebhookFilter/ClientIpResolver/WebhookIpAllowlist ·
#       VLM allowlist · trusted-proxy-cidrs)은 ADR-062 <대상이 아니라> 여전히 기동을 막는다 —
#       낱말로 훑어 함께 고치지 말 것.
authoring:
  # [운영 노출] 수동 업로드(/v1/dev/upload) — 2026-08-24 CO-008 로 운영에서도 켠다.
  #   왜 기본값을 뒤집나: 외부에서 받은 영상을 운영자가 직접 올려야 하는 동선이 실제로 있고,
  #   그 입구가 이 경로다. FE 는 이미 노출돼 있었는데(온프렘 빌드가 VITE_DEV_UPLOAD_ENABLED 기본 true)
  #   BE 만 꺼져 있어 "화면은 보이는데 API 는 404" 인 상태였다 — 그 어긋남을 여기서 맞춘다.
  #   ★ 토글은 없애지 않는다 — 리터럴 true 가 아니라 placeholder 라야 DEV_UPLOAD_ENABLED=false 로 되돌릴 수 있다.
  #   ⚠ 되돌릴 때는 BE 토글 off 와 FE 재빌드(VITE_DEV_UPLOAD_ENABLED=false)를 반드시 함께 한다.
  #     BE 만 끄면 화면은 그대로 보이고 API 만 404 라 운영자가 원인을 못 찾는다(위 어긋남이 그 사례).
  #   ⚠ dev 로그인(authoring.dev.login / DEV_LOGIN_ENABLED)은 여기 넣지 않는다 — 별개 키이며
  #     공통 기본 false 를 그대로 상속해 /v1/dev/tokens 는 운영에서 계속 404 다(인증 우회 표면 차단).
  dev:
    upload:
      enabled: ${DEV_UPLOAD_ENABLED:true}

webhook:
  hmac:
    secret:
      # ★ 실제 동작(Phase 7-A2 이후) — 서명 필수 경로가 <0개> 이므로 이 값은 <미설정이어도 기동한다>
      #   (HmacWebhookFilter.ensureSecretConfigured: hasSignatureRequiredPaths()==false 면 미설정 허용).
      #   쓰이지 않는 시크릿을 기동 조건으로 두면 "무의미한 값을 넣어야만 뜨는" 배포 함정이 되기 때문이다.
      #   단 ①값을 <설정하면> 강도(32B 이상)·공개 placeholder 검증은 그대로 적용돼 위반 시 기동 차단이고,
      #      ②서명 필수 경로가 다시 등록되면 미설정도 즉시 기동 차단으로 돌아온다.
      #   런타임은 경로 판정 불가 요청을 401 로 끝내 fail-closed 를 유지한다(조용한 우회 없음).
      augment: ${WEBHOOK_HMAC_SECRET_AUGMENT:}
  # 운영은 LB/Nginx 뒤에 배포된다. 신뢰 프록시 대역을 지정해야 X-Forwarded-For 가 해석되며,
  # 미지정 시 모든 콜백의 클라이언트 IP 가 프록시 IP 로 수렴해 rate limit 이 전체를 차단할 수 있다(A-ISSUE-15).
  #   prd 는 **명시 필수** — 프록시 뒤면 CIDR, 직접 노출이면 'none' (미설정 시 기동 차단, DEV_FIX M-3).
  trusted-proxy-cidrs: ${WEBHOOK_TRUSTED_PROXY_CIDRS:}
  vlm:
    # VLM 콜백 IP allowlist (B-ISSUE-25 TODO 이행) — 벤더 송신 대역을 지정한다.
    #   prd 는 **명시 필수** — 대역 CIDR 또는 미적용을 뜻하는 'none' (미설정 시 기동 차단, DEV_FIX M-3).
    allowed-ip-cidrs: ${WEBHOOK_VLM_ALLOWED_IP_CIDRS:}
  genai:
    # 생성형 AI 콜백 IP allowlist — VLM 과 달리 **미설정이면 전면 차단**(fail-closed).
    # 신규 연동이라 "미설정 = 전면 허용" 기본값을 물려받지 않는다. 외부 송신 대역을 지정해야 통과한다.
    allowed-ip-cidrs: ${WEBHOOK_GENAI_ALLOWED_IP_CIDRS:}

# 운영(prd) 환경 — API 문서/Swagger UI 노출 차단 (보안: 공격 표면 축소).
#   springdoc 비활성 시 /v3/api-docs, /swagger-ui 모두 404 (SecurityConfig 의 permitAll 무력화).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Phase 12 — 운영 환경 actuator 최소 노출 (보안: env/beans/heapdump 차단)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    kr.co.cudo.authoring: INFO
