spring:
  # 풀 설정은 prefix 직하(평면)에 둔다. Control/PortalDataSourceConfig 가 HikariDataSource 인스턴스에
  #   @ConfigurationProperties(prefix="spring.datasource.{control|portal}") 로 직접 바인딩하므로
  #   Boot 오토컨피그 규약인 `hikari:` 중첩 키는 unknown field 로 조용히 무시된다(= 기본 풀 10 으로 동작).
  #   회귀 방지: DataSourcePoolBindingTest 가 본 파일을 실제로 바인딩해 20/5 를 검증한다.
  datasource:
    control:
      jdbc-url: jdbc:postgresql://${CONTROL_DB_HOST}:${CONTROL_DB_PORT}/${CONTROL_DB_NAME}
      username: ${CONTROL_DB_USERNAME}
      password: ${CONTROL_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 20
      minimum-idle: 5
    portal:
      jdbc-url: jdbc:postgresql://${PORTAL_DB_HOST}:${PORTAL_DB_PORT}/${PORTAL_DB_NAME}
      username: ${PORTAL_DB_USERNAME}
      password: ${PORTAL_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 20
      minimum-idle: 5
  # 운영(prd) multipart 한도 — 공통(500MB/1200MB)보다 **좁게 조인다**.
  #   공통값은 dev 업로드(/v1/dev/autolabel-test) 영상 500MB 를 수용하기 위한 비운영 기준이고,
  #   prd 에는 dev 업로드 경로 자체가 없다(authoring.dev.upload.enabled 기본 false).
  #   운영에 필요한 multipart 는 포털 이미지 업로드뿐 — 개당 20MB(서비스 검증) + 1MB 헤드룸,
  #   요청당 최대 50장(50×21MB=1050MB) + 헤드룸으로 1100MB.
  #   ⚠ 이 블록을 지우면 공통값을 상속해 운영 한도가 21MB → 500MB 로 조용히 상향된다
  #     (무제한 대용량 요청 자원 소진, OWASP API4). ConfigProfileDriftGuardTest 가 회귀를 차단한다.
  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 1100MB

# 운영(prd) webhook 설정 — 미설정 시 부팅 차단(fail-closed).
#
# ★ `${VAR:?msg}` 는 쓰지 않는다 (DEV_FIX H-1). Spring 의 placeholder 는 첫 ':' 뒤를 전부
#   기본값으로 해석하므로 `${VAR:?msg}` 는 fail-fast 가 아니라 "?msg" 라는 문자열이 그대로 주입된다.
#   그 문자열은 비어 있지도 않고 32B 를 넘어 시크릿 검증을 통과 → **커밋된 문자열을 키로 기동**하게 된다.
#   따라서 yml 은 빈 기본값(${VAR:})으로 두고, 미설정·공개 placeholder·약한 길이는 모두
#   HmacWebhookFilter / ClientIpResolver / WebhookIpAllowlist 의 기동 검증이 차단한다.
#
# (UC018 — 비식별은 KPST 폴링으로 단일화되어 deidentify 콜백 시크릿 키를 제거함.)
# (VLM describe 콜백은 벤더 v2.0.1 무서명 규격 — HMAC 제거, request_id 발급 게이트로 대체. 증강만 유지.)

# Phase 7-A1 — 외부 증강(생성형 AI) 벤더 실연동 전이라 운영은 noop 을 명시한다.
#   공통 기본값(http)이 운영으로 새면 base-url 미주입 상태로 위탁 클라이언트를 만들려 하다가
#   AugmentUrlPolicy 의 "빈값 거부"로 기동이 죽는다(조용한 오연동은 없지만 배포가 깨진다).
#   fail-safe 로 못박는다. 실연동 시 AUGMENT_EXTERNAL_MODE=http + AUGMENT_API_BASE_URL 로 전환.
authoring:
  augment:
    external:
      mode: ${AUGMENT_EXTERNAL_MODE:noop}

webhook:
  hmac:
    secret:
      # 미설정/빈 값 → BeanInitializationException 으로 기동 차단(HmacWebhookFilter).
      augment: ${WEBHOOK_HMAC_SECRET_AUGMENT:}
  # 운영은 LB/Nginx 뒤에 배포된다. 신뢰 프록시 대역을 지정해야 X-Forwarded-For 가 해석되며,
  # 미지정 시 모든 콜백의 클라이언트 IP 가 프록시 IP 로 수렴해 rate limit 이 전체를 차단할 수 있다(A-ISSUE-15).
  #   prd 는 **명시 필수** — 프록시 뒤면 CIDR, 직접 노출이면 'none' (미설정 시 기동 차단, DEV_FIX M-3).
  trusted-proxy-cidrs: ${WEBHOOK_TRUSTED_PROXY_CIDRS:}
  vlm:
    # VLM 콜백 IP allowlist (B-ISSUE-25 TODO 이행) — 벤더 송신 대역을 지정한다.
    #   prd 는 **명시 필수** — 대역 CIDR 또는 미적용을 뜻하는 'none' (미설정 시 기동 차단, DEV_FIX M-3).
    allowed-ip-cidrs: ${WEBHOOK_VLM_ALLOWED_IP_CIDRS:}
  genai:
    # 생성형 AI 콜백 IP allowlist — VLM 과 달리 **미설정이면 전면 차단**(fail-closed).
    # 신규 연동이라 "미설정 = 전면 허용" 기본값을 물려받지 않는다. 외부 송신 대역을 지정해야 통과한다.
    allowed-ip-cidrs: ${WEBHOOK_GENAI_ALLOWED_IP_CIDRS:}

# 운영(prd) 환경 — API 문서/Swagger UI 노출 차단 (보안: 공격 표면 축소).
#   springdoc 비활성 시 /v3/api-docs, /swagger-ui 모두 404 (SecurityConfig 의 permitAll 무력화).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Phase 12 — 운영 환경 actuator 최소 노출 (보안: env/beans/heapdump 차단)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    kr.co.cudo.authoring: INFO
