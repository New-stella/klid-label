spring:
  # multipart 한도(500MB/1200MB)는 local/dev/stg 가 동일해 application.yml 공통으로 승격됐다.
  #   (수동 업로드 /v1/dev/upload 영상 개당 500MB 수용. 개당 한도는 운영 포함 전 프로파일이 같고,
  #    운영만 application-prd.yml 에서 요청 총량을 1100MB 로 좁힌다.
  #    ⚠ 구 기재 폐기(2026-08-24 CO-008): "운영만 21MB 로 조인다" 는 수동 업로드를 운영에 노출하면서 무효가 됐다)
  # 이중화(HA) — Quartz 클러스터링 **필수**(B-ISSUE-81). 배포 토폴로지가 주 서버 2노드 Active-Active 라
  #   공통 기본값(false)을 상속하면 관제 학습용 스캔(60s)·KPST 폴링(30s)·export sweep(600s) 트리거가
  #   노드마다 중복 발화한다(@DisallowConcurrentExecution 은 스케줄러 인스턴스 내부에서만 유효).
  #   ⚠ QUARTZ_CLUSTERED=false 로 되돌리면 QuartzClusteringGuard 가 기동을 거부한다(설정 우회 불가).
  #   ⚠ 노드 간 시계 동기(NTP/chrony) 필수. clusterCheckinInterval 은 공통 yml 값(20s)을 상속한다.
  quartz:
    properties:
      org.quartz.jobStore.isClustered: ${QUARTZ_CLUSTERED:true}
  datasource:
    control:
      jdbc-url: jdbc:postgresql://${CONTROL_DB_HOST}:${CONTROL_DB_PORT}/${CONTROL_DB_NAME}
      username: ${CONTROL_DB_USERNAME}
      password: ${CONTROL_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
    portal:
      jdbc-url: jdbc:postgresql://${PORTAL_DB_HOST}:${PORTAL_DB_PORT}/${PORTAL_DB_NAME}
      username: ${PORTAL_DB_USERNAME}
      password: ${PORTAL_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

# 스테이징(stg) webhook 설정 — 미설정 시 부팅 차단(fail-closed, REDESIGN R-3).
#
# stg 는 온프렘 개발서버로 **LB/Nginx 뒤**에 배포된다. 그런데 여기에 webhook 키가 없어
# application.yml 의 빈 기본값으로 조용히 떨어졌고, 그 결과 모든 콜백의 클라이언트 IP 가 LB IP
# 하나로 수렴했다(prd 에만 명시 강제가 걸려 있던 사각지대). prd 와 동일 정책으로 정합시킨다.
#   - 프록시 뒤면 신뢰 대역 CIDR(예: 10.0.0.0/8), 프록시 없이 직접 노출이면 'none' 을 **명시**.
#   - 미설정(빈 값) → BeanInitializationException 으로 기동 차단.
#   - `${VAR:?msg}` 는 쓰지 않는다 — Spring 이 "?msg" 를 기본값으로 주입해 fail-fast 가 아니다(H-1).
webhook:
  trusted-proxy-cidrs: ${WEBHOOK_TRUSTED_PROXY_CIDRS:}
  vlm:
    allowed-ip-cidrs: ${WEBHOOK_VLM_ALLOWED_IP_CIDRS:}
  genai:
    # 생성형 AI 콜백 IP allowlist — VLM 과 달리 **미설정이면 전면 차단**(fail-closed).
    # 외부 송신 대역을 지정해야 콜백이 통과한다.
    allowed-ip-cidrs: ${WEBHOOK_GENAI_ALLOWED_IP_CIDRS:}

# [개발/검수 전용] dev 업로드 토글 — stg 는 ON 유지(REVIEWER 인가 게이트가 걸린 엔드포인트).
#
# A-ISSUE-05 — dev 로그인(/v1/dev/tokens)은 **stg 에서 OFF** 로 내린다.
#   이 엔드포인트는 permitAll 이라 인증 없이 임의 userNo/role 토큰을 발급한다. stg 는 온프렘 개발서버로
#   사내망이라도 네트워크 도달 가능한 클라이언트가 존재하므로, `sub=<시드 REVIEWER>` 발급만으로 인증
#   우회 + 관리자 권한 획득이 성립했다. local/dev 만 유지한다.
#   토글이 false 면 DevTokenController/Service 빈이 미등록되고 SecurityConfig 의 permitAll 매처도
#   함께 사라진다(동일 프로퍼티 단일 판정).
#   ★ 여기는 환경변수 플레이스홀더(${DEV_LOGIN_ENABLED:...})를 쓰지 않는다 — stg 는 켤 수 있으면
#     안 되는 값이고, DevToggleProfileGuard 가 prd/stg 에서 활성 시 부팅을 거부한다(H-3).
authoring:
  dev:
    login:
      enabled: false
    upload:
      enabled: ${DEV_UPLOAD_ENABLED:true}
  # Phase 7-A1 — 외부 증강(생성형 AI) 벤더 실연동 전이라 noop 을 명시한다(기본값 http 유출 차단).
  augment:
    external:
      mode: ${AUGMENT_EXTERNAL_MODE:noop}
  # stg 비식별 — 공통 기본값(false)과 동일하나 의도를 명시한다: mock 이 아니라 실제 KPST 위탁 경로로 동작한다.
  #   (자체 채움 우회 경로는 없다 — 비식별 서버가 없으면 파이프라인이 진행되지 않는다)
  integration:
    deidentify:

# UC018 — ㈜KPST 비식별 솔루션 연동. 자체 채움 경로가 없으므로 주소 배선이 <필수>다 — 없으면 비식별이 거부된다.
#   base-url 은 기본값 없이 환경변수로만 주입한다(미주입 시 기동 단계에서 즉시 실패 — 조용한 오연동 방지).
#   공통 기본값(https://localhost:9201)을 상속하면 https 인데 ca-cert 가 비어 KpstWebClientConfig 가
#   fail-closed(CWE-295)로 빈 생성에 실패하므로, stg 에 명시 배선이 없으면 부팅이 차단된다.
#   ★ https 주소를 주입하는 경우 KPST 자체 CA 인증서 경로(KPST_DEID_CA_CERT_PATH)도 반드시 함께 주입할 것.
#     내부망 평문 http://IP:port 주소면 ca-cert 는 불요다.
#   계정(creator-id/req-user-id)·폴링 주기는 application.yml 기본값 사용.
kpst:
  deid:
    base-url: ${KPST_DEID_BASE_URL}

# 로깅 레벨 — 프로파일별 의도를 명시한다(stg 만 애플리케이션 레벨이 비어 있어 root 로 떨어지고 있었다).
#   local/dev: DEBUG — 개발 중 흐름 추적(+ hibernate.SQL DEBUG)
#   stg      : INFO  — 운영 전 단계. 비즈니스 이벤트(적재/배치/검수/통지)는 남기되 DEBUG 소음·PII 노출 위험은 배제
#   prd      : INFO(root WARN) — 운영 기준
logging:
  level:
    root: INFO
    kr.co.cudo.authoring: INFO
