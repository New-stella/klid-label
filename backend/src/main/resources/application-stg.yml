spring:
  datasource:
    control:
      jdbc-url: jdbc:postgresql://${CONTROL_DB_HOST}:${CONTROL_DB_PORT}/${CONTROL_DB_NAME}
      username: ${CONTROL_DB_USERNAME}
      password: ${CONTROL_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
    portal:
      jdbc-url: jdbc:postgresql://${PORTAL_DB_HOST}:${PORTAL_DB_PORT}/${PORTAL_DB_NAME}
      username: ${PORTAL_DB_USERNAME}
      password: ${PORTAL_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
  # dev 업로드(/v1/dev/autolabel-test) 영상 multipart 개당 한도 상향(500MB). 공통 yml 이 이미 multipart 활성.
  #   요청 한도는 포털 50장 업로드(≥1.1GB) 수용 위해 공통(1200MB)과 정합.
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 1200MB

# [개발/검수 전용] dev 로그인/업로드 토글 — stg 는 항상 ON(기존 @Profile("!prd") 동작 유지).
authoring:
  dev:
    login:
      enabled: true
    upload:
      enabled: true

logging:
  level:
    root: INFO
