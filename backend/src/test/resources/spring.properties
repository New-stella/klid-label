# 스프링 테스트 컨텍스트 캐시 상한 — 힙에 맞춘 사이징.
#
# ★왜 낮추나 (근거: 살아 있는 워커 힙 실측, 2026-08-25)
#   캐시는 고장난 적이 없다. 기본 상한 32 를 <설계대로> 채웠고, 그 32칸이 힙보다 컸을 뿐이다.
#     살아 있는 DefaultListableBeanFactory 33개 · 힙 ~2GB  ⇒  컨텍스트 1개 ≈ 60MB
#     32 x 60MB ≈ 1.9GB  vs  테스트 워커 힙 2g   ⇒  회수 불가 → Full GC 무한 반복 → 회귀 미완주
#   컨텍스트 1개의 원가는 대부분 Spring AOP 의 포인트컷 매칭 캐시다
#   (AspectJExpressionPointcut.shadowMatchCache 는 <인스턴스> 필드라 컨텍스트마다 따로 쌓이고
#    컨텍스트가 닫히면 함께 회수된다 — 누수가 아니라 컨텍스트당 정상 원가다).
#   실측: ShadowMatchImpl 3,303,000개 = 컨텍스트당 약 10만 개 = AspectJ 상태만 315MB.
#
# ★왜 이 값이 재생성 폭주를 부르지 않나
#   TestContextGroupingClassOrderer 가 <같은 컨텍스트를 쓰는 클래스를 연속 실행>시킨다.
#   그러면 컨텍스트마다 정확히 한 번만 생성되어 총 생성 횟수가 캐시 크기와 무관하게 최소치가 된다.
#   ⚠ 그 정렬기를 끄면(junit-platform.properties) 이 값은 곧바로 스래싱이 된다. 둘은 짝이다.
#
# ⚠ 이것만으로 「해결」이 아니다 — 컨텍스트 종류 자체를 줄이는 작업이 따로 있고
#   (TestContextDiversityRatchetTest 가 그 수가 늘어나는 것을 막는다), 이 값은 그 작업이
#   진행되는 동안 회귀가 완주하게 해 주는 경계다.
#
# ⚠ 이 파일의 값은 시스템 프로퍼티(-D)보다 <우선>한다.
#   SpringProperties.getProperty 가 클래스패스 spring.properties 를 먼저 보기 때문이다.
#   실행 중에 바꿔 실험하려면 이 파일을 고쳐야 한다.
spring.test.context.cache.maxSize=8
