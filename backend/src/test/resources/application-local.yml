# 테스트 전용 오버라이드 — Testcontainers PostgreSQL 위에서 실행.
#
# Phase 3 (MariaDB → PostgreSQL 전환): 기존 H2 in-memory 설정을 제거했다.
# H2 는 PG 의 ON CONFLICT / GENERATED BY DEFAULT AS IDENTITY 등을 완전 지원하지 못해
# 실제 PG dialect 검증이 불가능했다.
#
# control/portal 데이터소스의 jdbc-url/username/password 는
# PostgresContainerContextCustomizerFactory(META-INF/spring.factories) 가
# 싱글톤 PostgreSQLContainer 의 값으로 런타임 주입한다. 여기서는 driver 만 고정한다.
spring:
  datasource:
    control:
      driver-class-name: org.postgresql.Driver
      # 다수의 @SpringBootTest 컨텍스트가 캐시되며 각각 control/portal HikariCP 풀을 유지한다.
      # 단일 Testcontainers PG(기본 max_connections=100)에서 커넥션 고갈("too many clients")을
      # 방지하기 위해 테스트 풀 크기를 최소화한다.
      # ★ maximum-pool-size 를 늘리지 말 것 — 커넥션 기아 교착(REQUIRES_NEW 중첩 등)을 테스트에서
      #   드러내려는 의도적 설정이다. 늘리면 실제 결함을 가린다.
      maximum-pool-size: 2
      minimum-idle: 0
      # 커넥션 대기 상한. Hikari 기본은 30초라, 풀을 얻지 못하는 상황(JVM 종료 훅에서 Testcontainers 가
      # 이미 내려간 뒤의 잔여 작업 등)에서 호출 1건마다 30초씩 붙잡혔다. 테스트는 실패를 빨리 드러내는
      # 편이 낫고 정상 경로는 즉시 커넥션을 얻으므로 5초로 줄인다.
      # ⚠ DataSourceBuilder(HikariDataSource) + @ConfigurationProperties(spring.datasource.control) 이라
      #   Hikari 프로퍼티는 **평면 바인딩**된다 — maximum-pool-size 와 같은 레벨이어야 하고
      #   `hikari:` 중첩 아래 두면 조용히 무시된다.
      connection-timeout: 5000
    portal:
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 5000
      # ★ 테스트 전용 — 운영에는 이 설정이 없다(main application.yml 의 portal 에는 두지 않았다).
      #   운영의 포털 복제본은 <별개 물리 DB> 의 public 에 설치 단계(17-load-portal-schema.sh)가
      #   로드하므로 스키마를 바꾸지 않는다. 반면 테스트는 control/portal 이 <같은 컨테이너·같은 DB>
      #   를 가리키고 그 안의 복제본 테이블은 Flyway 가 klid_at 에 만든 그것이다. 이 값을 빼면
      #   포털 EMF 가 public 을 뒤져 메타 복제 IT 가 "relation does not exist" 로 깨진다.
      #   ⚠ 미프로비저닝 재현용 빈 DB(portal_unprovisioned)에는 klid_at 이 없지만, PostgreSQL 은
      #     존재하지 않는 스키마를 search_path 에 넣어도 오류가 아니라 무시하므로 그 시나리오는
      #     의도대로 "테이블 없음"으로 재현된다.
      data-source-properties:
        currentSchema: ${DB_SCHEMA:klid_at}

  # Quartz 스케줄러는 테스트에서 기동하지 않는다(잡 등록은 그대로 — 발화만 막는다).
  #   기동시키면 캐시된 @SpringBootTest 컨텍스트마다 QuartzSchedulerThread/MisfireHandler/워커가 상주해
  #   컨텍스트 수명 내내 **같은 QRTZ_* 테이블을 폴링**한다. 컨텍스트가 수십 개면 2개짜리 테스트 풀을
  #   서로 물고 늘어져, 컨텍스트를 닫을 때 Hikari 가 미반납 커넥션을 기다리며 종료가 길어진다.
  #   스케줄러 기동 자체를 검증하는 SchedulerHealthControllerTest 만 @TestPropertySource 로 되켠다.
  quartz:
    auto-startup: false

  flyway:
    enabled: true
    # control 데이터소스(@Primary)에 V0~V52 전부 적용.
    baseline-on-migrate: true
    locations: classpath:db/migration

authoring:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32bytes-minimum}
  batch:
    enabled: false
    # ★ 주기 스윕 전용 executor 격리 (아래 augment/auth/webhook 스윕과 동일 이유)
    #   이 스윕들은 @Scheduled 가 아니라 각자 데몬 스레드 1개짜리 ScheduledExecutorService 로 자가 기동한다
    #   (@EnableScheduling 비의존 — 남의 잡을 깨우지 않으려는 의도적 설계). 그래서 @EnableScheduling 이
    #   전혀 없는 테스트 컨텍스트에서도 **전부 돌고 있었다**. 캐시된 @SpringBootTest 컨텍스트 수십 개가
    #   각각 5~10분 뒤부터 주기적으로 DB 스윕을 돌려 2개짜리 테스트 풀을 물고 늘어졌고, 종료 시에는
    #   Hikari 가 미반납 커넥션을 기다려 JVM 종료 훅이 테스트 실행보다 길어졌다.
    #   ★ 빈은 그대로 등록된다 — 끄는 것은 **스케줄 발화**뿐이고, 스윕 로직은 각 IT 가 빈을 주입받아
    #     직접 호출해 검증한다(BatchRetryStaleReclaim*/VlmSubmitPendingSweeperTest 등).
    retry:
      stale-reclaim:
        enabled: false
    vlm:
      submit-reclaim:
        enabled: false
  # 학습데이터 산출 stale PENDING 정리 잡 — 테스트에서는 Quartz 트리거 등록 비활성화 (training-scan 과 동일 격리).
  #   sweep 로직 검증은 DatasetExportPendingSweeper/TxService 를 단위·IT 에서 직접 호출한다.
  dataset-export:
    pending-sweep:
      enabled: false
    # 실패 export 회수 잡도 동일 격리 — 회수 로직 검증은 DatasetExportFailureRecoverer 를 직접 호출한다.
    failure-recovery:
      enabled: false
    # MED-1(Phase 5C) — export 재생성 디바운스 flush 전용 스케줄러도 동일 격리(기본 활성이나 테스트에서는 false).
    #   운영은 application.yml 기본값(true)으로 활성화되어 승인 후 수정이 재생성까지 도달한다.
    #   테스트에서 켜면 @SpringBootTest 컨텍스트마다 flush 스케줄러 스레드가 상주해 캐시 수명 동안 tick 하므로 끈다.
    #   flush 로직은 flushExpiredWindows() 직접 호출로 검증하고, 스케줄 발화 배선은
    #   ControlNotifyDebounceFlushSchedulerTest 가 전용 스케줄러 tick 을 직접 검증한다.
    regen-flush:
      enabled: false
  # dev-seed.sql 자동 적재 Runner — 일반 테스트 컨텍스트에서는 비활성화하여 시드 INSERT/DELETE 가
  # 다른 통합테스트의 테이블 상태를 오염시키지 않도록 격리한다. DevSeedRunner 전용 테스트는
  # @TestPropertySource(authoring.dev.seed.enabled=true) 로 개별 활성화한다.
  dev:
    # dev 로그인/업로드 토글 — 테스트(local)는 ON 유지(기존 @Profile("!prd") 동작과 동일).
    #   DevTokenController/Service·DevAutolabelTest*·DevPipelineRunner 빈 등록 + /v1/dev/tokens permitAll.
    login:
      enabled: true
    upload:
      enabled: true
    seed:
      enabled: false
  control:
    # 관제 학습용 영상 픽업 스캔 잡 — 테스트에서는 Quartz 트리거 등록 비활성화 (batch 와 동일 격리).
    training-scan:
      enabled: false
  # R4 — 만료 작업락 sweeper. 테스트 기본 비활성(@Scheduled 미발화). sweep 로직 검증은
  #   WorkLockService.sweepExpiredLocks() 를 IT 에서 직접 호출한다(스케줄러 발화에 의존하지 않음).
  work-lock:
    sweep:
      enabled: false
      # 방어적 기본값 — 위 enabled=false 로 이미 빈이 등록되지 않아 지금은 발화 경로가 없다.
      #   앞으로 어떤 @SpringBootTest 가 @TestPropertySource 로 sweep.enabled=true 를 켜더라도
      #   실제 tick 은 돌지 않게 미리 밀어둔다.
      #   ⚠ 이 값은 WorkLockSweepBeanConditionTest 와 무관하다 — 그 테스트는 ApplicationContextRunner
      #     기반이라 이 파일을 아예 로드하지 않는다(현재 sweep.enabled=true 를 켜는 유일한 테스트).
      initial-delay-ms: 86400000
  # UC018 — 테스트 기본은 mock-mode 비식별(외부 KPST 서버 부재 환경 자족). KPST 토글 ON 검증이
  #   필요한 테스트는 @TestPropertySource(kpst.deid.enabled=true) 로 개별 활성화한다.
  integration:
    deidentify:
      mock-mode: true
  # 외부 증강 위탁 WebClient — mode 기본값(http)이라 테스트 컨텍스트에서도 빈이 생성되며 base-url 이
  #   AugmentUrlPolicy 검증을 통과해야 한다. 본 파일은 main 의 application-local.yml 을 통째로 대체하므로
  #   여기에도 명시한다. 목업 주소(평문 http + loopback)는 완화 플래그가 켜진 local/dev 에서만 통과한다.
  augment:
    external:
      base-url: ${AUGMENT_API_BASE_URL:http://localhost:9400}
      allow-insecure-url: true
    # 증강 고아 PENDING 만료 스윕 / 폐기 파생 실삭제 스윕 — 전용 executor 발화만 격리(위 batch 주석 참조).
    #   로직 검증은 AugmentJobExpiryIT/AugmentDiscardPurgeIT 가 스윕 빈을 주입받아 직접 호출한다.
    job-expiry:
      enabled: false
    discard:
      # ⚠ discard 는 enabled 를 끄지 않는다 — 이 토글은 스윕 발화뿐 아니라 **조회 응답 의미**까지
      #   바꾼다(AugmentDiscardStateMapper: 비활성이면 purgeAt 을 null 로 내려 "거짓 예정 시각" 방지).
      #   끄면 폐기 축을 검증하는 API 테스트가 제품 동작 변경으로 깨진다. 그래서 여기서는 **최초 지연만**
      #   24시간으로 밀어 실제 스윕 tick 을 막는다(응답 의미는 기본값 그대로 유지).
      initial-delay-ms: 86400000
  # 역할 승격 시도 원장 정리 잡 — 전용 executor 발화만 격리(RoleClaimAttemptPurgeIT 가 직접 호출).
  auth:
    role-claim:
      purge:
        enabled: false
  # 포털향 메타 복제 Quartz 잡 — 테스트에서는 트리거 등록 자체를 비활성화한다(training-scan 과 동일 격리).
  #   운영은 application.yml 기본값(matchIfMissing/true)으로 활성. 복제 로직은 MetaReplication* 테스트가
  #   워커/서비스를 직접 호출해 검증하며 Quartz 발화에 의존하지 않는다.
  meta-replication:
    enabled: false
  # 관제 통지 디바운스 — 종료 drain(@PreDestroy) 격리. 운영 기본은 application.yml 의 true(현행 동작).
  #   테스트에서 켜두면 캐시된 컨텍스트가 일제히 닫힐 때마다 DB 트랜잭션을 열어, 축소된 풀에서
  #   커넥션을 기다리며 JVM 종료가 길어진다. 축적분은 DB 에 남으므로 생략해도 유실이 아니고,
  #   drain 로직은 ControlNotifyDebouncerTest 가 flushAll() 을 직접 호출해 검증한다.
  control-notify:
    debounce-shutdown-flush-enabled: false
    # dead-letter 재전송 잡(@Scheduled) — 아래 "남의 @Scheduled 잡" 주석 참조.
    retry:
      initial-delay-ms: 86400000
  # ★ @EnableScheduling 이 켜진 소수 컨텍스트에서 함께 깨어나는 "남의 @Scheduled 잡" 억제.
  #   @EnableScheduling 은 기능 플래그 조건부(WorkLockSweepConfig / ControlNotifySchedulingConfig)라
  #   대부분의 테스트 컨텍스트에는 없지만, control-notify/work-lock 토글을 켜는 테스트 컨텍스트에서는
  #   **게이팅 없는 남의 @Scheduled 잡까지 함께 발화**한다(설계 주석이 경고하는 바로 그 현상).
  #   이 잡들에는 개별 enabled 토글이 없으므로 **최초 지연을 24시간으로 밀어** 테스트 실행 중에는
  #   발화하지 않게 한다(빈 등록·배선은 전혀 건드리지 않는다 — 운영 기본값은 application.yml 그대로).
  upload:
    tus:
      cleanup:
        initial-delay-ms: 86400000
  # 스트림 단기 서명 URL 검증 — 서명 발급/검증은 fail-closed 라 테스트에서도 시크릿이 설정되어야 동작한다.
  # 최소 32B(256bit) 이상 (StreamUrlSigner.MIN_SECRET_BYTES).
  stream:
    sign-secret: ${STREAM_SIGN_SECRET:test-stream-sign-secret-change-me-32bytes-min}

# webhook 콜백 인증 — 시크릿이 빈 값이면 **기동 실패**(fail-closed, E-ISSUE-04) 이므로 테스트에도 필수.
#   본 파일은 main 의 application-local.yml 을 통째로 대체하므로(테스트 classpath 우선) 여기에도 명시한다.
#   최소 32B(256bit). 개별 IT 는 @TestPropertySource 로 자기 값을 덮어써 서명 정합을 맞춘다.
webhook:
  hmac:
    secret:
      augment: ${WEBHOOK_HMAC_SECRET_AUGMENT:test-augment-callback-hmac-secret-32bytes-min}
  # 웹훅 가드(idempotency/nonce) 원장 정리 잡 — 전용 executor 발화만 격리(위 authoring.batch 주석 참조).
  #   정리 로직은 JdbcWebhookGuardStoreIT 가 purgeJob 을 주입받아 직접 호출해 검증한다.
  guard:
    purge:
      enabled: false
  # 신뢰 프록시 미설정 = X-Forwarded-For 전면 무시(테스트 기본).
  trusted-proxy-cidrs: ""
  vlm:
    # VLM 콜백 IP allowlist 미설정 = 미적용(테스트 기본).
    allowed-ip-cidrs: ""
  genai:
    # 생성형 AI 콜백 allowlist 는 미설정 시 **전면 차단**(fail-closed) 이라, MockMvc 요청
    # (remoteAddr=127.0.0.1) 이 통과하도록 통합테스트 기본을 열어 둔다. 차단 동작 자체는
    # GenAiWebhookIpAllowlist 단위 테스트가 격리 검증한다.
    allowed-ip-cidrs: "0.0.0.0/0"

# UC018 — 테스트 기본은 KPST 폴링 OFF (ca.crt 미보유 환경 보호 — KpstWebClientConfig fail-closed 회피).
#   KPST 토글 ON 검증 테스트는 @TestPropertySource(kpst.deid.enabled=true)+test-ca.crt 로 개별 활성화한다.
kpst:
  deid:
    enabled: false

# 포털 업로드 정리 잡(@Scheduled) — 위 authoring.upload.tus.cleanup 과 동일 이유로 최초 지연을 밀어둔다.
portal:
  upload:
    sweep:
      initial-delay-ms: 86400000

logging:
  level:
    root: INFO
    kr.co.cudo.authoring: DEBUG
    org.hibernate.SQL: DEBUG
