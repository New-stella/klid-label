# 테스트 전용 H2 오버라이드 — main/resources/application-local.yml(252 MariaDB)을 덮어씀
# Spring Boot가 src/test/resources의 application-{profile}.yml을 우선 로드하므로
# 모든 @ActiveProfiles("local") 테스트는 본 파일을 통해 H2 in-memory에서 실행됨.
# 운영 bootRun --spring.profiles.active=local 은 main/resources의 252 DB 설정 사용.
spring:
  datasource:
    control:
      jdbc-url: jdbc:h2:mem:klid_system;MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver
    portal:
      jdbc-url: jdbc:h2:mem:portal;MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver

  flyway:
    enabled: true

authoring:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32bytes-minimum}
  integration:
    control-server:
      m2m-token: ${CONTROL_M2M_TOKEN:dev-m2m-token-32bytes-or-longer-please}
    portal-server:
      m2m-token: ${PORTAL_M2M_TOKEN:dev-m2m-token-32bytes-or-longer-please}
    gitea:
      token: ${GITEA_TOKEN:dev-gitea-token}
  batch:
    enabled: false

logging:
  level:
    root: INFO
    kr.co.cudo.authoring: DEBUG
    org.hibernate.SQL: DEBUG
