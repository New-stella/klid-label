# 시험 클래스를 <컨텍스트 시그니처>로 묶어 연속 실행시킨다.
#
# 같은 스프링 컨텍스트를 쓰는 클래스들이 실행 순서상 흩어져 있으면 캐시에서 서로를 밀어내
# 같은 컨텍스트를 여러 번 만든다. 묶어서 실행하면 컨텍스트마다 정확히 한 번만 생성되고,
# 그래야 spring.properties 의 낮춘 캐시 상한이 재생성 폭주 없이 성립한다(둘은 짝이다).
#
# ⚠ 실행 순서를 바꾸는 설정이다. 시험이 순서에 의존하고 있었다면 여기서 드러난다.
#   그런 실패가 나면 이 설정을 되돌릴 것이 아니라 그 순서 의존을 고쳐야 한다 —
#   순서 의존은 이 설정이 없어도 언젠가 다른 계기로 터진다.
junit.jupiter.testclass.order.default=kr.co.cudo.authoring.support.TestContextGroupingClassOrderer
