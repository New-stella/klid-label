plugins {
    id 'java'
    // 외부 WAS 반입용 WAR 산출(@design DEPLOY-001). 실행 가능 JAR 는 그대로 유지한다 —
    //   개발 형상이 컨테이너에서 그 산출물로 기동하고 있어 갈아치우면 개발이 멈춘다.
    id 'war'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'org.flywaydb.flyway' version '10.22.0'
}

group = 'kr.co.cudo'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// HIGH-3 fix (OWASP A03:2025 Software Supply Chain Failures):
// 모든 configuration 의존성 버전을 gradle.lockfile 에 고정.
// 의존성 갱신 시: ./gradlew dependencies --write-locks
dependencyLocking {
    lockAllConfigurations()
}

ext {
    queryDslVersion = '5.1.0'
    mapstructVersion = '1.5.5.Final'
    // Flyway — Spring Boot 3.3.0 BOM 이 관리하는 10.10.0 을 덮어쓴다.
    //   그 판은 PostgreSQL 을 16 까지만 지원한다고 선언한다(ensureSupported 의 상한).
    //   상한이 17 로 올라가는 첫 판이 10.20.0 이고 여기서는 10.x 최신을 쓴다 — 메이저를
    //   넘기지 않아 체크섬 알고리즘과 설정 키가 그대로다(11 이상은 별건으로 검토한다).
    //
    //   ★ 이 상향이 듣는 곳은 <Flyway 를 실제로 도는 형상>뿐이다 — 로컬과 dev.
    //     dev 는 control 데이터소스가 관제 DB(PostgreSQL 17)에 붙어 기동마다 지원 범위 밖
    //     경고가 뜨고 마이그레이션이 검증되지 않은 조합에서 돌고 있었다.
    //   ⚠ 온프렘(stg/prd)은 대상이 아니다 — 그 형상은 SPRING_FLYWAY_ENABLED=false 로
    //     마이그레이션을 밟지 않고 완성된 스키마 스냅샷 한 벌을 붓는다. 이 값을 근거로
    //     온프렘 쪽 위험이 해소된다고 읽지 말 것.
    //   ⚠ 위 flyway 플러그인 버전과 함께 올린다. 갈리면 gradle 태스크와 런타임이
    //     서로 다른 판으로 동작한다.
    set('flyway.version', '10.22.0')
}

// Phase 3: Spring Boot BOM 이 org.testcontainers:* 를 1.19.8(docker-java 3.3.6)로 핀하므로
// junit-jupiter/postgresql 만 1.20.4 로 올려도 core 가 1.19.8 로 남아 docker-java 가
// API 1.32 로 협상한다. Testcontainers BOM 을 1.20.4 로 임포트해 모든 모듈/도커자바를 정렬.
dependencyManagement {
    imports {
        mavenBom 'org.testcontainers:testcontainers-bom:1.20.4'
    }
}

dependencies {
    // ★ 외부 WAS 반입 시 톰캣을 산출물에 넣지 않는다(@design DEPLOY-001).
    //   war 플러그인이 만드는 providedRuntime 에 선언하면 bootWar 가 이를 WEB-INF/lib-provided 로
    //   보내 WEB-INF/lib 에서 빼준다 — 컨테이너가 이미 제공하는 서블릿 구현이 중복 적재되면
    //   ClassCastException·리스너 이중 등록으로 기동이 깨진다.
    //   ⚠ bootJar 는 providedRuntime 을 runtimeClasspath 로 함께 담으므로 실행 가능 JAR 는
    //     내장 톰캣을 그대로 갖는다(개발 형상 무영향).
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    // Spring Boot core
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Phase 12 — Caffeine 캐시 (시스템 설정 TTL 60s)
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Phase 12 — Prometheus 메트릭 노출 (/actuator/prometheus)
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // JSON logging
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // JWT (관제서버/포털 발급 토큰 검증)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // QueryDSL (복잡한 조회용 — 데이터마트 검색 등)
    implementation "com.querydsl:querydsl-jpa:${queryDslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${queryDslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // MapStruct (DTO <-> Entity 변환)
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // DB
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // HTTP clients (관제서버/포털/비식별서버/Gitea/ai-server 연동)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'  // WebClient
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-reactor:2.2.0'

    // FFmpeg wrapper (Java)
    implementation 'net.bramp.ffmpeg:ffmpeg:0.8.0'

    // Quartz (기존 QRTZ_* 테이블과 호환되는 스케줄러)
    implementation 'org.springframework.boot:spring-boot-starter-quartz'

    // OpenAPI 문서 (Swagger)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly   'org.junit.platform:junit-platform-launcher'
    // Phase 3: Docker Desktop(API ≥1.40) 호환을 위해 docker-java 3.4.x 를 포함한 1.20.x 사용.
    // 버전은 위 testcontainers-bom 1.20.4 가 일괄 관리 (core/docker-java 정렬).
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

tasks.named('test') {
    useJUnitPlatform()

    // Phase 4 (UC018 통합 테스트 추가): 캐시되는 @SpringBootTest 컨텍스트 수가 늘어 기본 힙에서
    // 워커 OutOfMemoryError(→ NoClassDefFoundError: ExceptionUtils) 가 간헐 발생한다. 테스트 워커
    // 힙을 명시해 안정화한다(Testcontainers 단일 PG + 다수 컨텍스트 캐시 대비 여유분).
    //
    // ★2026-08-25 상향 (2g → 6g): 2g 로는 전체 회귀가 완주하지 못한다. 실측에서 힙이
    // 2,094,387K/2,097,152K(99.87%)까지 차고 young 세대가 1 region(1MB)만 남아, GC 가 CPU 689% 로
    // 도는 채 진행이 사실상 멈췄다. 워커 하나가 전 테스트를 떠안는데(forkEvery 없음)
    // @SpringBootTest 컨텍스트 캐시가 힙을 채우는 구조이고, 테스트가 7,439건으로 늘면서 2g 를
    // 넘어섰다. 6g 로는 7분 32초에 완주했다(826 XML / 7,439 tests / 실패 0).
    //   ⚠ 머신 메모리 부족이 아니다 — 시스템 여유 61%(24GB 머신)인 상태에서도 같은 지점에서 막혔다.
    //     "메모리를 비우고 다시 돌린다"로는 해결되지 않으므로 그 진단으로 되돌리지 말 것.
    //   ⚠ 이것은 시간을 번 미봉책이지 근본 처방이 아니다. 캐시 상한(기본 32)도 forkEvery 도 없는
    //     구조가 그대로라 테스트가 더 늘면 같은 방식으로 재발한다 — 바로 위 Phase 4 기록이 그
    //     반복이다(그때도 기본 힙 → 2g 였다). 근본 처방은 spring.test.context.cache.maxSize 상한
    //     (축출된 컨텍스트를 Spring 이 닫아 메모리를 실제로 반환한다) 또는 컨텍스트 구성 다양성
    //     축소이며, 별건이다. 힙과 캐시 상한을 같이 올리면 어느 쪽이 들었는지 판별할 수 없으므로
    //     이번에는 힙만 건드렸다.
    //   ⚠ 진행 판정에 결과 XML 개수를 쓰지 말 것 — Gradle 은 XML 을 test 태스크가 끝날 때 일괄
    //     생성하므로 실행 중에는 언제나 0이다(정상 실행도 그렇다). 실시간 진행은
    //     build/test-results/test/binary/output.bin 크기 증가로 본다. 살아 있는 고갈 증상은
    //     힙 점유율 99%대 + young 세대가 1 region 까지 마르는 것이다.
    maxHeapSize = '6g'

    // Phase 3 (Testcontainers PostgreSQL): Docker Desktop 서버는 min API 1.40 을 요구하는데
    // (docker version → Server APIVersion 1.54, MinAPIVersion 1.40), docker-java 클라이언트가
    // 기본 API 1.32 로 핑/info 를 보내 데몬이 "client version too old" 로 거부한다(/info → 400).
    // ~/.testcontainers.properties 의 UnixSocketClientProviderStrategy(소켓 전략)는 그대로 두고,
    // API 버전만 1.44 로 고정해 회피한다. (1.40~1.54 구간 모두 200 응답 확인, 여유분 1.44 사용)
    //
    // 주의: Testcontainers 1.20.4 가 셰이딩한 docker-java(DefaultDockerClientConfig)는
    // 환경변수 중 DOCKER_HOST/DOCKER_TLS_VERIFY/DOCKER_CONFIG/DOCKER_CERT_PATH/DOCKER_CONTEXT 만
    // 매핑하고 DOCKER_API_VERSION 은 매핑하지 않는다. API 버전은 오직 'api.version' (system property
    // 또는 ~/.testcontainers.properties) 로만 주입 가능하므로, env 가 아닌 systemProperty 로 고정한다.
    systemProperty 'api.version', '1.44'

    // 활성 Docker context 의 소켓을 명시(desktop-linux → ~/.docker/run/docker.sock,
    // /var/run/docker.sock 가 여기로 심볼릭). 소켓 전략 자체는 정상이므로 strategy 는 덮어쓰지 않는다.
    def desktopSock = file("${System.getProperty('user.home')}/.docker/run/docker.sock")
    if ((System.getenv('DOCKER_HOST') == null || System.getenv('DOCKER_HOST').isBlank()) && desktopSock.exists()) {
        environment 'DOCKER_HOST', "unix://${desktopSock.absolutePath}"
    }

    // Ryuk(reaper) 컨테이너도 동일 API 버전 이슈로 막히지 않도록 비활성화.
    environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
}

// ★ WAR 산출물 이름 = 웹 컨텍스트 (@design DEPLOY-001)
//   WAR 배포에서는 server.servlet.context-path 가 <적용되지 않는다> — 컨텍스트는 컨테이너가
//   WAR 파일명(또는 컨텍스트 설정)으로 정한다. 지금 API 주소가 전부 /api 하위이므로 파일명을
//   api.war 로 고정해 주소 체계를 그대로 유지한다.
//   ⚠ ROOT.war 로 바꾸면 컨텍스트가 '/' 가 되어 프론트엔드·관제의 모든 호출이 404 가 된다.
//     이름을 바꾸려면 그 두 소비자의 주소를 함께 바꿔야 한다.
tasks.named('bootWar') {
    archiveFileName = 'api.war'
}

// 일반 war 태스크는 쓰지 않는다 — bootWar 가 의존성까지 담은 배포 가능 산출물을 만든다.
//   둘 다 활성이면 build 가 내용이 다른 war 두 개를 만들어 어느 것을 반입할지 모호해진다.
tasks.named('war') {
    enabled = false
}

// QueryDSL Q-class 생성 경로
def querydslDir = "$buildDir/generated/querydsl"
sourceSets {
    main.java.srcDirs += [querydslDir]
}
tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory.set(file(querydslDir))
}
clean {
    delete file(querydslDir)
}
